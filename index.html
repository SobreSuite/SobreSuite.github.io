<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SobreSuite</title>
<meta name="description" content="SobreSuite : des logiciels frugaux, hors ligne, pensés pour aller à l'essentiel. Un seul fichier HTML par application.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 15 11' shape-rendering='crispEdges'%3E%3Cpath fill='%233A3733' d='M0 0h15v11H0z'/%3E%3Cpath fill='%233A3733' d='M1 1h13v9H1z'/%3E%3Cpath fill='%23FCF5E5' d='M3 3h1v1H3zM4 4h1v1H4zM5 5h1v1H5zM4 6h1v1H4zM3 7h1v1H3zM7 7h4v1H7z'/%3E%3C/svg%3E">
<style>
/* Bureau Mac 1 bit : bureau tramé, barre de menus, fenêtres que l'on déplace
   par leur barre de titre (le contour suit la souris, comme en 1984). */
:root{
  --ink:#000000;
  --paper:#ffffff;
  --dither:#9a9a9a;
  --mute:#4f4f4f;
  --sage:#FCF5E5;
  --logo:#3A3733;
  --rouge:#D7141A;
  --bleu:#1F3FD1;
  --vert:#128A2E;
  --jaune:#FFD600;
  --ui:'VT323','Geneva','Chicago',ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:14px;overflow:hidden;
  font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0;-webkit-font-smoothing:auto}
button,input,select,textarea{font:inherit;color:inherit;font-variant-ligatures:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
svg.px,.px svg{shape-rendering:crispEdges}

#app{height:100%;display:flex;flex-direction:column;overflow:hidden;background:repeating-conic-gradient(var(--dither) 0 25%,var(--bureau) 0 50%) 0 0/2px 2px}

/* ---------- Barre de menus ---------- */
#menubar{flex:none;height:24px;background:var(--paper);border-bottom:1px solid var(--ink);display:flex;align-items:stretch;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:50;
  overflow-x:auto;scrollbar-width:none}
#menubar::-webkit-scrollbar{display:none}
.mb-btn{border:0;background:transparent;padding:0 10px;height:23px;cursor:pointer;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.mb-btn[aria-expanded="true"]{background:var(--ink);color:var(--paper)}
.mb-logo svg{width:22px;height:16px;display:block}
.mb-logo[aria-expanded="true"] svg{outline:1px solid var(--paper)}
.mb-spacer{flex:1}
.mb-clock{font-size:13px;padding:0 4px 0 10px;display:flex;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.menu{position:fixed;z-index:60;background:var(--paper);border:1px solid var(--ink);box-shadow:2px 2px 0 var(--ink);min-width:240px;padding:2px 0;font-size:14px}
.menu button{display:flex;width:100%;border:0;background:transparent;text-align:left;padding:3px 14px 3px 22px;gap:24px;cursor:pointer;position:relative;white-space:nowrap}
.menu button:hover:not([disabled]),.menu button:focus-visible{background:var(--ink);color:var(--paper);outline:none}
.menu button[disabled]{color:var(--inactif);cursor:default}
.menu .k{margin-left:auto;opacity:.85}
.menu button[aria-checked="true"]::before{content:'✓';position:absolute;left:7px}
.menu hr{border:0;border-top:1px dotted var(--ink);margin:3px 0}

/* ---------- Boutons ---------- */
.btn{font-family:var(--ui);font-size:13px;background:var(--paper);border:1px solid var(--ink);border-radius:4px;padding:0 10px;height:28px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover:not([disabled]){background:var(--survol)}
.btn:active:not([disabled]),.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn[disabled]{color:var(--inactif);border-color:var(--inactif);cursor:default}
.btn.default{outline:3px solid var(--ink);outline-offset:1px;border-radius:6px}

/* ---------- Bureau ---------- */
#desk{flex:1;min-height:0;position:relative;overflow:hidden}
.dicons{position:absolute;top:14px;right:max(12px,env(safe-area-inset-right,0px));bottom:14px;width:104px;display:flex;flex-direction:column;align-items:center;gap:16px;z-index:1}
.dicon,.app{border:0;background:transparent;padding:2px;cursor:default;display:flex;flex-direction:column;align-items:center;font-family:var(--ui);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.dicon:focus,.app:focus{outline:none}
.dicon svg,.app svg{width:64px;height:64px;display:block}
.lab{margin-top:5px;padding:1px 5px;background:var(--paper);font-size:13px;line-height:15px;white-space:nowrap}
.dicon[aria-selected="true"] svg,.app[aria-selected="true"] svg{filter:invert(1)}
.dicon[aria-selected="true"] .lab,.app[aria-selected="true"] .lab{background:var(--ink);color:var(--paper)}
.dicon:focus-visible .lab,.app:focus-visible .lab{outline:1px dotted var(--ink);outline-offset:1px}
.app:focus-visible[aria-selected="true"] .lab{outline-color:var(--paper);outline-offset:-3px}

/* ---------- Fenêtres ---------- */
.win{position:absolute;left:0;top:0;background:var(--paper);border:1px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:flex;flex-direction:column;max-width:calc(100% - 24px);z-index:2}
.tb{height:21px;flex:none;border-bottom:1px solid var(--ink);display:flex;align-items:center;justify-content:center;position:relative;padding:4px 3px;user-select:none;-webkit-user-select:none;touch-action:none;cursor:default;
  background:repeating-linear-gradient(var(--ink) 0 1px,var(--paper) 1px 2px);background-clip:content-box;background-origin:content-box}
.win:not(.active) .tb{background:none}
.win:not(.active) .wbox{visibility:hidden}
.tb-title{background:var(--paper);padding:0 10px;font-size:14px;line-height:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:78%}
.wbox{position:absolute;top:3px;left:8px;width:13px;height:13px;border:1px solid var(--ink);background:var(--paper);padding:0;box-shadow:0 0 0 2px var(--paper);cursor:pointer}
.wbox:active{background:var(--ink)}
.ghost{position:absolute;z-index:4000;border:1px dotted var(--ink);outline:1px dotted var(--paper);pointer-events:none}
.zoom{position:fixed;z-index:4000;border:1px dotted var(--ink);pointer-events:none}

/* Dossiers Applications et Document, façon Finder */
#w-apps,#w-docs{width:600px}
.finfo{display:flex;font-size:12px;border-bottom:3px double var(--ink);flex:none}
.finfo>span{flex:1;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.finfo>span:first-child{text-align:left}
.finfo>span:last-child{text-align:right}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 6px;padding:20px 12px 18px;flex:1;min-height:0;overflow:auto}
.app .tagl{display:none}
.app.soon svg{opacity:.38}
.app .soon-tag{font-size:11px;color:var(--mute);margin-top:2px;letter-spacing:.04em}
/* vue en liste */
.apps.list{display:block;padding:0}
.apps.list .lhead,.apps.list .app{display:grid;grid-template-columns:44px 104px 1fr 92px;align-items:center;text-align:left;width:100%;gap:0 8px}
.apps.list .lhead{font-size:12px;border-bottom:1px solid var(--ink);padding:3px 10px;position:sticky;top:0;background:var(--paper);z-index:1}
.apps.list .app{padding:4px 10px;border-bottom:1px dotted var(--inactif)}
.apps.list .app svg{width:32px;height:32px}
.apps.list .app .lab{margin:0;padding:0;background:none;font-weight:600}
.apps.list .app .tagl{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.apps.list .app .st{font-size:12px;color:var(--mute)}
.apps.list .app .soon-tag{display:none}
.apps.list .app[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.apps.list .app[aria-selected="true"] svg{filter:none;background:var(--paper);outline:2px solid var(--paper)}
.apps.list .app[aria-selected="true"] .lab,.apps.list .app[aria-selected="true"] .st{background:none;color:var(--paper)}
.apps:not(.list) .lhead,.apps:not(.list) .st{display:none}
.detail{border-top:1px solid var(--ink);display:flex;gap:12px;align-items:center;padding:10px 12px;min-height:70px;flex:none}
.detail svg{width:32px;height:32px;flex:none}
.detail .dt{flex:1;min-width:0;font-size:13px;line-height:1.4}
.detail .dt b{font-size:14px;font-weight:600}
.detail .dt .muted{color:var(--mute)}
.detail .db{display:flex;gap:10px;flex:none}

/* Lisez-moi, façon TeachText */
#w-read{width:470px}
.doc{padding:14px 22px 20px;overflow:auto;flex:1;min-height:0;line-height:1.5;font-size:14px;max-height:62vh}
.doc h1{font-size:20px;font-weight:600;margin:0 0 2px}
.doc h2{font-size:15px;font-weight:600;margin:18px 0 4px}
.doc p{margin:0 0 8px}
.doc ul{margin:0 0 8px;padding-left:1.2em}
.doc li{margin-bottom:3px}
.doc .lead{font-size:15px;margin-bottom:10px}
.doc .appl{display:grid;grid-template-columns:36px 1fr;gap:4px 10px;align-items:center;margin:8px 0}
.doc .appl svg{width:32px;height:32px}
.doc .small{font-size:12px;color:var(--mute)}
.doc::-webkit-scrollbar,.apps::-webkit-scrollbar{width:16px}
.doc::-webkit-scrollbar-track,.apps::-webkit-scrollbar-track{border-left:1px solid var(--ink);background:repeating-conic-gradient(var(--dim) 0 25%,var(--paper) 0 50%) 0 0/2px 2px}
.doc::-webkit-scrollbar-thumb,.apps::-webkit-scrollbar-thumb{background:var(--paper);border:1px solid var(--ink)}
.doc,.apps{scrollbar-color:var(--ink) var(--dim)}

/* ---------- Dialogues ---------- */
.ov{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:color-mix(in srgb,var(--paper) 35%,transparent)}
.dlg{background:var(--paper);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);outline:1px solid var(--ink);outline-offset:-6px;padding:16px 18px;max-width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0;font-size:16px;font-weight:600}
.dlg p{margin:0;line-height:1.45;font-size:14px}
.dlg ul{margin:0;padding-left:1.2em;line-height:1.5;font-size:14px}
.dlg li{margin-bottom:2px}
.dlg-row{display:flex;gap:14px;align-items:flex-start}
.dlg-row svg{width:64px;height:64px;flex:none}
.dlg-btns{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap;border-top:1px solid var(--ink);padding-top:12px;margin-top:2px}
.dlg-btns .left{margin-right:auto}
.cap{font-size:11px;color:var(--mute);letter-spacing:.06em}
.keys{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;font-size:13px}
.keys b{font-weight:600}
.url{font-size:12px;color:var(--mute);word-break:break-all}
.about{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:6px 10px}
.about svg{width:64px;height:64px}
.about .nm{font-size:30px;font-weight:600;color:var(--logo);line-height:1;margin-top:4px}
.about .tg{font-size:13px;color:var(--logo);margin-top:-4px}

/* ---------- Accueil et fermeture ---------- */
#splash,.quit{position:fixed;inset:0;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;text-align:center}
#splash{z-index:200;cursor:pointer;transition:opacity .25s ease}
#splash.out{opacity:0}
.quit{z-index:210;gap:22px}
.sp-logo{display:flex;flex-direction:column;align-items:center;gap:12px}
.sp-logo svg{width:128px;height:128px;display:block}
.sp-name{margin:0;font-size:clamp(38px,9vw,60px);font-weight:600;line-height:1;color:var(--logo);letter-spacing:.01em}
.sp-tag{margin:0;font-size:20px;color:var(--logo)}
.sp-bar{width:min(340px,70vw);height:14px;border:1px solid var(--logo);padding:2px;background:var(--paper)}
.sp-fill{height:100%;width:0;background:var(--logo);animation:spfill 3s steps(24,end) forwards}
@keyframes spfill{to{width:100%}}
.sp-go{border:0;background:transparent;font-family:var(--ui);font-size:13px;color:var(--mute);cursor:pointer;padding:4px 8px}
.sp-go:hover,.sp-go:focus-visible{color:var(--ink);text-decoration:underline}
.sp-copy{margin:0;font-family:var(--ui);font-size:12px;color:var(--mute);letter-spacing:.04em}
.q-msg{margin:0;font-size:15px}

/* ---------- Petits écrans : les fenêtres s'empilent ---------- */
@media (max-width:720px){
  #desk{overflow:auto;display:flex;flex-direction:column;gap:16px;padding:14px max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
  .dicons{position:static;width:auto;flex-direction:row;justify-content:center;gap:10px;flex:none}
  .dicon svg{width:48px;height:48px}
  .win{position:relative;left:auto!important;top:auto!important;width:auto!important;max-width:none;flex:none;z-index:auto!important}
  .win:not(.active) .tb{background:repeating-linear-gradient(var(--ink) 0 1px,var(--paper) 1px 2px);background-clip:content-box;background-origin:content-box}
  .win:not(.active) .wbox{visibility:visible}
  .doc{max-height:none}
  .detail{flex-wrap:wrap}
  .detail .db{width:100%;justify-content:flex-end}
  .apps.list .lhead,.apps.list .app{grid-template-columns:40px 1fr 70px}
  .apps.list .lhead span:nth-child(3),.apps.list .app .tagl{display:none}
}
@media (max-width:380px){
  .apps{grid-template-columns:repeat(2,1fr)}
}
</style>

<script id="sobre-theme-js">
/* Apparence (Clair, Sombre, Automatique), commune à toute la gamme : le choix est gardé dans le navigateur
   et vaut pour toutes les apps ouvertes depuis le même endroit. Événement « sobre-theme » à chaque changement. */
(function(){
  var K='sobre.apparence',d=document.documentElement,mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
  function get(){var m='light';try{m=localStorage.getItem(K)||'light'}catch(e){}return m==='dark'||m==='auto'?m:'light'}
  function eff(m){return m==='auto'?(mq&&mq.matches?'dark':'light'):m}
  /* images à deux versions (logos d'accueil) : data-clair / data-sombre */
  function imgs(t){var L=document.querySelectorAll('img[data-sombre]');for(var k=0;k<L.length;k++){var i=L[k],u=t==='dark'?i.getAttribute('data-sombre'):i.getAttribute('data-clair');if(u&&i.getAttribute('src')!==u)i.setAttribute('src',u)}}
  function apply(){var m=get(),t=eff(m);d.setAttribute('data-apparence',m);d.setAttribute('data-theme',t);imgs(t);
    try{window.dispatchEvent(new CustomEvent('sobre-theme',{detail:{mode:m,theme:t}}))}catch(e){}}
  var T=window.SobreTheme={
    get:get,
    theme:function(){return eff(get())},
    dark:function(){return eff(get())==='dark'},
    set:function(m){try{localStorage.setItem(K,m)}catch(e){}apply()},
    color:function(n){return getComputedStyle(d).getPropertyValue('--'+n).trim()},
    labels:[['light','Apparence claire'],['dark','Apparence sombre'],['auto','Apparence automatique']],
    /* éléments de menu prêts à l'emploi : court=true donne « Claire / Sombre / Automatique » (sous un intitulé « Apparence ») */
    items:function(court){var m=get();return [['light','Claire'],['dark','Sombre'],['auto','Automatique']].map(function(x){
      return {l:court?x[1]:'Apparence '+x[1].toLowerCase(),chk:m===x[0],a:function(){T.set(x[0])}}})}
  };
  if(mq){var f=function(){if(get()==='auto')apply()};if(mq.addEventListener)mq.addEventListener('change',f);else if(mq.addListener)mq.addListener(f)}
  window.addEventListener('storage',function(e){if(e.key===K)apply()});
  document.addEventListener('DOMContentLoaded',function(){imgs(eff(get()))});
  apply();
})();
</script>

<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const VERSION='0.5';
const STORE='sobre-suite:v1';
const IS_MAC=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent||'');
const MOD=IS_MAC?'⌘':'Ctrl+';

/* =========================================================
   Adresses. Tout tient dans un seul dépôt, SobreSuite.github.io :
     index.html          cette page
     apps/<Nom>.html     une application (SobreTeX.html, SobrePiX.html…)
     logos/              les logos de la suite
     SobreSuite.zip      la suite à télécharger
   Les liens vers les applications sont relatifs (apps/<Nom>.html) :
   ils marchent en ligne comme depuis le dossier décompressé.
   ========================================================= */
const PAGES='https://sobresuite.github.io/';
const REPO='https://github.com/SobreSuite/SobreSuite.github.io';
const BRANCH='main';
// Le fichier à télécharger, posé à la racine du dépôt
const ZIP='SobreSuite.zip';
// Ouverte depuis le dossier décompressé (file://) : version locale
const LOCAL=location.protocol==='file:';

/* =========================================================
   Icônes en pixels, 32 × 32
   ========================================================= */
const PAL={k:'#000000',w:'#ffffff',r:'#D7141A',b:'#1F3FD1',y:'#FFD600',g:'#128A2E',o:'#FF8200',v:'#7A1FB8',s:'#9a9a9a',l:'#d4d4d4',a:'#3A3733',n:'#3A3733',p:'#FCF5E5'};
const GLYPH={
  P:['###','#.#','###','#..','#..'],D:['##.','#.#','#.#','#.#','##.'],F:['###','#..','##.','#..','#..'],
  J:['..#','..#','..#','#.#','###'],'5':['###','#..','###','..#','###'],'+':['...','.#.','###','.#.','...'],Z:['###','..#','.#.','#..','###'],I:['###','.#.','.#.','.#.','###'],O:['###','#.#','#.#','#.#','###'],K:['#.#','#.#','##.','#.#','#.#'],
  1:['.#.','##.','.#.','.#.','###'],2:['###','..#','###','#..','###'],3:['###','..#','.##','..#','###'],
  a:['.#.','###','#.#'],b:['##.','###','##.'],c:['###','#..','###'],d:['##.','#.#','##.']
};
function icon(draw){
  const n=32,G=new Array(n*n).fill(null);
  const set=(x,y,c)=>{if(x>=0&&y>=0&&x<n&&y<n)G[y*n+x]=c;};
  const A={
    R(x,y,w,h,c){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)set(i,j,c);},
    RR(x,y,w,h,c){A.R(x,y,w,h,c);[[x,y],[x+w-1,y],[x,y+h-1],[x+w-1,y+h-1]].forEach(p=>set(p[0],p[1],null));},
    P(c,pts){for(const p of pts)set(p[0],p[1],c);},
    F(t,c){for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(t(x+.5,y+.5))set(x,y,c);},
    FO(t,c){
      const inn=(x,y)=>t(x+.5,y+.5);
      for(let y=0;y<n;y++)for(let x=0;x<n;x++){
        if(inn(x,y))continue;
        let near=false;
        for(let dy=-1;dy<=1&&!near;dy++)for(let dx=-1;dx<=1;dx++)if(inn(x+dx,y+dy)){near=true;break;}
        if(near)set(x,y,'k');
      }
      A.F(t,c);
    },
    D(x,y,w,h,c1,c2){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)set(i,j,(i+j)%2?c2:c1);},
    T(x,y,ch,c){(GLYPH[ch]||[]).forEach((row,j)=>{for(let i=0;i<row.length;i++)if(row[i]==='#')set(x+i,y+j,c);});},
    C(x,y){set(x,y,null);},
    page(x,y,w,h,e){
      A.R(x,y,w,h,'k');A.R(x+1,y+1,w-2,h-2,'w');
      const x0=x+w-e;
      for(let j=0;j<e;j++)for(let i=0;i<e;i++)set(x0+i,y+j,i>j?null:i===j?'k':'w');
      for(let j=0;j<e;j++)set(x0,y+j,'k');
      for(let i=0;i<e;i++)set(x0+i,y+e-1,'k');
    }
  };
  draw(A);
  let out='';
  const colors=[...new Set(G.filter(Boolean))];
  for(const c of colors){
    let d='';
    for(let y=0;y<n;y++){

function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v);}
  for(const k of kids){if(k==null)continue;e.appendChild(typeof k==='string'?document.createTextNode(k):k);}
  return e;
}
function escH(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- Ouvrir une application ---------- */
function zoomFrom(src,done){
  if(!src||reduced()){done();return;}
  const a=src.getBoundingClientRect(),z=$('#desk').getBoundingClientRect();
  const steps=8;let i=0;
  const boxes=[];
  const step=()=>{
    if(i>=steps){boxes.forEach(b=>b.remove());done();return;}
    const t=(i+1)/steps;
    const L=a.left+(z.left-a.left)*t,T=a.top+(z.top-a.top)*t,W=a.width+(z.width-a.width)*t,H=a.height+(z.height-a.height)*t;
    const b=el('div',{class:'zoom'});b.style.left=L+'px';b.style.top=T+'px';b.style.width=W+'px';b.style.height=H+'px';
    document.body.appendChild(b);boxes.push(b);
    if(boxes.length>3)boxes.shift().remove();
    i++;setTimeout(step,28);
  };
  step();
}
function launch(a,src){
  if(!a)return;
  if(!a.ready){
    alertDlg(a.name+' n’est pas encore prête.','Elle rejoindra bientôt la suite. En attendant, vous pouvez suivre son avancement sur GitHub.',a.icon,[{label:'Voir sur GitHub',value:'code',left:true},{label:'OK',value:null,default:true,cancel:true}]).then(v=>{if(v==='code')go(a.code);});
    return;
  }
  zoomFrom(src&&src.querySelector('svg'),()=>go(a.url));
}
function go(url){
  const l=el('a',{href:url,target:'_blank',rel:'noopener'});
  document.body.appendChild(l);l.click();l.remove();
}
async function copyLink(a){
  if(!a)return;
  let ok=false;
  const full=LOCAL?a.url:PAGES+a.file;
  try{await navigator.clipboard.writeText(full);ok=true;}catch(e){}
  if(!ok){try{const t=el('textarea',{style:'position:fixed;opacity:0'});t.value=full;document.body.appendChild(t);t.select();ok=document.execCommand('copy');t.remove();}catch(e){}}
  alertDlg(ok?'Lien copié.':'Le lien n’a pas pu être copié.',ok?full:'Le voici, à copier à la main : '+full,a.icon);
}

    b.appendChild(el('p',{style:'font-size:12px;color:var(--mute)',text:'Un seul fichier HTML, hors ligne, pour Firefox et Chrome. Rien n’est envoyé ailleurs.'}));
  },buttons:[{label:'Code source',value:'code',left:true},{label:'Fermer',value:null,cancel:!a.ready?false:true},a.ready?{label:'Ouvrir',value:'open',default:true}:{label:'OK',value:null,default:true,cancel:true}]}).then(v=>{
    if(v==='open')launch(a,$('.app[data-id="'+a.id+'"]',appsBox));
    else if(v==='code')go(a.code);
  });
}

/* =========================================================
   Bureau : icônes et fenêtres
   ========================================================= */
$$('[data-icon]').forEach(s=>{s.innerHTML=ICONS[s.dataset.icon];});
function deselectDesk(){S.dsel=null;$$('.dicon').forEach(b=>b.setAttribute('aria-selected','false'));}
$$('.dicon').forEach(b=>{
  b.addEventListener('click',()=>{
    S.dsel=b.id;S.focus='desk';
    $$('.dicon').forEach(x=>x.setAttribute('aria-selected',String(x===b)));
    buildMenubar();
  });
  const act=()=>{if(b.dataset.act==='download')download();else openWin(b.dataset.open,b);};
  b.addEventListener('dblclick',act);
  b.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();b.click();act();}});
});
$('#desk').addEventListener('pointerdown',e=>{if(e.target.id==='desk'||e.target.classList.contains('dicons')){deselectDesk();buildMenubar();}});

const WINS=['w-apps','w-docs','w-read'];
const WIN_NAME={'w-apps':'Applications','w-docs':'Document','w-read':'Lisez-moi'};
let zTop=10;
function placed(w){return w.dataset.placed==='1';}
function place(w){
  const D=$('#desk'),W=D.clientWidth,H=D.clientHeight,side=134;
  const wide=Math.max(260,W-side-32);
  if(w.id==='w-apps'){
    const ww=Math.min(600,wide);
    w.style.width=ww+'px';
    w.style.left=Math.max(16,Math.round((W-side-ww)/2))+'px';
    w.style.top=Math.max(14,Math.round(H*.07))+'px';
  }else{
    // Document et Lisez-moi : un peu décalés, comme dans le Finder
    const ww=Math.min(w.id==='w-docs'?600:470,wide);
    w.style.width=ww+'px';
    const s=$('#w-apps'),dk=w.id==='w-read'?$('#w-docs'):null;
    const ref=dk&&placed(dk)&&!dk.hidden?dk:(placed(s)&&!s.hidden?s:null);
    const l=ref?parseInt(ref.style.left)+(w.id==='w-docs'?36:70):Math.round((W-side-ww)/2)+(w.id==='w-docs'?0:40);
    w.style.left=Math.max(16,Math.min(l,W-side-ww-8))+'px';
    w.style.top=(ref?parseInt(ref.style.top)+(w.id==='w-docs'?32:44):Math.max(14,Math.round(H*(w.id==='w-docs'?.07:.1))))+'px';
  }
  w.dataset.placed='1';
  fit(w);
}
// garde au moins la barre de titre à portée de souris
function fit(w){
  if(narrow()||w.hidden)return;
  const D=$('#desk'),W=D.clientWidth,H=D.clientHeight;
  let l=parseInt(w.style.left)||0,t=parseInt(w.style.top)||0;
  l=Math.min(Math.max(l,-(w.offsetWidth-80)),W-80);
  t=Math.min(Math.max(t,0),H-24);
  w.style.left=l+'px';w.style.top=t+'px';
  const doc=w.querySelector('.doc');
  if(doc)doc.style.maxHeight=Math.max(160,H-t-40)+'px';
}
function focusWin(w){
  if(!w)return;
  w.style.zIndex=++zTop;
  WINS.forEach(id=>$('#'+id).classList.toggle('active',$('#'+id)===w));
  buildMenubar();
}
function topWin(){
  let best=null,z=-1;
  WINS.forEach(id=>{const w=$('#'+id);if(!w.hidden&&(+w.style.zIndex||0)>z){z=+w.style.zIndex||0;best=w;}});
  return best;
}
function openWin(id,src){
  const w=$('#'+id);if(!w)return;
  const show=()=>{
    const was=w.hidden;
    w.hidden=false;
    if(!placed(w))place(w);else fit(w);
    focusWin(w);
    if(narrow())w.scrollIntoView({behavior:reduced()?'auto':'smooth',block:'start'});
    if(was&&id==='w-read'){const f=w.querySelector('.doc')||w.querySelector('.wbox');f&&f.focus({preventScroll:true});}
  };
  if(w.hidden&&src&&!narrow())zoomFrom(src.querySelector('svg'),show);else show();
}
function closeWin(w){
  if(!w||w.hidden)return;
  w.hidden=true;w.classList.remove('active');
  const t=topWin();
  if(t)focusWin(t);else buildMenubar();
}
WINS.forEach(id=>{
  const w=$('#'+id);
  w.addEventListener('pointerdown',()=>{if(!w.classList.contains('active'))focusWin(w);},true);
  w.addEventListener('focusin',()=>{if(!w.classList.contains('active'))focusWin(w);});
  $('[data-close]',w).addEventListener('click',e=>{e.stopPropagation();closeWin(w);});
  $('[data-close]',w).addEventListener('pointerdown',e=>e.stopPropagation());
  // déplacer : un contour pointillé suit la souris, la fenêtre saute au lâcher
  const tb=$('.tb',w);
  let drag=null;
  tb.addEventListener('pointerdown',e=>{
    if(narrow()||e.button>0)return;
    e.preventDefault();
    try{tb.setPointerCapture(e.pointerId);}catch(err){}
    drag={x:e.clientX,y:e.clientY,l:parseInt(w.style.left)||0,t:parseInt(w.style.top)||0,g:null};
  });
  tb.addEventListener('pointermove',e=>{
    if(!drag)return;
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!drag.g){
      if(Math.hypot(dx,dy)<3)return;
      drag.g=el('div',{class:'ghost'});
      drag.g.style.width=w.offsetWidth+'px';drag.g.style.height=w.offsetHeight+'px';
      $('#desk').appendChild(drag.g);
    }
    drag.g.style.left=(drag.l+dx)+'px';drag.g.style.top=(drag.t+dy)+'px';
    drag.dx=dx;drag.dy=dy;
  });
  const end=()=>{
    if(!drag)return;
    if(drag.g){drag.g.remove();w.style.left=(drag.l+drag.dx)+'px';w.style.top=(drag.t+drag.dy)+'px';fit(w);}
    drag=null;
  };
  tb.addEventListener('pointerup',end);
  tb.addEventListener('pointercancel',()=>{if(drag&&drag.g)drag.g.remove();drag=null;});
});
window.addEventListener('resize',()=>WINS.forEach(id=>fit($('#'+id))));
function tidy(){
  WINS.forEach(id=>{$('#'+id).dataset.placed='';});
  WINS.forEach(id=>{const w=$('#'+id);if(!w.hidden)place(w);});
  const t=topWin();if(t)focusWin(t);
}

/* =========================================================
   Dialogues
   ========================================================= */
function openDialog(opt){
  return new Promise(res=>{
    closeMenus();
    const prev=document.activeElement;
    const ov=el('div',{class:'ov'});
    const d=el('div',{class:'dlg',role:'dialog','aria-modal':'true','aria-label':opt.title});
    d.style.width=(opt.width||420)+'px';
    if(opt.heading!==false)d.appendChild(el('h2',{text:opt.title}));
    const body=el('div',{style:'display:flex;flex-direction:column;gap:10px;min-height:0'});d.appendChild(body);
    let done=false;
    const close=val=>{if(done)return;done=true;ov.remove();document.removeEventListener('keydown',kh,true);if(prev&&prev.focus)try{prev.focus({preventScroll:true});}catch(e){}res(val);};
    if(opt.build)opt.build(body,{close,el:d});
    let defBtn=null,cancelVal=null;
    if(opt.buttons&&opt.buttons.length){
      const row=el('div',{class:'dlg-btns'});
      for(const bt of opt.buttons){
        const b=el('button',{type:'button',class:'btn'+(bt.default?' default':'')+(bt.left?' left':''),text:bt.label});
        b.addEventListener('click',()=>close(bt.value));
        if(bt.default)defBtn=b;
        if(bt.cancel)cancelVal=bt.value;
        row.appendChild(b);
      }
      d.appendChild(row);
    }
    const kh=e=>{
      if(ov.nextElementSibling&&ov.nextElementSibling.classList.contains('ov'))return;
      if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close(cancelVal);}
      else if(e.key==='Enter'&&defBtn&&!/BUTTON|SELECT|A/.test(e.target.tagName||'')){e.preventDefault();e.stopPropagation();defBtn.click();}
      else e.stopPropagation();
    };
    document.addEventListener('keydown',kh,true);
    ov.addEventListener('pointerdown',e=>{if(e.target===ov)e.preventDefault();});
    ov.appendChild(d);document.body.appendChild(ov);
    const f=defBtn||d.querySelector('button');
    if(f)setTimeout(()=>{try{f.focus();}catch(e){}},0);
  });
}
function alertDlg(title,msg,ic,buttons){
  return openDialog({title,heading:false,width:420,build:b=>{
    const row=el('div',{class:'dlg-row'});
    if(ic)row.insertAdjacentHTML('beforeend',ic);
    row.appendChild(el('div',{style:'display:flex;flex-direction:column;gap:6px;min-width:0;padding-top:6px'},el('p',{html:'<strong>'+escH(title)+'</strong>'}),msg?el('p',{style:'word-break:break-word',text:msg}):null));
    b.appendChild(row);
  },buttons:buttons||[{label:'OK',value:null,default:true,cancel:true}]});
}
function about(){
  openDialog({title:'À propos de SobreSuite',heading:false,width:380,build:b=>{
    b.appendChild(el('div',{class:'about',html:ICONS.suite+'<span class="nm">SobreSuite</span><span class="tg">Logiciels frugaux, hors ligne</span><p>Version '+VERSION+(LOCAL?' · version locale':'')+'</p><p>Une suite de logiciels frugaux, pensés pour aller à l’essentiel.</p><p style="font-size:12px;color:var(--mute)">© 2026 Auraponymous</p>'}));
  },buttons:[{label:'OK',value:true,default:true,cancel:true}]});
}
function shortcuts(){
  openDialog({title:'Raccourcis clavier',width:440,build:b=>{
    b.appendChild(el('div',{class:'keys',html:
      '<b>Double-clic</b><span>ouvrir l’application ou la fenêtre</span>'+
      '<b>Clic</b><span>sélectionner</span>'+
      '<b>Flèches</b><span>passer d’une application à l’autre</span>'+
      '<b>Entrée</b><span>ouvrir l’application sélectionnée</span>'+
      '<b>'+MOD+'O</b><span>ouvrir</span>'+
      '<b>'+MOD+'I</b><span>lire les informations</span>'+
      '<b>Échap</b><span>fermer un menu ou un dialogue</span>'}));
    b.appendChild(el('p',{style:'font-size:13px;color:var(--mute)',text:'Les fenêtres se déplacent par leur barre de titre. La case en haut à gauche les ferme ; un double-clic sur l’icône du bureau les rouvre.'}));
  },buttons:[{label:'OK',value:true,default:true,cancel:true}]});
}
function quitApp(){
  closeMenus();
  try{window.close();}catch(e){}
  setTimeout(()=>{const q=$('#quit');q.hidden=false;$('#quit button').focus();},150);
}
$('#quit button').addEventListener('click',()=>{$('#quit').hidden=true;});

/* =========================================================
   Menus
   ========================================================= */
function openSelected(){
  if(S.focus==='desk'&&S.dsel){const b=$('#'+S.dsel);if(b.dataset.act==='download')download();else openWin(b.dataset.open,b);return;}
  if(S.focus==='docs'){const m=currentManual();if(m)openManual(m,$('.app[data-id="'+m.id+'"]',docsBox));return;}
  const a=current();if(a)launch(a,$('.app[data-id="'+a.id+'"]',appsBox));
}
function setView(v){S.view=v;save();buildApps();buildDocs();if(S.sel)select(S.sel);else if(S.msel)selectManual(S.msel);buildMenubar();}
function menuDefs(){
  const a=current(),open=id=>!$('#'+id).hidden,front=topWin();
  const m=S.focus==='docs'?currentManual():null;
  const canOpen=(S.focus==='desk'&&S.dsel)||(m&&m.ready)||(S.focus!=='docs'&&a&&a.ready);
  return [
    {id:'logo',logo:true,label:'SobreSuite',items:[{l:'À propos de SobreSuite…',a:about}]},
    {id:'file',label:'Fichier',items:[
      {l:'Ouvrir',k:MOD+'O',dis:!canOpen,a:openSelected},
      {l:'Lire les informations',k:MOD+'I',dis:!a,a:()=>info(a)},
      {l:'Voir le code source',dis:!a,a:()=>go(a.code)},'-',
      {l:'Télécharger la SobreSuite…',dis:LOCAL,a:download},'-',
      {l:'Fermer la fenêtre',dis:!front,a:()=>closeWin(front)},'-',
      {l:'Quitter',a:quitApp}]},
    {id:'edit',label:'Édition',items:[
      {l:'Annuler',k:MOD+'Z',dis:true},'-',
      {l:'Couper',k:MOD+'X',dis:true},
      {l:'Copier le lien de l’application',dis:!a||!a.ready,a:()=>copyLink(a)},
      {l:'Coller',k:MOD+'V',dis:true}]},
    {id:'view',label:'Affichage',items:[
      {l:'Par icônes',chk:S.view==='icons',a:()=>setView('icons')},
      {l:'Par liste',chk:S.view==='list',a:()=>setView('list')},'-',
      {l:'Ranger les fenêtres',dis:narrow(),a:tidy},'-',
      ...SobreTheme.items()]},
    {id:'win',label:'Fenêtre',items:WINS.map(id=>({l:WIN_NAME[id],chk:open(id),a:()=>openWin(id)}))},
    {id:'help',label:'Aide',items:[
      {l:'Lisez-moi',a:()=>openWin('w-read')},
      {l:'Raccourcis clavier…',a:shortcuts},'-',
      {l:'À propos de SobreSuite…',a:about}]}
  ];
}
let openMenuId=null,menuEl=null;
function buildMenubar(){
  const mb=$('#menubar');
  const keep=openMenuId;
  mb.innerHTML='';
  for(const m of menuDefs()){
    const b=el('button',{type:'button',class:'mb-btn'+(m.logo?' mb-logo':''),'aria-haspopup':'menu','aria-expanded':String(keep===m.id),'data-menu':m.id,'aria-label':m.logo?m.label:null});
    if(m.logo)b.innerHTML=LOGO_SVG;else b.textContent=m.label;
    b.addEventListener('click',()=>{openMenuId===m.id?closeMenus():openMenu(m.id);});
    b.addEventListener('mouseenter',()=>{if(openMenuId&&openMenuId!==m.id)openMenu(m.id);});
    b.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();openMenu(m.id,true);}});
    mb.appendChild(b);
  }
  mb.appendChild(el('div',{class:'mb-spacer'}));
  mb.appendChild(el('div',{class:'mb-clock',id:'mb-clock','aria-hidden':'true'}));
  tick();
}
function tick(){const c=$('#mb-clock');if(c){const d=new Date();c.textContent=pad(d.getHours())+':'+pad(d.getMinutes());}}
setInterval(tick,15000);
function openMenu(id,focusFirst){
  closeMenus(true);
  const def=menuDefs().find(m=>m.id===id);if(!def)return;
  const btn=$('[data-menu="'+id+'"]');btn.setAttribute('aria-expanded','true');openMenuId=id;
  menuEl=el('div',{class:'menu',role:'menu','aria-label':def.label});
  for(const it of def.items){
    if(it==='-'){menuEl.appendChild(el('hr'));continue;}
    const b=el('button',{type:'button',role:it.chk!==undefined?'menuitemcheckbox':'menuitem','aria-checked':it.chk!==undefined?String(!!it.chk):null,disabled:!!it.dis});
    b.appendChild(el('span',{text:it.l}));
    if(it.k)b.appendChild(el('span',{class:'k',text:it.k}));
    b.addEventListener('click',()=>{closeMenus();if(it.a)it.a();buildMenubar();});
    menuEl.appendChild(b);
  }
  menuEl.addEventListener('keydown',e=>{
    const items=$$('button:not([disabled])',menuEl);const i=items.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){e.preventDefault();(items[i+1]||items[0]).focus();}
    else if(e.key==='ArrowUp'){e.preventDefault();(items[i-1]||items[items.length-1]).focus();}
    else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const ids=menuDefs().map(m=>m.id);const k=ids.indexOf(openMenuId);openMenu(ids[(k+(e.key==='ArrowRight'?1:-1)+ids.length)%ids.length],true);}
    else if(e.key==='Escape'){e.preventDefault();const b=$('[data-menu="'+openMenuId+'"]');closeMenus();b&&b.focus();}
  });
  document.body.appendChild(menuEl);
  const r=btn.getBoundingClientRect();
  menuEl.style.top=r.bottom+'px';
  menuEl.style.left=Math.max(8,Math.min(r.left,window.innerWidth-menuEl.offsetWidth-8))+'px';
  if(focusFirst){const f=menuEl.querySelector('button:not([disabled])');f&&f.focus();}
}
function closeMenus(keepId){
  if(menuEl){menuEl.remove();menuEl=null;}
  $$('[data-menu]').forEach(b=>b.setAttribute('aria-expanded','false'));
  if(!keepId)openMenuId=null;
}
document.addEventListener('pointerdown',e=>{if(menuEl&&!e.target.closest('.menu')&&!e.target.closest('[data-menu]'))closeMenus();});
document.addEventListener('keydown',e=>{
  if(!splashGone||document.querySelector('.ov')||!$('#quit').hidden)return;
  if(e.key==='Escape'&&menuEl){closeMenus();return;}
  if(menuEl)return;
  const mod=e.metaKey||e.ctrlKey,k=e.key.toLowerCase();
  if(mod&&!e.shiftKey&&!e.altKey){
    if(k==='o'){e.preventDefault();openSelected();}
    else if(k==='i'){const a=current();if(a){e.preventDefault();info(a);}}
  }
});

/* =========================================================
   Démarrage
   ========================================================= */
let splashGone=false;
if(LOCAL)$('#d-dl').hidden=true;
buildApps();
buildDocs();
buildDoc();
buildMenubar();
const splash=$('#splash');
$('.sp-ver',splash).textContent=VERSION;
function closeSplash(){
  if(splash.dataset.closing)return;
  splash.dataset.closing='1';
  document.removeEventListener('keydown',splashKey,true);
  splash.classList.add('out');
  setTimeout(()=>{splash.hidden=true;splashGone=true;},reduced()?0:260);
}
function splashKey(e){if(['Shift','Control','Alt','Meta'].includes(e.key))return;e.preventDefault();e.stopPropagation();closeSplash();}
splash.addEventListener('click',closeSplash);
document.addEventListener('keydown',splashKey,true);
$('.sp-fill',splash).addEventListener('animationend',closeSplash);
if(reduced())setTimeout(closeSplash,5000);
})();
