6h5v1h-5zM30 26h1v1h-1zM1 27h1v1h-1zM30 27h1v1h-1zM1 28h2v1h-2zM29 28h2v1h-2zM3 29h26v1h-26z'/><path fill='%233A3733' d='M17 4h12v1h-12zM17 5h1v1h-1zM28 5h1v1h-1zM17 6h1v1h-1zM19 6h3v1h-3zM24 6h3v1h-3zM28 6h1v1h-1zM17 7h1v1h-1zM19 7h1v1h-1zM21 7h1v1h-1zM24 7h1v1h-1zM26 7h1v1h-1zM28 7h1v1h-1zM17 8h1v1h-1zM19 8h1v1h-1zM21 8h1v1h-1zM24 8h1v1h-1zM26 8h1v1h-1zM28 8h1v1h-1zM17 9h3v1h-3zM21 9h4v1h-4zM26 9h3v1h-3zM17 10h12v1h-12z'/><path fill='%23ffffff' d='M5 6h1v1h-1zM11 6h1v1h-1zM5 7h1v1h-1zM11 7h1v1h-1zM2 13h28v1h-28zM2 14h3v1h-3zM6 14h6v1h-6zM13 14h6v1h-6zM20 14h6v1h-6zM27 14h3v1h-3zM2 15h28v1h-28zM2 16h1v1h-1zM8 16h2v1h-2zM15 16h2v1h-2zM22 16h2v1h-2zM29 16h1v1h-1zM2 17h1v1h-1zM8 17h2v1h-2zM11 17h3v1h-3zM15 17h2v1h-2zM22 17h2v1h-2zM29 17h1v1h-1zM2 18h1v1h-1zM8 18h2v1h-2zM11 18h3v1h-3zM15 18h2v1h-2zM22 18h2v1h-2zM29 18h1v1h-1zM2 19h1v1h-1zM8 19h2v1h-2zM11 19h3v1h-3zM15 19h2v1h-2zM22 19h2v1h-2zM29 19h1v1h-1zM2 20h1v1h-1zM8 20h2v1h-2zM15 20h2v1h-2zM22 20h2v1h-2zM29 20h1v1h-1zM2 21h28v1h-28zM2 22h1v1h-1zM8 22h2v1h-2zM15 22h2v1h-2zM22 22h2v1h-2zM29 22h1v1h-1zM2 23h1v1h-1zM4 23h3v1h-3zM8 23h2v1h-2zM15 23h2v1h-2zM22 23h2v1h-2zM29 23h1v1h-1zM2 24h1v1h-1zM4 24h3v1h-3zM8 24h2v1h-2zM15 24h2v1h-2zM22 24h2v1h-2zM29 24h1v1h-1zM2 25h1v1h-1zM4 25h3v1h-3zM8 25h2v1h-2zM15 25h2v1h-2zM22 25h2v1h-2zM29 25h1v1h-1zM2 26h1v1h-1zM8 26h2v1h-2zM15 26h2v1h-2zM22 26h2v1h-2zM29 26h1v1h-1zM2 27h28v1h-28zM3 28h26v1h-26z'/><path fill='%23d4d4d4' d='M3 3h26v1h-26zM2 4h15v1h-15zM29 4h1v1h-1zM2 5h2v1h-2zM7 5h3v1h-3zM13 5h2v1h-2zM16 5h1v1h-1zM29 5h1v1h-1zM2 6h1v1h-1zM8 6h1v1h-1zM14 6h3v1h-3zM29 6h1v1h-1zM2 7h1v1h-1zM8 7h1v1h-1zM14 7h3v1h-3zM29 7h1v1h-1zM2 8h1v1h-1zM8 8h1v1h-1zM14 8h3v1h-3zM29 8h1v1h-1zM2 9h2v1h-2zM7 9h3v1h-3zM13 9h4v1h-4zM29 9h1v1h-1zM2 10h15v1h-15zM29 10h1v1h-1zM2 11h28v1h-28z'/><path fill='%23FCF5E5' d='M18 5h10v1h-10zM18 6h1v1h-1zM22 6h2v1h-2zM27 6h1v1h-1zM18 7h1v1h-1zM20 7h1v1h-1zM22 7h2v1h-2zM25 7h1v1h-1zM27 7h1v1h-1zM18 8h1v1h-1zM20 8h1v1h-1zM22 8h2v1h-2zM25 8h1v1h-1zM27 8h1v1h-1zM20 9h1v1h-1zM25 9h1v1h-1z'/><path fill='%23767676' d='M4 6h1v1h-1zM6 6h1v1h-1zM10 6h1v1h-1zM12 6h1v1h-1zM4 7h1v1h-1zM6 7h1v1h-1zM10 7h1v1h-1zM12 7h1v1h-1zM4 8h3v1h-3zM10 8h3v1h-3zM5 14h1v1h-1zM19 14h1v1h-1zM26 14h1v1h-1z'/><path fill='%23D7141A' d='M15 5h1v1h-1zM12 14h1v1h-1zM4 17h3v1h-3zM4 18h3v1h-3zM4 19h3v1h-3z'/><path fill='%231F3FD1' d='M25 17h3v1h-3zM25 18h3v1h-3zM25 19h3v1h-3z'/><path fill='%23FFD600' d='M18 17h3v1h-3zM18 18h3v1h-3zM18 19h3v1h-3z'/><path fill='%23128A2E' d='M11 23h3v1h-3zM11 24h3v1h-3zM11 25h3v1h-3z'/><path fill='%23FF8200' d='M18 23h3v1h-3zM18 24h3v1h-3zM18 25h3v1h-3z'/><path fill='%237A1FB8' d='M25 23h3v1h-3zM25 24h3v1h-3zM25 25h3v1h-3z'/></svg>">
<meta name="description" content="SobreBiT, boîte à rythmes frugale : sons électro, boucles et sons importés, hors ligne.">
<style>
/* SobreBiT — bureau tramé façon Mac 1 bit, encre noire sur papier blanc. Thème unique, assumé. */
:root{
  --ink:#000000;--paper:#ffffff;--dither:#9a9a9a;--mute:#4f4f4f;--ghost:#e6e6e6;--dim:#c9c9c9;--lite:#d4d4d4;
  --sage:#CFDFCC;--logo:#3A3733;
  --red:#D7141A;--blue:#1F3FD1;--yellow:#FFD600;--green:#128A2E;--orange:#FF8200;--violet:#7A1FB8;--grey:#767676;
  --ui:'VT323','Geneva','Chicago',ui-monospace,monospace;
  --hw:188px;--side:312px;--ch:38px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:14px;overflow:hidden;
  font-variant-ligatures:none;font-feature-settings:"liga" 0,"clig" 0;-webkit-font-smoothing:auto;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit;font-variant-ligatures:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#app{height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:repeating-conic-gradient(var(--dither) 0 25%,var(--bureau) 0 50%) 0 0/2px 2px}

/* ---------- Barre de menus ---------- */
#menubar{flex:none;height:24px;background:var(--paper);border-bottom:1px solid var(--ink);display:flex;align-items:stretch;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:50;
  overflow-x:auto;scrollbar-width:none}
#menubar::-webkit-scrollbar{display:none}
.mb-btn{border:0;background:transparent;padding:0 10px;height:23px;cursor:pointer;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.mb-btn[aria-expanded="true"]{background:var(--ink);color:var(--paper)}
.mb-logo svg{width:22px;height:16px;display:block;image-rendering:pixelated}
.mb-logo[aria-expanded="true"] svg{outline:1px solid var(--paper)}
.mb-spacer{flex:1}
.menu{position:fixed;z-index:60;background:var(--paper);border:1px solid var(--ink);box-shadow:2px 2px 0 var(--ink);min-width:250px;padding:2px 0;font-size:14px}
.menu button{display:flex;width:100%;border:0;background:transparent;text-align:left;padding:3px 14px 3px 22px;gap:24px;cursor:pointer;position:relative;white-space:nowrap}
.menu button:hover:not([disabled]),.menu button:focus-visible{background:var(--ink);color:var(--paper);outline:none}
.menu button[disabled]{color:var(--inactif);cursor:default}
.menu .kb{margin-left:auto;opacity:.85}
.menu button[aria-checked="true"]::before{content:'✓';position:absolute;left:7px}
.menu hr{border:0;border-top:1px dotted var(--ink);margin:3px 0}
.menu .mh{font-size:12px;color:var(--mute);padding:3px 14px 1px 22px}
.menu .sw{display:inline-block;width:11px;height:11px;border:1px solid var(--ink);margin-right:8px;vertical-align:-1px}

/* ---------- Bureau et fenêtre ---------- */
#desk{flex:1;position:relative;min-height:0}
.win{position:absolute;background:var(--paper);border:1px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:flex;flex-direction:column;min-width:0}
#w-main{inset:14px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px))}
.tb{height:21px;flex:none;border-bottom:1px solid var(--ink);display:flex;align-items:center;justify-content:center;position:relative;padding:4px 3px;user-select:none}
.win.active .tb{background:repeating-linear-gradient(var(--ink) 0 1px,var(--paper) 1px 2px);background-clip:content-box;background-origin:content-box}
.tb-title{background:var(--paper);padding:0 10px;font-size:14px;line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%}
.win.active .tb-title{font-weight:600}
.wbox{position:absolute;top:3px;width:13px;height:13px;border:1px solid var(--ink);background:var(--paper);padding:0;box-shadow:0 0 0 2px var(--paper);cursor:pointer}
.wbox.l{left:8px}.wbox.r{right:8px}
.wbox:active{background:var(--ink)}
.sb{display:flex;align-items:center;height:21px;border-top:1px solid var(--ink);font-size:12px;flex:none;overflow:hidden;background:var(--paper)}
.sb>div,.sb>button{padding:0 10px;border:0;border-right:1px solid var(--ink);height:100%;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;background:var(--paper);font-family:var(--ui);font-size:12px}
.sb>:last-child{border-right:0}
.sb .fill{flex:1}
.sb .warn{color:var(--red);font-weight:600}
.sb>button{cursor:pointer}.sb>button:hover{background:var(--ink);color:var(--paper)}

.btn{font-family:var(--ui);font-size:13px;background:var(--paper);border:1px solid var(--ink);border-radius:4px;padding:0 10px;height:28px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;touch-action:manipulation}
.btn:hover{background:var(--survol)}
.btn:active,.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn[disabled]{color:var(--inactif);border-color:var(--inactif);cursor:default;background:var(--paper)}
.btn.default{outline:3px solid var(--ink);outline-offset:1px;border-radius:6px}
.btn.sm{height:22px;font-size:12px;padding:0 8px;border-radius:3px}
.btn.wide{width:100%}
.btn svg{display:block;fill:currentColor;shape-rendering:crispEdges}
.btn.ico{width:30px;padding:0}

/* ---------- Barre d'outils : touches en relief, afficheur, vumètre ---------- */
#tools{flex:none;display:flex;align-items:center;gap:12px;padding:8px 12px 7px;border-bottom:1px solid var(--ink);flex-wrap:wrap;row-gap:8px;user-select:none;-webkit-user-select:none}
.tgrp{display:flex;align-items:center;gap:6px}
.tsep{width:1px;align-self:stretch;background:repeating-linear-gradient(var(--ink) 0 1px,transparent 1px 3px)}
.k{width:38px;height:30px;border:2px solid var(--ink);border-radius:7px;background:var(--paper);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;
  margin:0 4px 4px 0;box-shadow:1px 1px 0 0 var(--paper),2px 2px 0 0 var(--ink),3px 3px 0 0 var(--paper),4px 4px 0 0 var(--ink);
  transition:transform .04s,box-shadow .04s;touch-action:manipulation;flex:none;font-family:var(--ui);font-size:15px;font-weight:600}
.k svg{display:block;shape-rendering:crispEdges;fill:var(--ink)}
.k.down,.k:active{transform:translate(2px,2px);box-shadow:1px 1px 0 0 var(--paper),2px 2px 0 0 var(--ink)}
.k[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.k[aria-pressed="true"] svg{fill:var(--paper)}
.k.rec svg{fill:var(--red)}
.k.rec[aria-pressed="true"] svg{fill:var(--red);animation:blink 1s steps(2,end) infinite}
.k.q{background:repeating-conic-gradient(var(--ink) 0 25%,var(--paper) 0 50%) 0 0/2px 2px;color:var(--ink);animation:blink .5s steps(2,end) infinite}
.k.txt-sm{font-size:12px;width:auto;padding:0 8px}
.k.has::after{content:'';position:absolute;width:4px;height:3px;background:currentColor;bottom:2px;left:50%;margin-left:-2px}
.k{position:relative}
@keyframes blink{50%{opacity:0}}
.k[disabled]{cursor:default;opacity:.4}

.disp{border:2px solid var(--ink);border-radius:10px;padding:3px;margin:0 4px 4px 0;flex:none;
  box-shadow:1px 1px 0 0 var(--paper),2px 2px 0 0 var(--ink),3px 3px 0 0 var(--paper),4px 4px 0 0 var(--ink)}
.disp-in{border:1px solid var(--ink);border-radius:6px;padding:3px 8px;display:flex;align-items:center;gap:12px;height:36px}
.lc{display:flex;flex-direction:column;align-items:center;gap:1px}
.lc small{font-size:9px;line-height:9px;letter-spacing:.08em;color:var(--mute)}
.lc svg{display:block}
#lc-t{cursor:ns-resize;touch-action:none}
.seg-on{fill:var(--ink)}.seg-off{fill:none}
.d-right{display:flex;flex-direction:column;justify-content:center;min-width:76px;gap:2px}
.d-state{font-size:12px;line-height:13px;font-weight:600;letter-spacing:.06em}
.d-state.rec{color:var(--red)}
.d-sub{font-size:11px;line-height:12px;color:var(--mute);white-space:nowrap}
.vu{border:1px solid var(--ink);padding:3px;line-height:0;background:var(--paper);flex:none;cursor:pointer}
.vu canvas{display:block;image-rendering:pixelated}

/* ---------- Boutons rotatifs ---------- */
.kn{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;cursor:ns-resize;touch-action:none;user-select:none;-webkit-user-select:none;outline:none;padding:2px 0}
.kn svg{display:block;overflow:visible}
.kn:focus-visible svg .kn-c{stroke:var(--blue);stroke-width:2.5}
.kn-l{font-size:12px;line-height:14px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.kn-v{font-size:11px;line-height:12px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.kn.mini{flex-direction:row;gap:6px;cursor:ns-resize}
.kn.mini .kn-txt{display:flex;flex-direction:column;align-items:flex-start}
.kn[aria-disabled="true"]{opacity:.4;cursor:default}
.knobs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 4px}

/* ---------- Corps ---------- */
#body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--side);gap:1px;background:var(--ink)}
#body.noside{grid-template-columns:minmax(0,1fr)}
#side{display:flex;flex-direction:column;gap:1px;background:var(--ink);min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--ink) var(--paper)}
.pane{background:var(--paper);display:flex;flex-direction:column;min-width:0;min-height:0}
#p-fx{flex:1}
.ph{min-height:30px;flex:none;display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;border-bottom:1px solid var(--ink);min-width:0;flex-wrap:wrap}
.ph-n{flex:none;width:17px;height:17px;background:var(--ink);color:var(--paper);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;line-height:1}
.ph-t{font-weight:600;font-size:14px;white-space:nowrap}
.ph-s{flex:1;min-width:0;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px}

/* interrupteur à plusieurs positions (comme « Creuser | Drapeau » de SobreJoK) */
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:5px;overflow:hidden;flex:none;background:var(--paper)}
.seg button{border:0;border-right:1px solid var(--ink);background:var(--paper);height:24px;padding:0 9px;font-size:12px;cursor:pointer;white-space:nowrap;touch-action:manipulation}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
.seg.sm button{height:20px;padding:0 6px;font-size:11px}

/* ---------- Séquenceur ---------- */
#seq{flex:1;min-height:0;overflow:auto;padding:8px 12px 14px;scrollbar-width:thin;scrollbar-color:var(--ink) var(--paper);outline:none}
.row{display:flex;align-items:stretch;gap:8px;margin-bottom:6px}
.row.ledrow{margin-bottom:4px;align-items:flex-end}
.pad{width:var(--hw);flex:none;display:flex;align-items:center;gap:7px;height:var(--ch);border:1px solid var(--ink);border-radius:4px;background:var(--paper);padding:0 6px 0 7px;cursor:pointer;text-align:left;min-width:0;touch-action:manipulation;position:relative}
.pad:active{background:var(--ink);color:var(--paper)}
.pad.hit,.row.sel .pad.hit{background:var(--tc);color:#fff}
.row.lt .pad.hit{color:#000}
.row.sel .pad{background:var(--ink);color:var(--paper);box-shadow:2px 2px 0 var(--grey)}
.pad-sw{flex:none;width:14px;height:14px;border:1px solid var(--ink);box-shadow:0 0 0 1px var(--paper);background:var(--tc)}
.pad-n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:600}
.pad-k{flex:none;font-size:11px;color:var(--mute);border:1px solid currentColor;border-radius:2px;padding:0 3px;line-height:13px}
.row.sel .pad-k{color:var(--dim)}
.ms{display:flex;flex-direction:column;justify-content:center;gap:2px;flex:none}
.tg{width:24px;height:17px;border:1px solid var(--ink);border-radius:3px;background:var(--paper);font-family:var(--ui);font-size:11px;font-weight:600;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;touch-action:manipulation}
.tg[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tg.solo[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}
.cells{flex:1;display:flex;gap:8px;min-width:0}
.grp{flex:1;display:flex;gap:3px;min-width:0}
.c{flex:1;min-width:0;position:relative;height:var(--ch);border:1px solid var(--ink);border-radius:3px;background:var(--paper);padding:0;cursor:pointer;touch-action:none}
.c.first{background:var(--ghost)}
.c.now{outline:2px solid var(--ink);outline-offset:1px}
.c .f{position:absolute;left:2px;right:2px;bottom:2px;display:flex;gap:2px;pointer-events:none}
.c .f b{flex:1;border:1px solid var(--ink);background:var(--tc)}
.c .f.ch b{background:repeating-conic-gradient(var(--tc) 0 25%,var(--paper) 0 50%) 0 0/4px 4px}
.c .f.v1{height:38%}.c .f.v2{height:66%}.c .f.v3{top:2px}
.c em{position:absolute;top:1px;right:2px;font-style:normal;font-size:10px;line-height:11px;pointer-events:none;background:var(--paper);padding:0 1px;font-weight:600}
.c.muted .f b{background:repeating-conic-gradient(var(--grey) 0 25%,var(--paper) 0 50%) 0 0/2px 2px}
.c.flash{background:var(--ink)}
.ledrow .pad-sp{width:var(--hw);flex:none;font-size:11px;color:var(--mute);display:flex;align-items:flex-end;padding-left:2px}
.ledrow .ms-sp{width:24px;flex:none}
.led{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;line-height:10px;color:var(--mute)}
.led i{display:block;width:10px;height:6px;border:1px solid var(--ink);background:var(--lite)}
.led.on i{background:var(--red)}
.led.b1{color:var(--ink);font-weight:600}
body.dragging #seq{outline:3px dashed var(--ink);outline-offset:-3px}
.row.drop .pad{outline:3px dashed var(--ink);outline-offset:2px}
.p2 .grp:nth-child(-n+2),.p1 .grp:nth-child(n+3){display:none}

#pages{display:none}
body.narrow #pages{display:inline-flex}

/* trame selon la famille : points pour Space age, rayures pour Électro (la couleur, elle, dit le rôle) */
.row[data-fam="space"] .c .f b,.row[data-fam="space"] .pad-sw,.swb[data-fam="space"]{background:radial-gradient(circle at 2px 2px,var(--paper) 0 1px,transparent 1.4px) 0 0/4px 4px,var(--tc)}
.row[data-fam="electro"] .c .f b,.row[data-fam="electro"] .pad-sw,.swb[data-fam="electro"]{background:repeating-linear-gradient(135deg,var(--paper) 0 1px,transparent 1px 4px),var(--tc)}
.row[data-fam] .c .f.ch b{background:repeating-conic-gradient(var(--tc) 0 25%,var(--paper) 0 50%) 0 0/4px 4px}
.row[data-fam] .c.muted .f b{background:repeating-conic-gradient(var(--grey) 0 25%,var(--paper) 0 50%) 0 0/2px 2px}
.plist .ps{padding:8px 8px 4px;border-bottom:1px solid var(--ink);background:var(--ghost);display:flex;flex-direction:column;gap:2px}
.plist .ps b{font-size:14px}
.plist .ps small{font-size:12px;color:var(--mute);line-height:1.35}
.plist .ps.on b::after{content:' · ouvert';font-weight:400;color:var(--mute);font-size:12px}
.dlg.wide .plist{max-height:min(52vh,460px)}

/* ---------- Palette Son ---------- */
.snd-top{display:flex;gap:6px;align-items:center}
.snd-top select{flex:1;min-width:0}
.swb{flex:none;width:24px;height:24px;border:1px solid var(--ink);box-shadow:0 0 0 1px var(--paper),1px 1px 0 1px var(--ink);padding:0;cursor:pointer;background:var(--tc);position:relative}
.swb.man::after{content:'';position:absolute;right:-5px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink)}
.smp{font-size:12px;line-height:1.4;border:1px dotted var(--ink);padding:6px 8px;display:flex;flex-direction:column;gap:6px}
.smp b{font-weight:600}
.smp .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ck{display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-size:12px;line-height:16px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.lbl{font-size:11px;letter-spacing:.06em;color:var(--mute);text-transform:uppercase;border-bottom:1px dotted var(--ink);padding-bottom:2px}
.lbls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 4px;margin-bottom:-4px}
.lbls>span{font-size:11px;letter-spacing:.06em;color:var(--mute);text-transform:uppercase;border-bottom:1px dotted var(--ink);padding-bottom:2px;text-align:center}
.lbls>.s2{grid-column:span 2}
.echo-div{display:flex;align-items:center;gap:8px;font-size:12px;flex-wrap:wrap}

input[type=checkbox]{-webkit-appearance:none;appearance:none;width:14px;height:14px;border:1px solid var(--ink);background:var(--paper);margin:0;cursor:pointer;display:grid;place-content:center;flex:none}
input[type=checkbox]:checked::after{content:'';width:8px;height:8px;background:var(--ink)}
input[type=radio]{-webkit-appearance:none;appearance:none;width:14px;height:14px;border:1px solid var(--ink);border-radius:50%;background:var(--paper);margin:0;cursor:pointer;display:inline-grid;place-content:center;vertical-align:-2px;flex:none}
input[type=radio]:checked::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--ink)}
select,input[type=number],input[type=text]{font-family:var(--ui);font-size:13px;border:1px solid var(--ink);background:var(--paper);border-radius:0;height:24px;padding:0 4px}
select{padding:0 2px;cursor:pointer}

/* ---------- Dialogues ---------- */
.ov{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;background:color-mix(in srgb,var(--paper) 35%,transparent)}
.dlg{background:var(--paper);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);outline:1px solid var(--ink);outline-offset:-6px;padding:16px 18px;max-width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;width:440px}
.dlg.wide{width:640px}
.dlg h2{margin:0;font-size:16px;font-weight:600}
.dlg h3{margin:6px 0 0;font-size:14px;font-weight:600}
.dlg p,.dlg li{margin:0;line-height:1.45;font-size:14px}
.dlg ul{margin:0;padding-left:18px}
.dlg kbd{font-family:var(--ui);font-size:12px;border:1px solid var(--ink);border-radius:3px;padding:0 4px;box-shadow:1px 1px 0 var(--ink);white-space:nowrap}
.dlg .btns{display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--ink);padding-top:12px;flex-wrap:wrap}
.dlg .btns .left{margin-right:auto}
.dlg table.keys{border-collapse:collapse;font-size:13px}
.dlg table.keys td{padding:3px 10px 3px 0;vertical-align:top}
.dlg .note{font-size:12px;color:var(--mute)}
.fset{display:flex;flex-direction:column;gap:6px;font-size:13px}
.fset .opts{display:flex;gap:14px;flex-wrap:wrap}
.fset label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.fgrid{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;align-items:center;font-size:13px}
.plist{display:flex;flex-direction:column;border:1px solid var(--ink);max-height:300px;overflow:auto}
.plist label{display:grid;grid-template-columns:18px 1fr auto;gap:2px 8px;padding:6px 8px;border-bottom:1px dotted var(--ink);cursor:pointer;align-items:center}
.plist label:last-child{border-bottom:0}
.plist label:has(input:checked){background:var(--ghost)}
.plist b{font-weight:600}
.plist small{grid-column:2/4;font-size:12px;color:var(--mute);line-height:1.35}
.plist .bpm{font-size:12px;color:var(--mute)}
.chain{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.chain select{width:100%}
.busy{width:300px;align-items:center;text-align:center}
.bar{width:100%;height:14px;border:1px solid var(--ink);padding:2px}
.bar i{display:block;height:100%;width:0;background:var(--ink)}
.bar.ind i{width:30%;animation:ind 1.2s steps(12,end) infinite}
@keyframes ind{0%{margin-left:0}100%{margin-left:70%}}
.about{align-items:center;text-align:center;width:360px}
.about svg.lg{width:260px;height:auto}
.about .v{font-size:13px;color:var(--mute)}
.about .btns{align-self:stretch;justify-content:center}

/* ---------- Accueil et fermeture ---------- */
#splash,.quit{position:fixed;inset:0;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
#splash{z-index:200;gap:28px;cursor:pointer;transition:opacity .25s ease}
#splash.out{opacity:0}
.quit{z-index:210;gap:22px}
.sp-logo{width:min(480px,78vw);height:auto;display:block}
.sp-bar{width:min(340px,70vw);height:14px;border:1px solid var(--logo);padding:2px;background:var(--paper)}
.sp-fill{height:100%;width:0;background:var(--logo);animation:spfill 3s steps(24,end) forwards}
@keyframes spfill{to{width:100%}}
.sp-go{border:0;background:transparent;font-family:var(--ui);font-size:13px;color:var(--mute);cursor:pointer;padding:4px 8px}
.sp-go:hover,.sp-go:focus-visible{color:var(--ink);text-decoration:underline}
.sp-copy{margin:0;font-family:var(--ui);font-size:12px;color:var(--mute);letter-spacing:.04em}
.q-msg{margin:0;font-size:15px;text-align:center}

/* ---------- Écran moyen : la palette passe sous la grille ---------- */
body.mid #body{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;display:block;overflow:auto;background:var(--paper)}
body.mid #p-seq{border-bottom:1px solid var(--ink)}
body.mid #seq{overflow:visible}
body.mid #side{overflow:visible;display:grid;grid-template-columns:1fr 1fr;gap:1px}

/* ---------- Écran étroit (téléphone) ---------- */

body.narrow .cells{gap:6px}
body.narrow .tb-title{max-width:60%}
body.narrow .sb #sb-info{display:none}

<script id="sobre-theme-js">
/* Apparence (Clair, Sombre, Automatique), commune à toute la gamme : le choix est gardé dans le navigateur
   et vaut pour toutes les apps ouvertes depuis le même endroit. Événement « sobre-theme » à chaque changement. */
(function(){
  var K='sobre.apparence',d=document.documentElement,mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
  function get(){var m='light';try{m=localStorage.getItem(K)||'light'}catch(e){}return m==='dark'||m==='auto'?m:'light'}
  function eff(m){return m==='auto'?(mq&&mq.matches?'dark':'light'):m}
  /* images à deux versions (logos d'accueil) : data-clair / data-sombre */
  function imgs(t){var L=document.querySelectorAll('img[data-sombre]');for(var k=0;k<L.length;k++){var i=L[k],u=t==='dark'?i.getAttribute('data-sombre'):i.getAttribute('data-clair');if(u&&i.getAttribute('src')!==u)i.setAttribute('src',u)}}
  function apply(){var m=get(),t=eff(m);d.setAttribute('data-apparence',m);d.setAttribute('data-theme',t);imgs(t);
    try{window.dispatchEvent(new CustomEvent('sobre-theme',{detail:{mode:m,theme:t}}))}catch(e){}}
  var T=window.SobreTheme={
    get:get,
    theme:function(){return eff(get())},
    dark:function(){return eff(get())==='dark'},
    set:function(m){try{localStorage.setItem(K,m)}catch(e){}apply()},
    color:function(n){return getComputedStyle(d).getPropertyValue('--'+n).trim()},
    labels:[['light','Apparence claire'],['dark','Apparence sombre'],['auto','Apparence automatique']],
    /* éléments de menu prêts à l'emploi : court=true donne « Claire / Sombre / Automatique » (sous un intitulé « Apparence ») */
    items:function(court){var m=get();return [['light','Claire'],['dark','Sombre'],['auto','Automatique']].map(function(x){
      return {l:court?x[1]:'Apparence '+x[1].toLowerCase(),chk:m===x[0],a:function(){T.set(x[0])}}})}
  };
  if(mq){var f=function(){if(get()==='auto')apply()};if(mq.addEventListener)mq.addEventListener('change',f);else if(mq.addListener)mq.addListener(f)}
  window.addEventListener('storage',function(e){if(e.key===K)apply()});
  document.addEventListener('DOMContentLoaded',function(){imgs(eff(get()))});
  apply();
})();
</script>

  stab:'pad',hoover:'pad',vowel:'pad',theremin:'pad',ufo:'pad',noise:'fx',zap:'fx',glitch:'fx',computer:'fx',laser:'fx',launch:'fx',smp:'file'};
const ROLES=[['low','#D7141A','frappes graves'],['bass','#FF8200','basses'],['back','#1F3FD1','frappes du contretemps'],['metal','#FFD600','métaux aigus'],
  ['tone','#128A2E','sons accordés'],['pad','#7A1FB8','nappes et voix'],['fx','#767676','textures et effets'],['file','#000000','sons importés']];
const ROLE_COLOR=Object.fromEntries(ROLES.map(r=>[r[0],r[1]]));
const KIT=['kick','snare','clap','hat','ohat','tom','bass','zap'];
const COLORS=['#D7141A','#1F3FD1','#FFD600','#128A2E','#FF8200','#7A1FB8','#767676','#000000'];
const COLOR_NAMES=['Rouge','Bleu','Jaune','Vert','Orange','Violet','Gris','Noir'];
/* couleur automatique : selon le rôle du son (mode « role ») ou le numéro de la piste (mode « track ») */
const autoColor=(type,i,mode)=>mode==='track'?COLORS[i%8]:ROLE_COLOR[ROLE[type]]||COLORS[i%8];
function recolor(proj,mode){proj.tracks.forEach((t,i)=>{if(!t.colorManual)t.color=autoColor(t.type,i,mode);});}
const mapP=(type,p)=>TYPES[type].p.map((d,i)=>d.m(p[i]));
const defP=type=>TYPES[type].p.map(d=>d.d);

/* ---------------- Projet ---------------- */
const emptyPat=()=>Array.from({length:TRACKS},()=>new Array(STEPS).fill(0));
function newTrack(type,i){return {type,name:TYPES[type].name,p:defP(type),vol:.857,pan:.5,fx:true,mute:false,solo:false,sample:null,rev:false,color:autoColor(type,i),colorManual:false};}
const FX0={filt:.5,res:.25,bits:0,rate:0,drive:0,echo:0,fb:.4,div:2,vol:.857};
function newProject(){
  return {v:1,name:'Sans titre',style:'drums',tempo:120,swing:.5,pat:0,chain:[0,0,0,1],chainOn:false,
    tracks:KIT.map((t,i)=>newTrack(t,i)),pats:Array.from({length:PATS},emptyPat),fx:{...FX0}};
}
/* Remet un projet lu (fichier, séance) dans une forme sûre. */
function sanitize(p){
  const d=newProject(),o={...d,...(p||{})};
  o.tempo=Math.max(40,Math.min(250,+o.tempo||120));o.swing=Math.max(.5,Math.min(.75,+o.swing||.5));
  o.pat=Math.max(0,Math.min(PATS-1,o.pat|0));
  o.chain=Array.isArray(o.chain)?o.chain.slice(0,16).map(x=>Math.max(0,Math.min(PATS-1,x|0))):d.chain;if(!o.chain.length)o.chain=[0];
  o.tracks=Array.from({length:TRACKS},(_,i)=>{const t={...newTrack(KIT[i],i),...((p&&p.tracks&&p.tracks[i])||{})};if(!TYPES[t.type])t.type=KIT[i];
    t.p=Array.from({length:4},(_,k)=>{const v=+(t.p&&t.p[k]);return isFinite(v)?Math.max(0,Math.min(1,v)):defP(t.type)[k];});
    ['vol','pan'].forEach(k=>{t[k]=isFinite(+t[k])?Math.max(0,Math.min(1,+t[k])):.5;});
    t.colorManual=!!t.colorManual;if(!COLORS.includes(t.color))t.color=autoColor(t.type,i);return t;});
  if(!STYLES.some(s=>s.id===o.style))o.style='drums';
  o.pats=Array.from({length:PATS},(_,a)=>Array.from({length:TRACKS},(_,i)=>Array.from({length:STEPS},(_,s)=>{const v=p&&p.pats&&p.pats[a]&&p.pats[a][i]&&p.pats[a][i][s];return (v|0)&63;})));
  o.fx={...FX0,...(o.fx||{})};for(const k in FX0)if(!isFinite(+o.fx[k]))o.fx[k]=FX0[k];
  o.fx.div=Math.max(0,Math.min(3,o.fx.div|0));
  return o;
}

/* ---------------- Sons importés (partagés entre l'écoute et l'export) ---------------- */
const SMP=new Map();     // id → {id,name,rate,ch:[Float32Array]}
const SBUF=new Map();    // 'id|0' ou 'id|1' (à l'envers) → AudioBuffer
function addSample(s){SMP.set(s.id,s);SBUF.delete(s.id+'|0');SBUF.delete(s.id+'|1');return s;}
function sampleBuffer(id,rev){
  const k=id+'|'+(rev?1:0);if(SBUF.has(k))return SBUF.get(k);
  const s=SMP.get(id);if(!s)return null;
  const b=new AudioBuffer({numberOfChannels:s.ch.length,length:s.ch[0].length,sampleRate:s.rate});
  s.ch.forEach((d,c)=>{if(rev){const r=new Float32Array(d.length);for(let i=0,n=d.length;i<n;i++)r[i]=d[n-1-i];b.copyToChannel(r,c);}else b.copyToChannel(d,c);});
  SBUF.set(k,b);return b;
}
const sampleSec=id=>{const s=SMP.get(id);return s?s.ch[0].length/s.rate:0;};

/* ---------------- Bruits : un tampon d'une seconde, et ses versions « grain » (échantillon bloqué) ---------------- */
const NOISE=new WeakMap();
function noiseBuf(c,grain){
  let m=NOISE.get(c);if(!m){m=new Map();NOISE.set(c,m);}
  const k=grain>0.02?Math.max(2,Math.round(2+30*grain*grain)):1;
  if(m.has(k))return m.get(k);
  const n=c.sampleRate,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);let s=22222,h=0;
  for(let i=0;i<n;i++){if(i%k===0){s=(s*1664525+1013904223)>>>0;h=s/2147483648-1;}d[i]=h;}
  m.set(k,b);return b;
}
function noise(c,t,dur,grain,rng){
  const n=c.createBufferSource();n.buffer=noiseBuf(c,grain||0);n.loop=true;
  n.start(t,rng()*0.9);n.stop(t+dur+0.05);return n;
}

/* ---------------- Saturation : courbes tanh, volume compensé ---------------- */
const CURVES=new Map();
function driveCurve(a){
  const k=Math.round(a*50)/50;if(CURVES.has(k))return CURVES.get(k);
  const g=1+k*k*30,n=2048,c=new Float32Array(n),th=Math.tanh(g);
  for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=Math.tanh(g*x)/th;}
  CURVES.set(k,c);return c;
}
/* compensation : une sinusoïde à −10 dB garde à peu près son niveau efficace */
function driveComp(a){
  const c=driveCurve(a),n=c.length;let s0=0,s1=0;
  for(let i=0;i<256;i++){const x=0.32*Math.sin(i/256*2*Math.PI);const j=Math.round((x+1)/2*(n-1));s0+=x*x;s1+=c[j]*c[j];}
  return Math.pow(Math.sqrt(s0/s1),0.85);
}
function crushCurve(bits){
  const n=4096,c=new Float32Array(n),st=Math.pow(2,1-bits);
  for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=Math.round(x/st)*st;}
  return c;
}

/* ---------------- Enveloppes ---------------- */
function env(g,t,v,att,dec){
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+att);
  g.gain.exponentialRampToValueAtTime(Math.max(1e-4,v*1e-3),t+att+dec);
  return t+att+dec;
}
const osc=(c,type,f,t,end)=>{const o=c.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.start(t);o.stop(end+0.02);return o;};
const filter=(c,type,f,Q)=>{const b=c.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=Q;return b;};
const gain=(c,v)=>{const g=c.createGain();g.gain.value=v;return g;};
const chain=(...n)=>{for(let i=0;i<n.length-1;i++)n[i].connect(n[i+1]);return n[n.length-1];};
const lfo=(c,type,rate,depth,t,end,target)=>{const o=osc(c,type,rate,t,end),g=gain(c,depth);o.connect(g).connect(target);return o;};

/* ---------------- Les voix ----------------
   v(c, sortie, réglages physiques, instant, force, piste, hasard) → instant de fin */
const VOICES={
  kick(c,out,[f1,dec,atk,drv],t,v,tr,rng){
    const end=t+0.014+dec,o=osc(c,'sine',f1*(1.8+6*atk),t,end);
    o.frequency.exponentialRampToValueAtTime(f1*1.04,t+0.035+0.02*(1-atk));o.frequency.exponentialRampToValueAtTime(f1,t+0.014+dec*0.7);
    const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+0.002);g.gain.setValueAtTime(v,t+0.014);
    g.gain.exponentialRampToValueAtTime(v*1e-3,end);
    o.connect(g);
    let dst=out;
    if(drv>0.01){const sh=c.createWaveShaper();sh.curve=driveCurve(drv*0.8);sh.oversample='2x';dst=gain(c,driveComp(drv*0.8));sh.connect(dst);dst.connect(out);g.connect(sh);}else g.connect(out);
    if(atk>0.02){const n=noise(c,t,0.02,0,rng),h=filter(c,'highpass',1800,0.7),ng=c.createGain();env(ng,t,v*0.5*atk,0.0005,0.012);chain(n,h,ng,out);}
    return end;
  },
  snare(c,out,[f,dec,hpf,body],t,v,tr,rng){
    const o=osc(c,'triangle',f*1.5,t,t+dec);o.frequency.exponentialRampToValueAtTime(f,t+0.03);
    const g1=c.createGain();env(g1,t,v*(0.18+0.75*body),0.001,dec*0.55);o.connect(g1).connect(out);
    const n=noise(c,t,dec,0,rng),h=filter(c,'highpass',hpf,0.7),l=filter(c,'lowpass',12000,0.5),g2=c.createGain();
    env(g2,t,v*(0.95-0.5*body),0.001,dec);chain(n,h,l,g2,out);
    return t+dec+0.002;
  },
  clap(c,out,[f,dec,gap,grain],t,v,tr,rng){
    const end=t+3*gap+dec,n=noise(c,t,end-t,grain,rng),b=filter(c,'bandpass',f,1.4),h=filter(c,'highpass',300,0.7),g=c.createGain();
    g.gain.setValueAtTime(0,t);
    for(let k=0;k<3;k++){const tk=t+k*gap;g.gain.setValueAtTime(v,tk);g.gain.linearRampToValueAtTime(v*0.15,tk+gap*0.92);}
    const t3=t+3*gap;g.gain.setValueAtTime(v*0.9,t3);g.gain.exponentialRampToValueAtTime(v*1e-3,end);
    chain(n,b,h,gain(c,1.9),g,out);
    return end;
  },
  hat(c,out,[mul,dec,hpf,metal],t,v,tr,rng){
    const end=t+0.001+dec,sum=gain(c,0.22*metal),bp=filter(c,'bandpass',10000,0.6),hp=filter(c,'highpass',hpf,0.7),g=c.createGain();

    sum.connect(bp);
    if(metal<0.99){const n=noise(c,t,end-t,0,rng);n.connect(gain(c,0.9*(1-metal))).connect(bp);}
    env(g,t,v*1.6,0.0008,dec);chain(bp,hp,g,out);
    return end;
  },
  tom(c,out,[f,dec,sw,nz],t,v,tr,rng){
    const end=t+0.002+dec,o=osc(c,'sine',f*(1+2*sw),t,end);
    o.frequency.exponentialRampToValueAtTime(f,t+0.02+0.08*sw);o.frequency.exponentialRampToValueAtTime(f*0.86,end);
    const g=c.createGain();env(g,t,v*0.95,0.002,dec);o.connect(g).connect(out);
    if(nz>0.02){const n=noise(c,t,0.05,0,rng),b=filter(c,'bandpass',Math.min(8000,f*6),1),ng=c.createGain();env(ng,t,v*0.8*nz,0.0005,0.035);chain(n,b,ng,out);}
    return end;
  },
  bass(c,out,[n,dec,flt,res],t,v,tr,rng){

    const o=osc(c,'sine',f*1.12,t,end);o.frequency.exponentialRampToValueAtTime(f,t+0.035);
    const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*(1-0.45*flt),t+0.004);g.gain.setValueAtTime(v*(1-0.45*flt),t+0.004+dec*0.25);

      const s=osc(c,'sawtooth',f,t,end),l=filter(c,'lowpass',f*(2+40*flt*flt),0.7+16*res*res),g2=c.createGain();
      l.frequency.setValueAtTime(Math.min(18000,f*(2+40*flt*flt)),t);l.frequency.exponentialRampToValueAtTime(Math.max(40,f*(1.2+4*flt)),t+Math.max(0.05,dec*0.6));
      g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(v*0.42*flt,t+0.004);g2.gain.exponentialRampToValueAtTime(1e-4,end);
      chain(s,l,g2,out);

  },
  zap(c,out,[f0,dec,sw,sh],t,v,tr,rng){
    const end=t+0.001+dec,o=osc(c,['sine','triangle','square'][sh],f0,t,end);

  noise(c,out,[cut,dec,sw,grain],t,v,tr,rng){

  cow(c,out,[mul,dec,tone,det],t,v,tr,rng){

  },
  smp(c,out,[st,start,len,flt],t,v,tr,rng){
    const buf=tr.sample&&sampleBuffer(tr.sample,tr.rev);if(!buf)return t;
    const rate=Math.pow(2,st/12),dur=buf.duration,s0=Math.min(dur-0.001,start*dur),L=Math.max(0.004,(dur-s0)*Math.max(0.005,len)),real=L/rate,end=t+real;
    const n=c.createBufferSource();n.buffer=buf;n.playbackRate.value=rate;

    src.connect(g).connect(out);n.start(t,s0,L+0.01);

};
/* ---------------- Sons Space age ---------------- */
Object.assign(VOICES,{
  laser(c,out,[f0,dec,drop,sh],t,v){
    const end=t+0.002+dec,ty=['sine','square','sawtooth'][sh],fe=Math.max(40,f0/(1+30*drop*drop));

    o1.frequency.exponentialRampToValueAtTime(fe,t+dec*0.85);o2.frequency.exponentialRampToValueAtTime(fe*1.012,t+dec*0.85);
    const l=filter(c,'lowpass',Math.min(16000,f0*4),0.7),g=c.createGain();

  },
  ufo(c,out,[f,dur,rate,rise],t,v){

    const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+Math.min(0.06,dur*0.2));
    g.gain.setValueAtTime(v,end-Math.min(0.12,dur*0.3));g.gain.linearRampToValueAtTime(0,end);
    chain(o,am,g,out);
    return end;
  },
  theremin(c,out,[n,dur,gl,vib],t,v){

    const fe=f*Math.pow(2,gl/12);

  sonar(c,out,[f,dec,reps,gap],t,v){

/* ---------------- Boutons rotatifs ---------------- */
function arcPath(r,a1,a2){
  const p=a=>{const t=a*Math.PI/180;return [22+r*Math.sin(t),22-r*Math.cos(t)];};
  if(Math.abs(a2-a1)<0.5)return '';
  const [x1,y1]=p(a1),[x2,y2]=p(a2);
  return `M${x1.toFixed(2)} ${y1.toFixed(2)}A${r} ${r} 0 ${a2-a1>180?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
}

    <circle cx="24" cy="24" r="13" fill="currentColor"/><circle class="kn-c" cx="22" cy="22" r="13" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <line class="kn-p" x1="22" y1="22" stroke="currentColor" stroke-width="2.6" stroke-linecap="square"/></svg>`;
  const txt=el('div',{class:'kn-txt'},[el('span',{class:'kn-l',text:o.label}),el('span',{class:'kn-v'})]);
  if(o.mini)root.append(txt);else root.append(...txt.childNodes);
  const arc=$('.kn-a',root),ptr=$('.kn-p',root),val=$('.kn-v',root);
  function draw(){
    const v=clamp(o.get(),0,1),a=-135+270*v;
    arc.setAttribute('stroke',typeof o.color==='function'?o.color():(o.color||'currentColor'));
    arc.setAttribute('d',o.bip?(v<0.5?arcPath(19,a,0):arcPath(19,0,a)):arcPath(19,-135,a));
    const t=a*Math.PI/180;ptr.setAttribute('x2',(22+11*Math.sin(t)).toFixed(2));ptr.setAttribute('y2',(22-11*Math.cos(t)).toFixed(2));

  root.addEventListener('wheel',e=>{e.preventDefault();const b=o.start?o.start():null;set(o.get()+(e.deltaY<0?1:-1)*(o.step||0.02));clearTimeout(root._w);root._w=setTimeout(()=>o.end&&o.end(b),400);},{passive:false});

/* sons importés : IndexedDB (base « sobre-bit ») */
const DB={db:null,saved:new Set(),ok:!!window.indexedDB};
function idb(){
  if(DB.db)return Promise.resolve(DB.db);
  return new Promise((res,rej)=>{const r=indexedDB.open('sobre-bit',1);r.onupgradeneeded=()=>r.result.createObjectStore('samples',{keyPath:'id'});r.onsuccess=()=>{DB.db=r.result;res(DB.db);};r.onerror=()=>rej(r.error);});
}
function usedSamples(){return new Set(S.proj.tracks.filter(t=>t.sample).map(t=>t.sample));}
async function saveSamples(){
  if(!DB.ok)return;
  try{
    const used=usedSamples(),d=await idb();
    const tx=d.transaction('samples','readwrite'),st=tx.objectStore('samples');
    for(const id of used)if(!DB.saved.has(id)){const s=BIT.SMP.get(id);if(s){st.put({id:s.id,name:s.name,rate:s.rate,ch:s.ch});DB.saved.add(id);}}
    const keys=await new Promise(r=>{const q=st.getAllKeys();q.onsuccess=()=>r(q.result);q.onerror=()=>r([]);});
    for(const k of keys)if(!used.has(k)){st.delete(k);DB.saved.delete(k);}
  }catch(e){sbSave('sons non gardés',true);}
}
async function loadSession(){
  let o=null;try{o=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){}

let importTo=0;
function openImport(i){importTo=i==null?S.sel:i;$('#in-audio').value='';$('#in-audio').click();}

const baseName=n=>n.replace(/\.[^.]+$/,'').replace(/[_]+/g,' ').trim().slice(0,40)||'Son';
const uid=()=>'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
async function decode(file){
  const ab=await file.arrayBuffer();
  const ai=CODEC.aiff(ab.slice(0));
  if(ai){let ch=ai.ch;if(ai.rate!==48000)ch=CODEC.resample(ch,ai.rate,48000);return ch.slice(0,2);}
  const oc=new OfflineAudioContext(1,1,48000);
  const buf=await new Promise((res,rej)=>{const p=oc.decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej);});
  const ch=[];for(let c=0;c<Math.min(2,buf.numberOfChannels);c++)ch.push(buf.getChannelData(c).slice());
  return ch;
}
async function importFiles(files,to){
  files=files.filter(f=>!/\.sobrebit$/i.test(f.name)).slice(0,TRACKS);if(!files.length)return;
  const ok=[],bad=[];let cut=false;
  await busy(files.length>1?`Lecture de ${files.length} fichiers…`:'Lecture du fichier…',async()=>{
    for(const f of files){try{const ch=await decode(f);const r=CODEC.prepSample(ch,48000,12);if(r.empty){bad.push(f.name+' (silence)');continue;}if(r.cut)cut=true;
      ok.push(BIT.addSample({id:uid(),name:baseName(f.name),rate:48000,ch:r.ch}));}catch(e){bad.push(f.name);}}
  });
  if(ok.length){
    edit(ok.length>1?'Importer des sons':'Importer un son',()=>{
      ok.forEach((s,k)=>{const tr=track((to+k)%TRACKS);tr.type='smp';tr.sample=s.id;tr.rev=false;tr.p=BIT.defP('smp');tr.name=s.name.slice(0,24);});
    });
    S.sel=to;renderPads();renderSound();
    const s0=ok[0];
    flash((ok.length>1?`${ok.length} sons importés, à partir de la piste ${to+1}.`:`Son importé : « ${s0.name} » (${num(s0.ch[0].length/48000,2)} s), calé sur sa première attaque.`)+(cut?' Les sons longs sont coupés à 12 s.':''));
    hitPad(to);
  }
  if(bad.length)dialog({title:'Fichier illisible',html:`<p>Ce navigateur ne sait pas lire : ${bad.map(n=>'« '+esc(n)+' »').join(', ')}.</p><p>Les formats sûrs sont MP3, WAV, FLAC, OGG et M4A. Sinon, convertissez le fichier en WAV avec un autre logiciel (SobreVoX, par exemple).</p>`});
}

/* ---------------- Travailleur pour les encodeurs ---------------- */
/* Le travailleur est d'abord essayé avec un petit calcul (sans rien lui confier) : s'il ne répond pas, tout se fait
   dans la page, un peu plus lentement. On ne lui confie jamais de données avant de savoir qu'il marche. */
const W={w:null,id:0,cb:new Map(),ready:null};
function worker(){
  if(W.ready)return W.ready;
  W.ready=new Promise(res=>{
    let w;try{w=new Worker(URL.createObjectURL(new Blob([$('#codec-src').textContent],{type:'text/javascript'})));}catch(e){res(null);return;}
    const fail=()=>{clearTimeout(to);try{w.terminate();}catch(e){}for(const c of W.cb.values())c.retry();W.cb.clear();W.w=null;res(null);};
    const to=setTimeout(fail,2000);
    w.onerror=e=>{e.preventDefault&&e.preventDefault();fail();};
    w.onmessage=e=>{const {id,r,err}=e.data;if(id===0){clearTimeout(to);W.w=w;res(w);return;}const c=W.cb.get(id);if(!c)return;W.cb.delete(id);err?c.rej(new Error(err)):c.res(r);};
    w.postMessage({id:0,op:'peak',args:[[new Float32Array(4)]]});
  });
  return W.ready;
}
async function work(op,...args){
  const w=await worker();
  const here=()=>new Promise(r=>setTimeout(r,20)).then(()=>CODEC[op](...args));
  if(!w)return here();
  return new Promise((res,rej)=>{const id=++W.id;
    W.cb.set(id,{res,rej,retry:()=>rej(new Error('L’encodage s’est interrompu, recommencez l’export.'))});
    const tr=[];for(const a of args)if(Array.isArray(a))a.forEach(d=>{if(d&&d.buffer instanceof ArrayBuffer)tr.push(d.buffer);});
    try{w.postMessage({id,op,args},[...new Set(tr)]);}catch(e){W.cb.delete(id);here().then(res,rej);}});
}
/* MP3 : lamejs (LGPL) dans un travailleur, comme dans SobreVoX. */
function mp3(ch,rate,kbps){
  const lame=$('#lame-src').textContent;
  const here=()=>new Promise((res,rej)=>setTimeout(()=>{try{const L=(new Function(lame+';return lamejs;'))();const enc=new L.Mp3Encoder(ch.length,rate,kbps),out=[];const B=1152*16;
      const q=d=>{const o=new Int16Array(d.length);for(let i=0;i<d.length;i++){const v=Math.round(d[i]*32768);o[i]=v>32767?32767:v<-32768?-32768:v;}return o;};
      for(let i=0;i<ch[0].length;i+=B){const s=ch.map(d=>q(d.subarray(i,i+B)));const b=s.length>1?enc.encodeBuffer(s[0],s[1]):enc.encodeBuffer(s[0]);if(b.length)out.push(new Uint8Array(b));}
      out.push(new Uint8Array(enc.flush()));res(new Blob(out,{type:'audio/mpeg'}));}catch(e){rej(new Error('Encodage MP3 impossible : '+(e.message||e)));}},20));
  const code=lame+`
self.onmessage=function(e){var ch=e.data.ch,rate=e.data.rate,kbps=e.data.kbps,n=ch[0].length;
var enc=new lamejs.Mp3Encoder(ch.length,rate,kbps),out=[],B=1152*16,s=12345;
function q(d,i0,i1){var o=new Int16Array(i1-i0);for(var i=i0;i<i1;i++){s=(s*1103515245+12345)>>>0;var r=s/4294967296;s=(s*1103515245+12345)>>>0;
var v=Math.round(d[i]*32768+r-s/4294967296);o[i-i0]=v>32767?32767:v<-32768?-32768:v;}return o;}
for(var i=0;i<n;i+=B){var e2=Math.min(n,i+B);var b=ch.length>1?enc.encodeBuffer(q(ch[0],i,e2),q(ch[1],i,e2)):enc.encodeBuffer(q(ch[0],i,e2));if(b.length)out.push(new Uint8Array(b));}
var f=enc.flush();if(f.length)out.push(new Uint8Array(f));self.postMessage(out);};`;
  return new Promise((res,rej)=>{
    let w;try{w=new Worker(URL.createObjectURL(new Blob([code],{type:'text/javascript'})));}catch(e){w=null;}
    if(!w){here().then(res,rej);return;}
    // si le travailleur est bloqué, on encode dans la page : les copies confiées au travailleur sont perdues, pas l'original
    w.onmessage=e=>{w.terminate();res(new Blob(e.data,{type:'audio/mpeg'}));};
    w.onerror=e=>{e.preventDefault&&e.preventDefault();try{w.terminate();}catch(err){}here().then(res,rej);};
    const cc=ch.map(d=>d.slice());w.postMessage({ch:cc,rate,kbps},cc.map(d=>d.buffer));
  });
}

function safeName(n){return (n||'Sans titre').replace(/[\\/:*?"<>|]+/g,'-').trim()||'SobreBiT';}
function download(blob,name){
  const url=URL.createObjectURL(blob);const a=el('a',{href:url,download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}
const sizeStr=b=>b>1e6?num(b/1e6,1)+' Mo':Math.max(1,Math.round(b/1e3))+' ko';
function seqFor(what,reps){const base=what==='chain'?S.proj.chain.slice():[S.proj.pat];let s=[];for(let r=0;r<reps;r++)s=s.concat(base);return s;}
async function encode(ch,E){
  if(E.fmt==='wav')return new Blob([await work('wav',ch,E.rate,E.bits)],{type:'audio/wav'});
  if(E.fmt==='flac')return new Blob([await work('flac',ch,E.rate,Math.min(24,E.bits))],{type:'audio/flac'});
  return mp3(ch,E.rate,E.kbps);
}

/* ---------------- Dialogues ---------------- */
let dlgOpen=0;
function dialog({title,html,node,buttons,wide,cls,extra}){
  buttons=buttons||[{l:'OK',v:true,def:true}];
  return new Promise(res=>{
    dlgOpen++;
    const prev=document.activeElement;
    const ov=el('div',{class:'ov'});
    const d=el('div',{class:'dlg'+(wide?' wide':'')+(cls?' '+cls:''),role:'dialog','aria-modal':'true','aria-label':title||'Dialogue'});
    if(title)d.append(el('h2',{text:fr(title)}));
    if(html){const b=el('div',{html:fr(html),style:'display:flex;flex-direction:column;gap:10px'});d.append(b);}
    if(node)d.append(node);
    const row=el('div',{class:'btns'});if(extra)row.append(extra);
    const close=v=>{ov.remove();dlgOpen--;document.removeEventListener('keydown',key,true);prev&&prev.focus&&prev.focus({preventScroll:true});res(v);};
    let defB=null;
    for(const bt of buttons){const b=el('button',{type:'button',class:'btn'+(bt.def?' default':''),text:bt.l});b.addEventListener('click',()=>close(bt.v));row.append(b);if(bt.def)defB=b;}
    d.append(row);ov.append(d);document.body.append(ov);
    ov.addEventListener('pointerdown',e=>{if(e.target===ov){const c=buttons.find(b=>b.cancel);if(c||buttons.length===1)close(c?c.v:buttons[0].v);}});
    const key=e=>{
      if(e.key==='Escape'){e.preventDefault();e.stopPropagation();const c=buttons.find(b=>b.cancel)||buttons[buttons.length===1?0:-1];close(c?c.v:null);}
      else if(e.key==='Enter'&&document.activeElement&&!['BUTTON','SELECT','TEXTAREA'].includes(document.activeElement.tagName)&&defB){e.preventDefault();e.stopPropagation();defB.click();}
      else if(e.key==='Tab'){const f=$$('button,input,select',d).filter(x=>!x.disabled);const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus();}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus();}}
      e.stopPropagation();
    };
    document.addEventListener('keydown',key,true);
    const first=d.querySelector('input[type=text]');(first||defB||row.firstChild).focus({preventScroll:true});if(first)first.select();d.scrollTop=0;
  });
}

async function busy(label,fn){
  if(busyOn)return;busyOn=true;
  const ov=el('div',{class:'ov'}),d=el('div',{class:'dlg busy',role:'alertdialog','aria-label':label},[el('p',{text:fr(label)}),el('div',{class:'bar ind'},[el('i')])]);

<p>SobreBiT démarre sur une grille vide, avec huit sons de batterie. Le bouton <b>Style</b> au-dessus de la grille (ou le menu Style) propose trois styles : <b>Batterie</b>, <b>Space age</b> et <b>Électro</b>. Chacun a ses démos : un clic charge d’un coup les sons, le rythme, le tempo et les effets dans le motif A (les motifs B, C et D sont gardés). Ouvrir un style met aussi ses sons en tête de la liste de chaque piste ; les autres restent disponibles plus bas.</p>
<h3>Jouer</h3>
<p><kbd>Espace</kbd> lance ou arrête la boucle. Les <b>pads</b> à gauche de la grille (ou les touches <kbd>1</kbd> à <kbd>8</kbd>) jouent chaque son et le choisissent pour la palette Son.</p>
<p>Avec <b>●</b> (<kbd>R</kbd>), ce que vous jouez sur les pads pendant la lecture s’écrit dans le motif, calé sur le pas le plus proche.</p>
<h3>Écrire un rythme</h3>
<ul><li>Chaque ligne est un son, chaque case un pas : seize pas font une mesure. Cliquez pour allumer, glissez pour en allumer plusieurs.</li>
<li>L’interrupteur au-dessus de la grille dit ce que fait un clic : <b>Pas</b> (allumer, éteindre), <b>Force</b> (doux, normal, fort), <b>Roulement</b> (2, 3 ou 4 coups rapides dans le pas, pour les roulements de charleston), <b>Chance</b> (le pas joue toujours, 3 fois sur 4, 1 fois sur 2 ou 1 fois sur 4 : la boucle change un peu à chaque tour).</li>
<li>Raccourcis : <kbd>Maj</kbd>+clic pour la force, <kbd>Alt</kbd>+clic pour le roulement, ${MOD}clic pour la chance. Le <b>clic droit</b> (ou un appui long au doigt) ouvre le menu de la case.</li>
<li>Une case pleine est forte, à moitié normale, basse douce ; coupée en morceaux, elle roule ; tramée, elle dépend de la chance.</li>
<li><b>M</b> rend un son muet, <b>S</b> le fait jouer seul.</li></ul>
<h3>Les sons</h3>
<ul><li>Tous les sons sont fabriqués par le logiciel : aucun échantillon n’est livré avec. Chaque piste peut prendre n’importe quel son (menu de la palette Son), rangé en familles : <b>Batterie</b> (grosse caisse, caisse claire, clap, charlestons, tom, basse, zap, bruit, cloche), <b>Space age</b> (laser, soucoupe, thérémine, sonar, robot, ordinateur, cristal, décollage) et <b>Électro</b> (Acid, Reese, Hoover, Stab, Chip, Voyelle, Glitch, Clic, Industriel). Sur l’Acid, un pas fort fait un accent : le filtre s’ouvre et couine plus.</li>
<li><b>Couleurs</b> : la couleur d’une piste dit le rôle de son son (rouge frappe grave, orange basse, bleu contretemps, jaune métal, vert son accordé, violet nappe ou voix, gris effet, noir son importé). Les sons Space age sont tramés de points, les sons Électro rayés. Une couleur choisie à la main (pastille de la palette Son) est gardée ; un point la signale. Fenêtre › Couleur des pistes permet de revenir aux couleurs par numéro.</li>
<li>Quatre boutons règlent le son : glissez vers le haut ou le bas (<kbd>Maj</kbd> pour plus de finesse), double-cliquez pour revenir au réglage de départ.</li>
<li><b>Importer un son</b> (ou glisser un fichier MP3, WAV, FLAC… sur un pad) le met sur la piste. Il est calé sur sa première attaque et mis au niveau des autres. Réglages : accord en demi-tons, début, longueur, filtre, à l’envers.</li>
<li>Le charleston fermé coupe le charleston ouvert, comme sur les machines d’origine. Chaque piste joue un son à la fois.</li></ul>
<h3>Motifs et chaîne</h3>
<p>Quatre motifs, <b>A</b> à <b>D</b>. Pendant la lecture, le motif choisi prend la suite à la fin de la mesure (sa touche clignote en attendant). <b>Chaîne</b> joue les motifs dans l’ordre choisi (clic droit sur la touche pour la modifier, ou menu Motif). Édition : copier, coller, effacer un motif, décaler une piste.</p>
<h3>Effets</h3>
<p>Ils agissent en direct sur le mélange : <b>filtre</b> (à gauche il ne garde que les graves, à droite que les aigus ; la résonance le fait siffler), <b>bits</b> (le son se dégrade façon console 8 bits), <b>saturation</b>, <b>écho</b> calé sur le tempo, qui part à gauche puis à droite. Décochez « Passe par les effets » pour garder un son intact.</p>
<h3>Exporter</h3>
<p>Fichier › Exporter (${MOD}E) : WAV, MP3 ou FLAC, le motif ou la chaîne, répété 1 à 16 fois. <b>Boucle sans couture</b> : la queue de l’écho retombe au début du fichier, la boucle tourne sans à-coup. <b>Une piste par son</b> : un fichier par son dans une archive .zip, à déposer dans SobreVoX pour monter et mixer.</p>
<h3>Ce qui est gardé</h3>
<p>Le projet et les sons importés restent dans ce navigateur et reviennent au prochain lancement. Fichier › <b>Enregistrer le projet</b> crée un fichier .sobrebit à emporter. Rien n’est envoyé sur Internet.</p>
<h3>Sur téléphone</h3>
<p>La grille montre huit pas à la fois (1–8, 9–16) et suit la lecture. Sur iPhone, le bouton silence peut couper le son du navigateur.</p>`});
}

function toggleMS(i,k){track(i)[k]=!track(i)[k];renderPads();renderGrid();mix();saveSoon();flash(`${track(i).name} : ${k==='mute'?(track(i).mute?'muet':'audible'):(track(i).solo?'solo':'solo retiré')}.`);}
function toggleSide(){S.prefs.side=!S.prefs.side;savePrefs();layout();}
let openMenuId=null,menuEl=null;
function buildMenubar(){
  const mb=$('#menubar');mb.innerHTML='';
  for(const m of menuDefs()){
    const b=el('button',{type:'button',class:'mb-btn'+(m.logo?' mb-logo':''),'aria-haspopup':'menu','aria-expanded':'false','data-menu':m.id,'aria-label':m.logo?m.label:null});
    if(m.logo)b.innerHTML=LOGO_SVG;else b.textContent=m.label;
    b.addEventListener('click',()=>{openMenuId===m.id?closeMenus():openMenu(m.id);});
    b.addEventListener('mouseenter',()=>{if(openMenuId&&openMenuId!==m.id)openMenu(m.id);});
    b.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();openMenu(m.id,true);}});
    mb.appendChild(b);
  }
  mb.appendChild(el('div',{class:'mb-spacer'}));
}
function fillMenu(items,label){
  const m=el('div',{class:'menu',role:'menu','aria-label':label||'Menu'});
  for(const it of items){
    if(it==='-'){m.appendChild(el('hr'));continue;}
    if(it.h){m.appendChild(el('div',{class:'mh',text:fr(it.h)}));continue;}
    const b=el('button',{type:'button',role:it.chk!==undefined?'menuitemcheckbox':'menuitem','aria-checked':it.chk!==undefined?String(!!it.chk):null,disabled:!!it.dis});
    const lab=el('span');if(it.sw)lab.append(el('span',{class:'sw',style:`background:${it.sw}`}));lab.append(fr(it.l));b.appendChild(lab);
    if(it.k)b.appendChild(el('span',{class:'kb',text:it.k}));
    b.addEventListener('click',()=>{closeMenus();if(it.a)it.a();});
    m.appendChild(b);
  }
  return m;
}
function placeMenu(m,r){
  document.body.appendChild(m);
  m.style.top=r.bottom+'px';m.style.left=Math.max(8,Math.min(r.left,window.innerWidth-m.offsetWidth-8))+'px';
  const mh=window.innerHeight-r.bottom-8;if(m.offsetHeight>mh){if(r.top>mh&&r.top-8>m.offsetHeight){m.style.top=(r.top-m.offsetHeight)+'px';}else{m.style.maxHeight=mh+'px';m.style.overflowY='auto';}}
}
function menuKeys(m,id){
  m.addEventListener('keydown',e=>{
    e.stopPropagation();
    const items=$$('button:not([disabled])',m);const i=items.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){e.preventDefault();(items[i+1]||items[0]).focus();}
    else if(e.key==='ArrowUp'){e.preventDefault();(items[i-1]||items[items.length-1]).focus();}
    else if(id&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();const ids=menuDefs().map(x=>x.id);const k=ids.indexOf(openMenuId);openMenu(ids[(k+(e.key==='ArrowRight'?1:-1)+ids.length)%ids.length],true);}
    else if(e.key==='Escape'){e.preventDefault();const b=id&&$('[data-menu="'+openMenuId+'"]');closeMenus();b&&b.focus();}
  });
}
function openMenu(id,focusFirst){
  closeMenus(true);
  const def=menuDefs().find(m=>m.id===id);if(!def)return;
  const btn=$('[data-menu="'+id+'"]');btn.setAttribute('aria-expanded','true');openMenuId=id;
  menuEl=fillMenu(def.items,def.label);menuKeys(menuEl,id);placeMenu(menuEl,btn.getBoundingClientRect());
  if(focusFirst){const f=menuEl.querySelector('button:not([disabled])');f&&f.focus();}
}
function popMenu(items,anchor){
  closeMenus();menuEl=fillMenu(items);menuKeys(menuEl,null);placeMenu(menuEl,anchor.getBoundingClientRect());
  const f=menuEl.querySelector('button[aria-checked="true"]:not([disabled])')||menuEl.querySelector('button:not([disabled])');f&&f.focus({preventScroll:true});
}
function closeMenus(keepId){
  if(menuEl){menuEl.remove();menuEl=null;}
  $$('[data-menu]').forEach(b=>b.setAttribute('aria-expanded','false'));
  if(!keepId)openMenuId=null;
}
document.addEventListener('pointerdown',e=>{if(menuEl&&!e.target.closest('.menu')&&!e.target.closest('[data-menu]')&&!e.target.closest('.swb'))closeMenus();});

/* ---------------- Boutons ---------------- */
const ACT={play:togglePlay,stop:()=>{stop();if(A.rec){A.rec=false;renderTransport();}},rec:toggleRec,tdown:e=>setTempo(S.proj.tempo-(e&&e.shiftKey?10:1)),tup:e=>setTempo(S.proj.tempo+(e&&e.shiftKey?10:1)),tap,
  chain:null,quit,toggleside:toggleSide,fxreset:fxReset,styles:()=>stylesDlg()};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||!ACT[b.dataset.act])return;ACT[b.dataset.act](e);});

/* ---------------- Clavier ---------------- */
document.addEventListener('keyup',e=>{if(e.key===' '&&(e.target.tagName||'').toLowerCase()==='button'&&!dlgOpen&&!menuEl)e.preventDefault();},true);
const PADCODE=c=>{const m=/^(?:Digit|Numpad)([1-8])$/.exec(c);return m?+m[1]-1:-1;};
document.addEventListener('keydown',e=>{
  if(!$('#splash').hidden||!$('#quit').hidden||dlgOpen||busyOn)return;
  const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'&&!['checkbox','radio'].includes(e.target.type)||tag==='select'||tag==='textarea')return;
  const mod=e.ctrlKey||e.metaKey,k=e.key,l=k.length===1?k.toLowerCase():k;
  if(menuEl&&k==='Escape'){closeMenus();return;}
  if(mod){
    const map={z:e.shiftKey?redo:undo,y:redo,c:copyPat,v:pastePat,s:saveProject,e:exportDlg,q:quit,o:()=>{$('#in-proj').value='';$('#in-proj').click();}};
    if(l==='i'&&e.shiftKey){e.preventDefault();openImport(S.sel);return;}
    if(map[l]&&!(l==='c'&&String(window.getSelection()))){e.preventDefault();map[l]();}
    return;
  }
  if(e.altKey)return;
  if(e.repeat&&(k===' '||PADCODE(e.code)>=0))return;
  const pc=PADCODE(e.code);
  if(pc>=0){e.preventDefault();selectTrack(pc,true);renderStatus();hitPad(pc,e.shiftKey?3:2);return;}
  switch(k){
    case ' ':case 'Spacebar':e.preventDefault();togglePlay();return; // Espace lance ou arrête toujours la lecture (Entrée active les boutons)
    case 'Escape':e.preventDefault();ACT.stop();return;
    case 'ArrowUp':case 'ArrowDown':if(tag==='button'&&e.target.closest('.kn'))return;e.preventDefault();selectTrack((S.sel+(k==='ArrowUp'?TRACKS-1:1))%TRACKS);return;
    case 'ArrowLeft':case 'ArrowRight':if(e.shiftKey){e.preventDefault();shiftRow(S.sel,k==='ArrowLeft'?-1:1);}return;
    case 'Delete':case 'Backspace':e.preventDefault();clearRow(S.sel);return;
    case 'F1':e.preventDefault();help();return;
    case '+':case '=':e.preventDefault();setTempo(S.proj.tempo+(e.shiftKey&&k==='+'?1:1));return;
    case '-':case '_':e.preventDefault();setTempo(S.proj.tempo-1);return;
  }
  const map={a:()=>choosePat(0),b:()=>choosePat(1),c:()=>choosePat(2),d:()=>choosePat(3),r:toggleRec,t:tap,m:()=>toggleMS(S.sel,'mute'),s:()=>toggleMS(S.sel,'solo')};
  if(map[l]){e.preventDefault();map[l]();}
});

/* ---------------- Glisser-déposer : un son sur un pad, un projet n'importe où ---------------- */
let dragDepth=0;
const hasFiles=e=>[...(e.dataTransfer&&e.dataTransfer.types||[])].includes('Files');
function dropRow(e){const r=document.elementFromPoint(e.clientX,e.clientY);const row=r&&r.closest&&r.closest('.row[data-t]');return row?+row.dataset.t:null;}
document.addEventListener('dragenter',e=>{if(!hasFiles(e))return;e.preventDefault();dragDepth++;document.body.classList.add('dragging');});
document.addEventListener('dragover',e=>{if(!hasFiles(e))return;e.preventDefault();e.dataTransfer.dropEffect='copy';const t=dropRow(e);$$('.row.drop').forEach(r=>{if(+r.dataset.t!==t)r.classList.remove('drop');});if(t!=null)grid.querySelector(`.row[data-t="${t}"]`).classList.add('drop');});
document.addEventListener('dragleave',e=>{if(!hasFiles(e))return;dragDepth=Math.max(0,dragDepth-1);if(!dragDepth){document.body.classList.remove('dragging');$$('.row.drop').forEach(r=>r.classList.remove('drop'));}});
document.addEventListener('drop',e=>{
  if(!hasFiles(e))return;e.preventDefault();dragDepth=0;document.body.classList.remove('dragging');$$('.row.drop').forEach(r=>r.classList.remove('drop'));
  const files=[...e.dataTransfer.files];if(!files.length)return;
  const pj=files.find(f=>/\.sobrebit$/i.test(f.name));if(pj){openProject(pj);return;}
  const t=dropRow(e);importFiles(files,t!=null?t:S.sel);
});

function layout(){
  const w=window.innerWidth;
  document.body.classList.toggle('narrow',w<760);document.body.classList.toggle('mid',w<1120&&S.prefs.side);
  $('#body').classList.toggle('noside',!S.prefs.side);$('#side').hidden=!S.prefs.side;
  renderPage();
  // sur ordinateur, les lignes prennent la hauteur disponible (de 34 à 56 px)
  const root=document.documentElement.style;
  if(!document.body.classList.contains('narrow')&&!document.body.classList.contains('mid')){
    const sq=$('#seq'),lr=$('.ledrow',grid);const avail=sq.clientHeight-22-(lr?lr.offsetHeight+4:30);
    root.setProperty('--ch',clamp(Math.floor(avail/TRACKS-6),34,56)+'px');
  }else root.removeProperty('--ch');
}
let rsT=0;window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(layout,100);});
window.addEventListener('pagehide',()=>save());

loadSession().then(r=>{if(r)started='restored';renderAll();layout();}).catch(()=>{renderAll();layout();});

window.__bit={S,A,BIT,CODEC,play,stop,hitPad,exportDlg,importFiles,openProject,saveProject,render:BIT.render,work,mp3,choosePat,toggleChain,setTempo,undo,redo,fx,mix,renderAll};
