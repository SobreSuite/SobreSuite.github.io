<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SobrePiX</title>
<!--
  SobrePiX — retouche photo frugale. Gamme SOBRE.
  © 2026 Auraponymous. Un seul fichier HTML, sans connexion : ouvrez-le dans Firefox ou Chrome.
  Police : VT323 (SIL Open Font License 1.1), embarquée dans le bloc « sobre-theme ».
-->
<style>
:root{--ink:#000;--paper:#fff;--mute:#4f4f4f;--logo:#3A3733;--ui:'VT323',ui-monospace,monospace;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overflow:clip}
body{background:var(--paper);color:var(--ink);font:400 14px/18px var(--ui);
  user-select:none;-webkit-user-select:none;cursor:default}
*{font-variant-ligatures:none}
img,.pat{image-rendering:crisp-edges;image-rendering:pixelated}
b,.b{font-weight:600}
body.busy,body.busy *{cursor:wait!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Barre de menus (style commun à la gamme SOBRE) ---------- */
#menubar{position:fixed;left:0;top:0;right:0;height:24px;background:var(--paper);border-bottom:1px solid var(--ink);z-index:10000;display:flex;align-items:stretch;padding:0 16px}
.mt{border:0;background:transparent;padding:0 10px;height:23px;font:400 14px/23px var(--ui);white-space:nowrap;display:flex;align-items:center;gap:6px;color:var(--ink)}
.mt.on{background:var(--ink);color:var(--paper)}
.mt.logo svg{width:22px;height:16px;display:block;image-rendering:pixelated}
.mt.logo.on svg{outline:1px solid var(--paper)}
#desk{position:fixed;left:0;right:0;top:54px;bottom:0;background:var(--desk) 0 0/2px 2px;image-rendering:pixelated}
.menu{position:fixed;z-index:10030;background:var(--paper);border:1px solid var(--ink);box-shadow:2px 2px 0 var(--ink);min-width:230px;padding:2px 0;font:400 14px var(--ui)}
.mi{position:relative;display:flex;gap:24px;padding:3px 14px 3px 22px;line-height:17px;white-space:nowrap}
.mi .k{margin-left:auto;opacity:.85}
.mi .arr{margin-left:auto}
.mi.hl{background:var(--ink);color:var(--paper)}
.mi.hl img{filter:invert(1)}
.mi .ck{position:absolute;left:6px;top:7px}
.menu hr{border:0;border-top:1px dotted var(--ink);margin:3px 0}

/* texte et contrôles inactifs : trame 50 % */
.dis,.btn:disabled,label.chk.dis,.bb:disabled{color:transparent!important;background-image:var(--p50)!important;background-size:2px 2px!important;
  -webkit-background-clip:text!important;background-clip:text!important}

/* ---------- Barre d'options de l'outil ---------- */
#optbar{position:fixed;left:0;right:0;top:24px;height:30px;background:var(--bureau);border-bottom:1px solid var(--ink);z-index:9990;
  display:flex;align-items:center;gap:16px;padding:0 16px;font-size:13px;white-space:nowrap;overflow:hidden}
#optbar .otl{font-weight:600;display:flex;align-items:center;gap:6px;min-width:110px}
#optbar .otl img{width:20px;height:20px}
#optbar .hint{margin:0;font-size:13px;color:var(--mute)}
#optbar label.chk{height:20px}
#optbar .sep{width:1px;align-self:stretch;margin:6px 0;background:var(--filet)}
.seg{display:inline-flex}
.seg .btn{border-radius:0;margin-left:-1px;min-width:0}
.seg .btn:first-child{border-radius:4px 0 0 4px;margin-left:0}
.seg .btn:last-child{border-radius:0 4px 4px 0}
.seg .btn.on{background:var(--ink);color:var(--paper)}
.olab{display:inline-flex;align-items:center;gap:6px}
.mini{display:inline-flex;align-items:center;gap:6px;touch-action:none}
.mini .mt2{position:relative;width:84px;height:16px}
.mini .ln{position:absolute;left:4px;right:4px;top:7px;height:1px;background:var(--ink)}
.mini .th{position:absolute;top:8px;width:11px;height:7px}
.mini .v{min-width:44px}
.mini .v input{width:44px}
input.num{width:58px}
select.fld{font:400 13px/18px var(--ui);height:22px;border:1px solid var(--ink);background:var(--feuille);color:var(--ink);border-radius:0;padding:0 4px}

/* ---------- Fenêtres et palettes ---------- */
.win{position:absolute;background:var(--paper);border:1px solid var(--ink);box-shadow:1px 1px 0 var(--ink)}
.tb{position:relative;height:19px;border-bottom:1px solid var(--ink);display:flex;justify-content:center}
.tb::before{content:"";position:absolute;left:1px;right:1px;top:3px;height:11px;background:var(--stripes) 0 0/1px 2px;image-rendering:pixelated}
.tt{position:relative;background:var(--paper);padding:0 10px;font-weight:600;font-size:14px;line-height:18px;height:18px;white-space:nowrap;overflow:hidden;max-width:calc(100% - 60px);text-overflow:ellipsis}
.cb,.zb{position:absolute;top:3px;width:11px;height:11px;border:1px solid var(--ink);background:var(--paper);box-shadow:0 0 0 2px var(--paper);z-index:1}
.cb{left:7px}
.zb{right:7px}
.zb::after{content:"";position:absolute;left:-1px;top:-1px;width:7px;height:7px;border:1px solid var(--ink)}
.cb.down{background:var(--burst) center/9px 9px no-repeat}
.zb.down{background:var(--ink)}
.wc{position:relative}
.outline{position:fixed;outline:1px dotted var(--ink);z-index:10040;pointer-events:none}
.pbody{padding:8px 12px 12px}
.frow{display:flex;align-items:center;gap:8px;min-height:30px}
.frow .lab{width:96px}
.sh{margin:10px 0 2px;border-bottom:1px dotted var(--ink);padding-bottom:1px}
.qrow{display:flex;gap:6px;margin:4px 0 2px 104px}
.qrow .btn.sm{min-width:0;flex:1;padding:0 4px}
.qrow .btn.on{box-shadow:inset 0 0 0 1px var(--ink);font-weight:600}
.hint{margin-top:8px;font-size:13px;line-height:16px}

/* boutons */
.btn{font:400 13px/20px var(--ui);height:24px;padding:0 12px;border:1px solid var(--ink);border-radius:4px;background:var(--paper);color:var(--ink);
  cursor:default;outline:none;white-space:nowrap}
.btn:active:not(:disabled),.btn.down{background:var(--ink);color:var(--paper)}
.btn.def{box-shadow:0 0 0 1px var(--paper),0 0 0 4px var(--ink);border-radius:6px}
.btn:focus-visible{outline:1px dotted var(--ink);outline-offset:-4px}
.btn.sm{padding:0 8px;height:20px;line-height:18px;font-size:12px}

/* cases et boutons radio */
label.chk{display:inline-flex;align-items:center;gap:7px;height:20px;white-space:nowrap}
label.chk input{position:absolute;opacity:0;width:0;height:0}
label.chk .box{width:12px;height:12px;flex:none;background:var(--chk0) 0 0/12px 12px;image-rendering:pixelated}
label.chk input:checked+.box{background-image:var(--chk1)}
label.chk.radio .box{background-image:var(--rad0)}
label.chk.radio input:checked+.box{background-image:var(--rad1)}
label.chk input:focus-visible+.box{outline:1px dotted var(--ink);outline-offset:2px}
.rgrid{display:grid;grid-template-columns:130px 1fr;grid-auto-rows:22px;margin:4px 0 0 4px}

/* champs */
input.fld,textarea.fld{font:400 13px/18px var(--ui);border:1px solid var(--ink);padding:0 6px;outline:none;background:var(--feuille);color:var(--ink);border-radius:0;
  user-select:text;-webkit-user-select:text;cursor:text}
input.fld{height:22px}
textarea.fld{display:block;width:100%;resize:none;padding:3px 6px;font-size:14px}
::selection{background:var(--ink);color:var(--paper)}

/* palette Outils : grille à filets, outils par paires */
.tgrid{display:grid;grid-template-columns:repeat(2,36px);grid-auto-rows:26px;margin:6px 6px 0;border:1px solid var(--ink);background:var(--feuille)}
.tool{width:36px;height:26px;border:0;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);background:var(--feuille);padding:0;display:flex;align-items:center;justify-content:center;outline:none}
.tool:nth-child(2n){border-right:0;width:35px}
.tool:nth-last-child(-n+2){border-bottom:0;height:25px}
.tool img{width:20px;height:20px}
.tool:active:not(:disabled),.tool.on{background:var(--ink)}
.tool:active:not(:disabled) img,.tool.on img{filter:invert(1)}
.tip{position:fixed;background:var(--paper);border:1px solid var(--ink);border-radius:6px;padding:3px 10px;font-size:13px;z-index:10050;pointer-events:none;white-space:nowrap}
.swz{position:relative;height:58px;margin:6px 6px 0;border:1px solid var(--ink);background:var(--feuille)}
.swz .c{position:absolute;width:28px;height:28px;border:1px solid var(--ink);padding:0;outline:none}
.swz .c.ink{left:12px;top:6px;box-shadow:0 0 0 1px var(--feuille)}
.swz .c.pap{left:28px;top:20px}
.swz .xs,.swz .df{position:absolute;width:11px;height:11px;border:0;padding:0;background:transparent}
.swz .xs{right:4px;top:4px}
.swz .df{left:3px;bottom:3px}
.swz .xs img,.swz .df img{display:block}
.swz .mk{position:absolute;right:3px;bottom:1px;font-size:11px;line-height:11px}
.vmodes{display:flex;margin:6px 6px 7px;border:1px solid var(--ink);background:var(--feuille)}
.vm{flex:1;height:20px;border:0;border-right:1px solid var(--ink);background:var(--feuille);padding:0;display:flex;align-items:center;justify-content:center;outline:none}
.vm:last-child{border-right:0}
.vm img{width:16px;height:12px}
.vm.on{background:var(--ink)}
.vm.on img{filter:invert(1)}
.cpop{position:fixed;z-index:10035;background:var(--paper);border:1px solid var(--ink);box-shadow:2px 2px 0 var(--ink);padding:8px}
.cpop .sw{display:grid;grid-template-columns:repeat(4,22px);gap:6px;margin:0 0 8px}

/* curseurs de réglage */
.sl{position:relative;height:36px;margin:0 2px 2px}
.slh{display:flex;justify-content:space-between;height:20px;padding:0 2px}
.slt{position:absolute;left:0;right:0;top:16px;height:20px;touch-action:none}
.slt .end{position:absolute;top:6px;width:7px;height:7px}
.slt .end.l{left:2px}.slt .end.r{right:2px}
.track{position:absolute;left:14px;right:14px;top:9px;height:1px;background:var(--ink)}
.tick{position:absolute;bottom:0;width:1px;background:var(--ink)}
.thumb{position:absolute;top:1px;width:11px;height:7px}
.sw{display:flex;gap:6px;margin:4px 0 2px}
.swb{width:20px;height:20px;border:1px solid var(--ink);padding:0;outline:none}
.swb.on{box-shadow:0 0 0 1px var(--paper),0 0 0 3px var(--ink)}

/* palette Calques */
.lyr{border-bottom:1px solid var(--ink)}
.lrow{display:flex;align-items:center;gap:5px;height:38px;padding:0 6px 0 4px;border-bottom:1px dotted var(--ink)}
.lrow:last-child{border-bottom:0}
.leye{width:18px;height:18px;border:0;padding:0;background:transparent;display:flex;align-items:center;justify-content:center;flex:none}
.leye img{width:14px;height:14px}
.lth{position:relative;width:34px;height:34px;border:1px solid var(--ink);flex:none;background:var(--dots) 0 0/4px 2px}
.lth canvas{display:block;width:32px;height:32px;image-rendering:auto}
.lth.tgt{box-shadow:0 0 0 1px var(--paper),0 0 0 3px var(--ink)}
.lth.off::after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent 47%,var(--red) 47% 53%,transparent 53%)}
.lth .tx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 22px var(--ui);color:var(--ink);background:var(--feuille)}
.lname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px;line-height:18px}
.lrow.on .lname{background:var(--ink);color:var(--paper)}
.lempty{height:38px;border-bottom:1px dotted var(--ink)}
.lempty:last-child{border-bottom:0}
.lctl{padding:6px 8px 4px;display:flex;flex-direction:column;gap:4px}
.lctl .r{display:flex;align-items:center;gap:6px;justify-content:space-between}
.lbtns{display:flex;justify-content:space-between;padding:4px 8px 8px}
.ib{width:30px;height:22px;border:1px solid var(--ink);border-radius:4px;background:var(--paper);padding:0;display:flex;align-items:center;justify-content:center;outline:none}
.ib img{width:14px;height:14px}
.ib:active:not(:disabled){background:var(--ink)}
.ib:active:not(:disabled) img{filter:invert(1)}
.pop{font:400 13px/18px var(--ui);height:22px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);padding:0 6px;box-shadow:1px 1px 0 var(--ink);display:inline-flex;align-items:center;gap:6px;min-width:0;outline:none}
.pop img{width:9px;height:5px}

/* ---------- Document ---------- */
.doc .wc{position:absolute;left:0;right:0;top:19px;bottom:0}
.rcorner{position:absolute;left:0;top:0;width:14px;height:14px;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.rtop{position:absolute;left:14px;right:0;top:0;height:14px;border-bottom:1px solid var(--ink)}
.rleft{position:absolute;left:0;top:14px;width:14px;bottom:20px;border-right:1px solid var(--ink)}
.rtop canvas,.rleft canvas{position:absolute;left:0;top:0}
.area{position:absolute;left:14px;right:0;top:14px;bottom:20px;overflow:hidden;background:var(--dots) 0 0/4px 2px;image-rendering:pixelated;touch-action:none}
.area canvas{position:absolute;left:0;top:0}
.area .ovc{pointer-events:none}
.bar{position:absolute;left:0;right:0;bottom:0;height:20px;background:var(--bureau);border-top:1px solid var(--ink);padding:0 26px 0 8px;font-size:12px;white-space:nowrap;line-height:19px;display:flex;gap:10px;align-items:center}
.bar .bi{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.bar .bz{display:flex;gap:4px;align-items:center;flex:none}
.bb{font:400 12px/14px var(--ui);height:16px;padding:0 5px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:0;outline:none;min-width:16px}
.bb.on,.bb:active:not(:disabled){background:var(--ink);color:var(--paper)}
.bar .zv{min-width:44px;text-align:center}
.grow{position:absolute;right:0;bottom:0;width:20px;height:20px;border-left:1px solid var(--ink);border-top:1px solid var(--ink);display:flex;align-items:center;justify-content:center;background:var(--bureau)}
.grow img{width:14px;height:14px}
textarea.tedit{position:fixed;z-index:9500;width:280px;font-size:15px!important;box-shadow:2px 2px 0 var(--ink)}

/* ---------- Dialogues (style commun à la gamme SOBRE) ---------- */
.ovl{position:fixed;inset:0;z-index:10010;display:flex;align-items:center;justify-content:center;padding:16px;background:color-mix(in srgb,var(--paper) 35%,transparent)}
.dlg{background:var(--paper);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);outline:1px solid var(--ink);outline-offset:-6px;padding:16px 18px;max-width:100%;max-height:100%;overflow:auto;
  display:flex;flex-direction:column;gap:12px}
.dlg p{margin:0;line-height:1.45}
.dlg-row{display:flex;gap:12px;align-items:flex-start}
.dlg-ico{flex:none;width:36px;height:36px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600}
.dlg-btns{display:flex;justify-content:flex-end;gap:16px;flex-wrap:wrap;border-top:1px solid var(--ink);padding-top:14px;margin-top:2px}
.dlg-btns .left{margin-right:auto}
.about{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:6px 10px}
.about img{width:260px;height:auto;image-rendering:auto}
.about .copy{font-size:12px;color:var(--mute)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:2px 18px;font-size:14px}
.keys span:nth-child(odd){font-weight:600;white-space:nowrap}
.keys .kh{grid-column:1/3;margin-top:8px;border-bottom:1px dotted var(--ink)}
/* dialogue flottant (réglages, effets) : la photo reste visible */
.fdlg{position:fixed;z-index:10012;background:var(--paper);border:1px solid var(--ink);box-shadow:2px 2px 0 var(--ink);width:300px}
.fdlg .fb{padding:8px 12px 12px}
.fdlg .dlg-btns{gap:10px;padding-top:10px}
.fdlg .note{font-size:13px;line-height:16px;color:var(--mute);margin:4px 2px 2px}
.fdlg .grp{margin:6px 0 4px;font-weight:600}
.fdlg canvas.cv{display:block;border:1px solid var(--ink);background:var(--feuille);margin:4px auto;touch-action:none}
.anchor{display:grid;grid-template-columns:repeat(3,22px);grid-auto-rows:22px;gap:2px}
.anchor button{border:1px solid var(--ink);background:var(--paper);padding:0}
.anchor button.on{background:var(--ink)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:14px}
.meta span:nth-child(odd){color:var(--mute);white-space:nowrap}
.loupe{position:fixed;width:204px;height:204px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);background:var(--feuille);z-index:9000;pointer-events:none}
.loupe canvas{width:200px;height:200px;display:block;image-rendering:pixelated}
/* ---------- Page d'accueil et écran de fermeture ---------- */
#splash,.quit{position:fixed;inset:0;z-index:20000;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px 16px;transition:opacity .25s ease}
#splash{cursor:pointer}
#splash.out{opacity:0}
.sp-logo{width:min(480px,78vw);height:auto;display:block;image-rendering:auto}
.sp-bar{width:min(340px,70vw);height:14px;border:1px solid var(--logo);padding:2px;background:var(--paper)}
.sp-fill{height:100%;width:0;background:var(--logo);animation:spfill 3s steps(24,end) forwards}
@keyframes spfill{to{width:100%}}
.sp-go{border:0;background:transparent;font:400 13px var(--ui);color:var(--mute);cursor:pointer;padding:4px 8px}
.sp-go:hover,.sp-go:focus-visible{color:var(--ink);text-decoration:underline;outline:none}
.sp-copy{margin:0;font:400 12px var(--ui);color:var(--mute);letter-spacing:.04em}
.q-msg{margin:0;font:400 15px var(--ui)}
body.dragover #desk{background:var(--ink)}
</style>
<style id="sobre-theme">
/* ==== Thème SobreSuite v1 — commun à toutes les apps de la gamme ====
   Police : VT323 (Peter Hull, licence SIL OFL 1.1), embarquée. Le gras est un gras « façon Mac » :
   chaque lettre redessinée décalée d'un pixel vers la droite (fichier VT323 gras dérivé, même licence).

<script id="sobre-theme-js">
/* Apparence (Clair, Sombre, Automatique), commune à toute la gamme : le choix est gardé dans le navigateur
   et vaut pour toutes les apps ouvertes depuis le même endroit. Événement « sobre-theme » à chaque changement. */
(function(){
  var K='sobre.apparence',d=document.documentElement,mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
  function get(){var m='light';try{m=localStorage.getItem(K)||'light'}catch(e){}return m==='dark'||m==='auto'?m:'light'}
  function eff(m){return m==='auto'?(mq&&mq.matches?'dark':'light'):m}
  /* images à deux versions (logos d'accueil) : data-clair / data-sombre */
  function imgs(t){var L=document.querySelectorAll('img[data-sombre]');for(var k=0;k<L.length;k++){var i=L[k],u=t==='dark'?i.getAttribute('data-sombre'):i.getAttribute('data-clair');if(u&&i.getAttribute('src')!==u)i.setAttribute('src',u)}}
  function apply(){var m=get(),t=eff(m);d.setAttribute('data-apparence',m);d.setAttribute('data-theme',t);imgs(t);
    try{window.dispatchEvent(new CustomEvent('sobre-theme',{detail:{mode:m,theme:t}}))}catch(e){}}
  var T=window.SobreTheme={
    get:get,
    theme:function(){return eff(get())},
    dark:function(){return eff(get())==='dark'},
    set:function(m){try{localStorage.setItem(K,m)}catch(e){}apply()},
    color:function(n){return getComputedStyle(d).getPropertyValue('--'+n).trim()},
    labels:[['light','Apparence claire'],['dark','Apparence sombre'],['auto','Apparence automatique']],
    /* éléments de menu prêts à l'emploi : court=true donne « Claire / Sombre / Automatique » (sous un intitulé « Apparence ») */
    items:function(court){var m=get();return [['light','Claire'],['dark','Sombre'],['auto','Automatique']].map(function(x){
      return {l:court?x[1]:'Apparence '+x[1].toLowerCase(),chk:m===x[0],a:function(){T.set(x[0])}}})}
  };
  if(mq){var f=function(){if(get()==='auto')apply()};if(mq.addEventListener)mq.addEventListener('change',f);else if(mq.addListener)mq.addListener(f)}
  window.addEventListener('storage',function(e){if(e.key===K)apply()});
  document.addEventListener('DOMContentLoaded',function(){imgs(eff(get()))});
  apply();
})();
</script>

const V = {z: 1, tx: 0, ty: 0, fit: true, aw: 0, ah: 0};

}

  if (/^Arrow/.test(e.key)) {
    if (!D) return; e.preventDefault();
    const s = e.shiftKey ? 10 : 1, dx = e.key === "ArrowLeft" ? -s : e.key === "ArrowRight" ? s : 0, dy = e.key === "ArrowUp" ? -s : e.key === "ArrowDown" ? s : 0;
    if (ST.tool === "move") nudge(dx, dy); else if (ST.tool === "crop" && CROP) { const b = CROP.box, w = b[2] - b[0], h = b[3] - b[1], x = clamp(b[0] + dx, 0, D.w - w), y = clamp(b[1] + dy, 0, D.h - h); CROP.box = [x, y, x + w, y + h]; drawOverlay(); }
    return;
  }
  if (TOOLKEYS[k]) { setTool(TOOLKEYS[k], SHIFTPRE[k] ? SHIFTPRE[k][e.shiftKey ? 1 : 0] : null); return; }
  if (k === "f") { setViewMode((VIEWMODE + 1) % 3); return; }
  if (k === "x") { swapInk(); return; }
  if (k === "d") { defaultInk(); return; }
  if (e.key === "[" || e.key === "]") {
    const tl = ST.tool === "fill" ? null : ST.tool; if (!tl || !TO[tl] || TO[tl].size === undefined) return;
    const v = toolSize(tl), st = Math.max(1, Math.round(v * 0.15)); TO[tl].size = clamp(v + (e.key === "]" ? st : -st), 1, 500); saveTO(); buildOptbar(); drawOverlay();
  }
});
addEventListener("keyup", e => { if (e.key === " " && ST.space) { ST.space = false; setCursor(); } });
addEventListener("blur", () => { if (ST.space) { ST.space = false; setCursor(); } });

// --------------------------------------------------------- mise en page --
let placed = false;
function layout(reset) {
  const W = innerWidth, Hh = innerHeight;
  if (reset || !placed) { tools.userMoved = layersPal.userMoved = false; placed = true; doc.auto = true; }
  const top = TOP + 12;
  if (tools.shown && !tools.userMoved) { tools.x = 12; tools.y = top; }
  tools.place();
  if (layersPal.shown && !layersPal.userMoved) {
    let y = tools.shown && !tools.userMoved ? tools.y + tools.height + 12 : top, x = 12;
    if (y + layersPal.height > Hh - 10 && tools.shown) { x = tools.x + tools.width + 10; y = top; }
    layersPal.x = x; layersPal.y = y;
  }
  layersPal.place();
  for (const p of [tools, layersPal]) { [p.x, p.y] = clampPos(p.x, p.y, p.w); p.place(); }
  const lefts = [tools, layersPal].filter(p => p.shown && p.x + p.width / 2 < W / 2).map(p => p.x + p.width);
  const left = lefts.length && !VIEWMODE ? Math.max(...lefts) + 14 : 12, right = W - 12, bottom = Hh - 14;
  if (doc.auto) { doc.x = left; doc.y = top; doc.w = Math.max(doc.minW, right - left); doc.h = Math.max(doc.minH, bottom - top); }
  else [doc.x, doc.y] = clampPos(doc.x, doc.y, doc.w);
  doc.place();
  if (doc.shown) relayoutDoc();
  welcome.place();
  welcome.x = Math.max(left, left + Math.round((right - left - welcome.width) / 2));
  welcome.y = Math.max(top, top + Math.round((bottom - top - welcome.height) / 3));
  welcome.place();
}
addEventListener("scroll", () => { if (scrollX || scrollY) scrollTo(0, 0); });
let rzT = null;
addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => layout(), 60); });
if (window.ResizeObserver) { let q = false; const ro = new ResizeObserver(() => { if (!q && placed) { q = true; requestAnimationFrame(() => { q = false; layout(); }); } }); ro.observe(tools.el); ro.observe(layersPal.el); }

// --------------------------------------------------- état de l'interface
function docChanged(geom, refit) {
  if (!D) return;
  for (const k in FLAT) delete FLAT[k];
  ANTS = null;
  if (geom) { if (refit) V.fit = true; if (ST.tool === "crop") { CROP = null; VROT = 0; startCrop(); } relayoutDoc(); }
  refreshLayers(); renderSoon(); refreshUI(); placeTextEditor();
}
function selChanged() { ANTS = null; drawOverlay(); refreshUI(); }
function refreshDocTitle() { if (D) doc.setTitle(`${D.name} (${fr(V.z * dpr() * 100, V.z * dpr() < 0.1 ? 1 : 0)} %)`); }
let infoT = null;
function infoSoon() { if (!infoT) infoT = requestAnimationFrame(() => { infoT = null; refreshInfo(); }); }
function refreshInfo() {
  if (!D) { INFO.textContent = ""; return; }
  let s;
  if (CROP && ST.tool === "crop") { const b = CROP.box; s = `Cadre : ${Math.round(b[2] - b[0])} × ${Math.round(b[3] - b[1])} px` + (CROP.angle ? ` · redressé de ${fr(CROP.angle, 1)}°` : "") + "  ·  Entrée = appliquer, Échap = annuler"; }
  else {
    const L = AL();
    s = `${D.w} × ${D.h} px  ·  ${printSize(D.w, D.h, D.dpi)}  ·  ${L ? (L.me && L.mask ? "Masque de « " + L.name + " »" : L.name) : ""}` + (D.sel ? "  ·  sélection" : "");
  }
  if (HOVER && HOVER[0] >= 0 && HOVER[1] >= 0 && HOVER[0] < D.w && HOVER[1] < D.h) s += `  ·  x ${Math.floor(HOVER[0])}, y ${Math.floor(HOVER[1])}`;
  INFO.textContent = s;
}
function refreshUI() {
  const has = !!D;
  document.title = has ? `${D.name} — ${APP}` : APP;
  for (const [id, , ic] of TOOLDEFS) TOOLBTN[id].firstChild.src = has ? ICON_URL[ic] : iconDis(ic);
  for (const k in BZB) if (BZB[k].tagName === "BUTTON") BZB[k].disabled = !has;
  for (const b of LBTN.querySelectorAll("button")) b.disabled = !has || !!FLOAT;
  if (has) { refreshInfo(); refreshDocTitle(); }
  if (has && ST.tool === "crop" && !CROP && !FLOAT) startCrop();
}

// ---------------------------------------------------------- démarrage ---
tools.show(); layersPal.show();
if (PREFS.hidden && PREFS.hidden.tools) tools.hide();
if (PREFS.hidden && PREFS.hidden.layers) layersPal.hide();
welcome.show();
layout(true);
refreshSwatches(); refreshLayers();
setTool(TOOLNAMES[PREFS.tool] ? PREFS.tool : "brush");
refreshUI();
if (document.fonts && document.fonts.load) Promise.all([document.fonts.load("400 16px VT323"), document.fonts.load("600 16px VT323")]).then(() => { layout(); }).catch(() => {});

/* Page d'accueil : 3 secondes, ou un clic, ou une touche */
$(".sp-ver", SPLASH).textContent = VERSION;
function closeSplash() {
  if (SPLASH.dataset.closing) return;
  SPLASH.dataset.closing = "1";
  document.removeEventListener("keydown", splashKey, true);
  SPLASH.classList.add("out");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(() => { SPLASH.hidden = true; layout(); }, reduce ? 0 : 260);
}
function splashKey(e) { if (["Shift", "Control", "Alt", "Meta"].includes(e.key)) return; e.preventDefault(); e.stopPropagation(); closeSplash(); }
SPLASH.addEventListener("click", closeSplash);
document.addEventListener("keydown", splashKey, true);
$(".sp-fill", SPLASH).addEventListener("animationend", closeSplash);
setTimeout(closeSplash, 3300);

</script>
</body>
