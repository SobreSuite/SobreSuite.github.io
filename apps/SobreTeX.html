}

/* =========================================================
   Menus
   ========================================================= */
function cmdEdit(c){ta.focus();try{document.execCommand(c);}catch(e){}onEdit();}
async function doCopy(cut){
  const a=ta.selectionStart,b=ta.selectionEnd;if(a===b){flash('Sélectionnez d’abord du texte');return;}
  const t=ta.value.slice(a,b);S.lastCopied=t;
  const ok=await copyText(t);
  if(!ok){flash('Copie bloquée : utilisez '+MOD+'C');return;}
  if(cut)replaceRange(a,b,'',a);
  flash(cut?'Coupé':'Copié');
}
const ACT={
  new:newDoc,open:openDoc,save:saveDoc,print:printPreview,rename:renameDoc,preamble:showPreamble,about,
  cut:()=>doCopy(true),copy:()=>doCopy(false),undo:()=>cmdEdit('undo'),redo:()=>cmdEdit('redo'),
  table:()=>insertTemplate('table'),image:()=>insertTemplate('image'),equation:()=>insertTemplate('equation'),pagebreak:()=>insertTemplate('pagebreak'),
  sheet:styleSheet,page:pageSetup,importSheet,exportSheet:()=>exportSheet(),togglePrev,resetLayout,
  zoomEdit:()=>toggleMax('edit'),zoomPrev:()=>toggleMax('prev')
};
function menuDefs(){
  const P=S.prefs;
  return [
    {id:'logo',logo:true,label:'Sobre TeX',items:[{l:'À propos de Sobre TeX…',a:about}]},
    {id:'file',label:'Fichier',items:[
      {l:'Nouveau',a:newDoc},{l:'Ouvrir…',k:MOD+'O',a:openDoc},{l:'Fermer',a:closeDoc},'-',
      {l:IS_ARTIFACT?'Enregistrer…':'Enregistrer (.tex)',k:MOD+'S',a:saveDoc},{l:'Enregistrer sous…',a:saveAsDialog},{l:'Renommer…',a:renameDoc},'-',
      {l:'Voir le préambule…',a:showPreamble},
      ...(IS_ARTIFACT?[]:['-',{l:'Imprimer l’aperçu…',k:MOD+'P',a:printPreview}]),'-',
      {l:'Quitter',a:quitApp}]},
    {id:'edit',label:'Édition',items:[
      {l:'Annuler',k:MOD+'Z',a:()=>cmdEdit('undo')},{l:'Rétablir',k:(IS_MAC?'⇧⌘Z':'Ctrl+Y'),a:()=>cmdEdit('redo')},'-',
      {l:'Couper',k:MOD+'X',a:()=>doCopy(true)},{l:'Copier',k:MOD+'C',a:()=>doCopy(false)},{l:'Coller : utilisez '+MOD+'V',dis:true},
      {l:'Tout sélectionner',k:MOD+'A',a:()=>{ta.focus();ta.select();}},'-',
      {l:'Protéger les caractères spéciaux au collage',chk:P.escPaste,a:()=>{P.escPaste=!P.escPaste;persist();flash(P.escPaste?'Protection au collage activée':'Collage brut : le code LaTeX collé reste tel quel');}},
      {l:'Protéger % & $ # _ à la frappe',chk:P.escType,a:()=>{P.escType=!P.escType;persist();}}]},
    {id:'view',label:'Affichage',items:[
      {l:'Aperçu',chk:P.showPrev,a:togglePrev},{l:'Défilement synchronisé',chk:P.sync!==false,a:()=>{P.sync=P.sync===false;persist();flash(P.sync?'Défilement synchronisé':'Défilement indépendant');if(P.sync)syncFromEditor();}},{l:'Bulles d’aide détaillées',chk:P.bubbles,a:toggleBubbles},'-',
      {l:'Zoom ajusté à la fenêtre',chk:P.zoom==='fit',a:()=>setZoom('fit')},{l:'Zoom 75 %',chk:P.zoom==='0.75',a:()=>setZoom('0.75')},{l:'Zoom 100 %',chk:P.zoom==='1',a:()=>setZoom('1')}]},
    {id:'style',label:'Style',items:[
      {l:'Feuille de style…',a:styleSheet},{l:'Mise en page…',a:pageSetup},'-',
      {l:'Importer une charte…',a:importSheet},{l:'Exporter la charte…',a:()=>exportSheet()},{l:'Rétablir la charte par défaut…',a:resetSheet}]},
    {id:'win',label:'Fenêtre',items:[
      {l:'Réinitialiser la disposition',a:resetLayout},'-',
      {l:S.name+'.tex',a:()=>{activate('edit');ta.focus();}},{l:'Aperçu',a:()=>{if(!S.prefs.showPrev)togglePrev();else activate('prev');}}]},
    {id:'help',label:'Aide',items:[
      {l:'Document d’exemple',a:openSample},{l:'Comparer les formats…',a:compareFormats},{l:'Bulles d’aide détaillées',chk:P.bubbles,a:toggleBubbles},'-',
      {l:'À propos de Sobre TeX…',a:about}]}
  ];
}
let openMenuId=null,menuEl=null;
function buildMenubar(){
  const mb=$('#menubar');mb.innerHTML='';
  for(const m of menuDefs()){
    const b=el('button',{type:'button',class:'mb-btn'+(m.logo?' mb-logo':''),'aria-haspopup':'menu','aria-expanded':'false','data-menu':m.id,'aria-label':m.logo?m.label:null});
    if(m.logo)b.innerHTML=LOGO_SVG;else b.textContent=m.label;
    b.addEventListener('click',()=>{openMenuId===m.id?closeMenus():openMenu(m.id);});
    b.addEventListener('mouseenter',()=>{if(openMenuId&&openMenuId!==m.id)openMenu(m.id);});
    b.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();openMenu(m.id,true);}});
    mb.appendChild(b);
  }
  mb.appendChild(el('div',{class:'mb-spacer'}));
  const h=el('button',{type:'button',class:'mb-btn mb-help','aria-pressed':S.prefs.bubbles?'true':'false','aria-label':'Bulles d’aide','data-help':'help'});
  h.innerHTML='<svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12v8H8l-3 3v-3H2z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6.3 5.6c0-1 .8-1.4 1.7-1.4s1.7.5 1.7 1.3c0 1.2-1.6 1.2-1.6 2.2" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="7.5" y="9" width="1.2" height="1.2" fill="currentColor"/></svg>';
  h.addEventListener('click',toggleBubbles);
  mb.appendChild(h);
}
function openMenu(id,focusFirst){
  closeMenus(true);
  const def=menuDefs().find(m=>m.id===id);if(!def)return;
  const btn=$('[data-menu="'+id+'"]');btn.setAttribute('aria-expanded','true');openMenuId=id;
  menuEl=el('div',{class:'menu',role:'menu','aria-label':def.label});
  for(const it of def.items){
    if(it==='-'){menuEl.appendChild(el('hr'));continue;}
    const b=el('button',{type:'button',role:it.chk!==undefined?'menuitemcheckbox':'menuitem','aria-checked':it.chk!==undefined?String(!!it.chk):null,disabled:!!it.dis});
    if(it.dot){const d=el('span',{style:'width:8px;height:8px;border:1px solid currentColor;display:inline-block;align-self:center;background:'+(it.dot==='none'?'transparent':'var(--'+it.dot+')')});b.appendChild(d);b.style.gap='8px';}
    b.appendChild(el('span',{text:it.l}));
    if(it.k)b.appendChild(el('span',{class:'k',text:it.k}));
    b.addEventListener('click',()=>{closeMenus();if(it.a)it.a();buildMenubar();});
    menuEl.appendChild(b);
  }
  menuEl.addEventListener('keydown',e=>{
    const items=$$('button:not([disabled])',menuEl);const i=items.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){e.preventDefault();(items[i+1]||items[0]).focus();}
    else if(e.key==='ArrowUp'){e.preventDefault();(items[i-1]||items[items.length-1]).focus();}
    else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const ids=menuDefs().map(m=>m.id);const k=ids.indexOf(openMenuId);openMenu(ids[(k+(e.key==='ArrowRight'?1:-1)+ids.length)%ids.length],true);}
    else if(e.key==='Escape'){e.preventDefault();const b=$('[data-menu="'+openMenuId+'"]');closeMenus();b&&b.focus();}
  });
  document.body.appendChild(menuEl);
  const r=btn.getBoundingClientRect();
  menuEl.style.top=(r.bottom)+'px';
  menuEl.style.left=Math.max(8,Math.min(r.left,window.innerWidth-menuEl.offsetWidth-8))+'px';
  if(focusFirst){const f=menuEl.querySelector('button:not([disabled])');f&&f.focus();}
}
function closeMenus(keepId){
  if(menuEl){menuEl.remove();menuEl=null;}
  $$('[data-menu]').forEach(b=>b.setAttribute('aria-expanded','false'));
  if(!keepId)openMenuId=null;
}
document.addEventListener('pointerdown',e=>{if(menuEl&&!e.target.closest('.menu')&&!e.target.closest('[data-menu]'))closeMenus();});
function setZoom(z){S.prefs.zoom=z;applyZoom();persist();}

/* =========================================================
   Bulles d'aide
   ========================================================= */
const HELP={
  new:{t:'Nouveau',d:'Ouvre une page vide. La feuille de style reste la même.'},
  open:{t:'Ouvrir',d:'Charge un fichier .tex. S’il vient de Sobre TeX, sa feuille de style revient avec lui.',k:MOD+'O'},
  save:{t:'Enregistrer',d:'Produit le fichier .tex complet : préambule, document et feuille de style.',k:MOD+'S'},
  print:{t:'Imprimer l’aperçu',d:'Imprime ou enregistre en PDF l’aperçu approché. Pour un PDF exact, compilez le .tex.',k:MOD+'P'},
  cut:{t:'Couper',d:'Retire la sélection et la garde dans le presse-papiers.',k:MOD+'X'},
  copy:{t:'Copier',d:'Copie la sélection. Recollée ici, elle reste du code et n’est pas protégée une seconde fois.',k:MOD+'C'},
  undo:{t:'Annuler',d:'Annule la dernière modification, y compris un style appliqué.',k:MOD+'Z'},
  redo:{t:'Rétablir',d:'Refait ce qui vient d’être annulé.',k:IS_MAC?'⇧⌘Z':'Ctrl+Y'},
  table:{t:'Tableau',c:'\\begin{tabular}{|l|l|} … \\end{tabular}',d:'Insère un tableau à deux colonnes. Le signe & sépare les cases, \\\\ termine une ligne.'},
  image:{t:'Image',c:'\\includegraphics[width=…]{fichier.png}',d:'Insère une image. Le fichier image doit accompagner le .tex à la compilation.'},
  pagebreak:{t:'Saut de page',c:'\\newpage',d:'Force la suite du texte à commencer sur une nouvelle page, dans le PDF comme dans l’aperçu.'},
  sheet:{t:'Feuille de style…',d:'Règle l’apparence de chaque style : police, taille, couleur, espacements. Le préambule LaTeX suit automatiquement.'},
  prev:{t:'Afficher ou masquer l’aperçu',d:'Affiche ou masque la fenêtre d’aperçu. L’aperçu est approché : seul LaTeX donne la mise en page exacte.'},
  preamble:{t:'Préambule',c:'\\documentclass … \\begin{document}',d:'Les réglages LaTeX écrits à partir de la feuille de style. Vous n’avez pas à les toucher.'},
  stylesel:{t:'Style du paragraphe',d:'Indique le style de la ligne où se trouve le curseur. Choisissez-en un autre pour l’appliquer.'},
  'save-ok':{t:'Dernière sauvegarde automatique',d:'Le document est gardé dans ce navigateur après chaque modification. Pour un fichier, enregistrez le .tex.'},
  'save-err':{t:'Échec de la sauvegarde automatique',d:'Le navigateur refuse de garder le document (navigation privée, stockage plein ou bloqué). Enregistrez le .tex sans attendre.',k:MOD+'S'},
  help:{t:'Bulles détaillées',d:'Ajoute aux bulles la commande LaTeX écrite par chaque bouton. Cliquez à nouveau pour revenir aux bulles courtes.'}
};
function helpFor(key){
  if(key&&key.startsWith('st:')){
    const st=styleById(key.slice(3));if(!st)return null;
    const k=SHORTCUTS[st.id]||st.k;
    switch(st.kind){
      case 'title':return {t:st.label,c:'\\'+st.cmd+'{…}',d:'Grand titre centré en tête du document. S’applique à toute la ligne où se trouve le curseur.'};
      case 'body':return {t:'Corps de texte',d:'Retire le style de la ligne ou de la liste : le texte redevient du texte courant.',k};
      case 'heading':return {t:st.label,c:'\\'+st.cmd+'{…}',d:'S’applique à toute la ligne où se trouve le curseur. Un second clic retire le titre.',k};
      case 'para':return {t:st.label+' (style maison)',c:'\\'+st.cmd+'{…}',d:'Entoure les lignes sélectionnées. Son apparence se règle dans la feuille de style.'};
      case 'env':if(st.direct)return {t:st.label,c:'\\begin{'+st.env+'}\n  …\n\\end{'+st.env+'}',d:'S’applique aux lignes sélectionnées. Un second clic retire l’alignement.'};
        return {t:st.label,c:'\\begin{'+st.env+'}\n'+(LISTS.includes(st.env)?'  \\item …\n':'  …\n')+'\\end{'+st.env+'}',d:LISTS.includes(st.env)?'Chaque ligne sélectionnée devient un élément de liste.':'Met les lignes sélectionnées en retrait.'};
      case 'note':return {t:'Note de bas de page',c:'\\footnote{…}',d:'Sélectionnez le texte de la note, ou cliquez à l’endroit du renvoi puis tapez la note entre les accolades.'};
      case 'charc':return {t:st.label+' (style maison)',c:'\\'+st.cmd+'{…}',d:'Entoure la sélection. Un second clic retire le style.'};
      default:return {t:st.label,c:'\\'+st.cmd+'{…}',d:'Entoure la sélection de la commande. Un second clic retire le style.',k};
    }
  }
  if(key&&key.startsWith('al:')){const a=ALIGNS.find(x=>x[0]===key.slice(3));return a?{t:a[1]}:null;}
  return HELP[key]||null;
}
const bubble=$('#bubble');
let bubbleTimer=null,bubbleFor=null;
function showBubble(target){
  if(bubbleFor===target)return;
  clearTimeout(bubbleTimer);bubbleFor=target;
  bubbleTimer=setTimeout(()=>drawBubble(target),bubble.hidden?380:60);
}
function drawBubble(target){
  if(menuEl||document.querySelector('.ov'))return;
  const h=helpFor(target.dataset.help);if(!h)return;
  const full=S.prefs.bubbles;
  bubble.innerHTML='<div class="t">'+escH(h.t)+(h.k?'<span class="k">'+escH(h.k)+'</span>':'')+'</div>'+(full&&h.c?'<code>'+escH(h.c)+'</code>':'')+(full&&h.d?'<div class="d">'+escH(h.d)+'</div>':'');
  bubble.hidden=false;
  const r=target.getBoundingClientRect();
  const bw=bubble.offsetWidth,bh=bubble.offsetHeight;
  let x=Math.min(Math.max(8,r.left),window.innerWidth-bw-8);
  let y=r.bottom+6;if(y+bh>window.innerHeight-8)y=r.top-bh-6;
  bubble.style.left=x+'px';bubble.style.top=Math.max(8,y)+'px';
}
function hideBubble(){clearTimeout(bubbleTimer);bubbleFor=null;bubble.hidden=true;}
document.addEventListener('pointerdown',hideBubble,true);
document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-help]');if(t)showBubble(t);else hideBubble();});
document.addEventListener('focusin',e=>{const t=e.target.closest&&e.target.closest('[data-help]');if(t)showBubble(t);else hideBubble();});
function toggleBubbles(){S.prefs.bubbles=!S.prefs.bubbles;persist();buildMenubar();hideBubble();flash(S.prefs.bubbles?'Bulles détaillées : la commande LaTeX s’affiche au survol':'Bulles courtes : le nom du bouton seulement');}

/* =========================================================
   Saisie, collage, raccourcis
   ========================================================= */
ta.addEventListener('input',onEdit);
ta.addEventListener('beforeinput',e=>{
  if(!S.prefs.escType||e.inputType!=='insertText'||!e.data||e.data.length!==1||'%&$#_'.indexOf(e.data)<0)return;
  const p=ta.selectionStart;if(ta.value[p-1]==='\\'&&!isEsc(ta.value,p-1))return;
  e.preventDefault();const d=e.data;queueMicrotask(()=>insertAtSel('\\'+d));
});
ta.addEventListener('copy',()=>{S.lastCopied=ta.value.slice(ta.selectionStart,ta.selectionEnd);});
ta.addEventListener('cut',()=>{S.lastCopied=ta.value.slice(ta.selectionStart,ta.selectionEnd);});
ta.addEventListener('paste',e=>{
  if(!S.prefs.escPaste)return;
  const raw=e.clipboardData&&e.clipboardData.getData('text/plain');if(raw==null||raw==='')return;
  if(S.lastCopied!=null&&raw===S.lastCopied)return;
  e.preventDefault();
  const r=escapeTeX(normalizePaste(raw));
  insertAtSel(r.text);
  if(r.count)flash('Collage : '+r.count+' caractère'+(r.count>1?'s':'')+' spécia'+(r.count>1?'ux protégés':'l protégé'));
});
['keyup','mouseup','focus'].forEach(t=>ta.addEventListener(t,()=>updateContext()));
document.addEventListener('selectionchange',()=>{if(document.activeElement===ta)updateContext();});
document.addEventListener('keydown',e=>{
  if(document.querySelector('.ov'))return;
  const mod=e.metaKey||e.ctrlKey;
  if(e.key==='Escape'&&menuEl){closeMenus();return;}
  if(!mod)return;
  const k=e.key.toLowerCase();
  if(e.altKey&&/^Digit[0-3]$/.test(e.code)){e.preventDefault();applyStyle(['body','h1','h2','h3'][+e.code.slice(5)]);ta.focus();return;}
  if(e.altKey||e.shiftKey&&k!=='z')return;
  if(k==='b'){e.preventDefault();applyStyle('fb');ta.focus();}
  else if(k==='i'){e.preventDefault();applyStyle('fi');ta.focus();}
  else if(k==='u'){e.preventDefault();applyStyle('fu');ta.focus();}
  else if(k==='s'){e.preventDefault();saveDoc();}
  else if(k==='o'){e.preventDefault();openDoc();}
  else if(k==='p'&&!IS_ARTIFACT){e.preventDefault();printPreview();}
});

/* Boutons à action directe */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const f=ACT[b.dataset.act];if(f)f();
});
$('#w-edit .tb').addEventListener('dblclick',e=>{if(!e.target.closest('button'))renameDoc();});
if(IS_ARTIFACT)$$('[data-local-only]').forEach(x=>x.hidden=true);

/* =========================================================
   Démarrage
   ========================================================= */
restore();
buildMenubar();
persist();
refreshAll();
placeWins();
if(window.ResizeObserver){new ResizeObserver(()=>applyZoom()).observe($('#pv-scroll'));}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{renderHL();applyZoom();});
ta.focus();ta.setSelectionRange(0,0);
updateContext();

$('#quit button').addEventListener('click',()=>{$('#quit').hidden=true;ta.focus();});

/* Alerte à la fermeture si le .tex n'a pas été enregistré */
window.addEventListener('beforeunload',e=>{
  if(S.dirty&&ta.value.trim()){e.preventDefault();e.returnValue='';return '';}
});

/* Page d'accueil : 15 secondes, ou un clic, ou une touche */
const splash=$('#splash');
$('.sp-ver',splash).textContent=VERSION;
function closeSplash(){
  if(splash.dataset.closing)return;
  splash.dataset.closing='1';
  document.removeEventListener('keydown',splashKey,true);
  splash.classList.add('out');
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  setTimeout(()=>{splash.hidden=true;placeWins();applyZoom();ta.focus();offerRecovery();},reduce?0:260);
}
function splashKey(e){if(['Shift','Control','Alt','Meta'].includes(e.key))return;e.preventDefault();e.stopPropagation();closeSplash();}
splash.addEventListener('click',closeSplash);
document.addEventListener('keydown',splashKey,true);
$('.sp-fill',splash).addEventListener('animationend',closeSplash);
})();
</script>
