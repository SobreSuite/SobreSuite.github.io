<script id="sobre-theme-js">
/* Apparence (Clair, Sombre, Automatique), commune à toute la gamme : le choix est gardé dans le navigateur
   et vaut pour toutes les apps ouvertes depuis le même endroit. Événement « sobre-theme » à chaque changement. */
(function(){
  var K='sobre.apparence',d=document.documentElement,mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
  function get(){var m='light';try{m=localStorage.getItem(K)||'light'}catch(e){}return m==='dark'||m==='auto'?m:'light'}
  function eff(m){return m==='auto'?(mq&&mq.matches?'dark':'light'):m}
  /* images à deux versions (logos d'accueil) : data-clair / data-sombre */
  function imgs(t){var L=document.querySelectorAll('img[data-sombre]');for(var k=0;k<L.length;k++){var i=L[k],u=t==='dark'?i.getAttribute('data-sombre'):i.getAttribute('data-clair');if(u&&i.getAttribute('src')!==u)i.setAttribute('src',u)}}
  function apply(){var m=get(),t=eff(m);d.setAttribute('data-apparence',m);d.setAttribute('data-theme',t);imgs(t);
    try{window.dispatchEvent(new CustomEvent('sobre-theme',{detail:{mode:m,theme:t}}))}catch(e){}}
  var T=window.SobreTheme={
    get:get,
    theme:function(){return eff(get())},
    dark:function(){return eff(get())==='dark'},
    set:function(m){try{localStorage.setItem(K,m)}catch(e){}apply()},
    color:function(n){return getComputedStyle(d).getPropertyValue('--'+n).trim()},
    labels:[['light','Apparence claire'],['dark','Apparence sombre'],['auto','Apparence automatique']],
    /* éléments de menu prêts à l'emploi : court=true donne « Claire / Sombre / Automatique » (sous un intitulé « Apparence ») */
    items:function(court){var m=get();return [['light','Claire'],['dark','Sombre'],['auto','Automatique']].map(function(x){
      return {l:court?x[1]:'Apparence '+x[1].toLowerCase(),chk:m===x[0],a:function(){T.set(x[0])}}})}
  };
  if(mq){var f=function(){if(get()==='auto')apply()};if(mq.addEventListener)mq.addEventListener('change',f);else if(mq.addListener)mq.addListener(f)}
  window.addEventListener('storage',function(e){if(e.key===K)apply()});
  document.addEventListener('DOMContentLoaded',function(){imgs(eff(get()))});
  apply();
})();
</script>

<title>Sobre TeX</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Mise en page : bureau tramé façon Mac 1-bit, barre de menus pleine largeur,
   deux fenêtres (code / aperçu) posées en absolu et déplaçables. Thème unique, assumé. */
:root{
  --ink:#000000;
  --paper:#ffffff;
  --dither:#9a9a9a;
  --mute:#4f4f4f;
  --line-n:var(--inactif);
  --sheet-bg:var(--bureau);
  --sage:#CFDFCC;
  --logo:#3A3733;
  --struct:var(--red);
  --env:var(--green);
  --char:var(--blue);
  --note:var(--violet);
  --maison:var(--orange);
  --esc:var(--grey);
  --sel:rgba(255,214,0,.55);
  --yellow:#FFD600;
  --postit:#FFF5AD;
  --err-bg:#FFD3D3;
  --ui:'VT323','Geneva','Chicago',ui-monospace,monospace;
  --code:'IBM Plex Mono',Menlo,Consolas,ui-monospace,monospace;
  --brand:'Silkscreen','VT323',ui-monospace,monospace;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:14px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--char);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#app{height:100%;display:flex;flex-direction:column;overflow:hidden}

/* ---------- Barre de menus ---------- */
#menubar{flex:none;height:24px;background:var(--paper);border-bottom:1px solid var(--ink);display:flex;align-items:stretch;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:50;
  overflow-x:auto;scrollbar-width:none}
#menubar::-webkit-scrollbar{display:none}
.mb-btn{border:0;background:transparent;padding:0 10px;height:23px;cursor:pointer;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.mb-btn[aria-expanded="true"]{background:var(--ink);color:var(--paper)}
.mb-logo svg{width:22px;height:16px;display:block;image-rendering:pixelated}
.mb-logo[aria-expanded="true"] svg{outline:1px solid var(--paper)}
.mb-spacer{flex:1}
.mb-help[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.menu{position:fixed;z-index:60;background:var(--paper);border:1px solid var(--ink);box-shadow:2px 2px 0 var(--ink);min-width:230px;padding:2px 0;font-size:14px}
.menu button{display:flex;width:100%;border:0;background:transparent;text-align:left;padding:3px 14px 3px 22px;gap:24px;cursor:pointer;position:relative;white-space:nowrap}
.menu button:hover:not([disabled]),.menu button:focus-visible{background:var(--ink);color:var(--paper);outline:none}
.menu button[disabled]{color:var(--inactif);cursor:default}
.menu .k{margin-left:auto;opacity:.85}
.menu button[aria-checked="true"]::before{content:'✓';position:absolute;left:7px}
.menu hr{border:0;border-top:1px dotted var(--ink);margin:3px 0}

/* ---------- Barre d'outils ---------- */
#toolwrap{flex:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;background:repeating-conic-gradient(var(--dither) 0 25%,var(--bureau) 0 50%) 0 0/2px 2px}
#toolbar{background:var(--paper);border:1px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:flex;align-items:center;flex-wrap:wrap;gap:4px;padding:5px 8px}
.btn{font-family:var(--ui);font-size:13px;background:var(--paper);border:1px solid var(--ink);border-radius:4px;padding:0 10px;height:28px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--survol)}
.btn:active,.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn:active svg,.btn[aria-pressed="true"] svg{stroke:var(--paper)}
.btn.ico{width:32px;padding:0;justify-content:center;border-radius:3px}
.btn svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:1.4}
.btn.default{outline:3px solid var(--ink);outline-offset:1px;border-radius:6px}
.sep{width:1px;height:24px;background:var(--ink);margin:0 6px;flex:none}
.grow-space{flex:1}

/* ---------- Bureau et fenêtres ---------- */
#desk{flex:1;position:relative;min-height:0;margin:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
#app{background:repeating-conic-gradient(var(--dither) 0 25%,var(--bureau) 0 50%) 0 0/2px 2px}
.win{position:absolute;background:var(--paper);border:1px solid var(--ink);box-shadow:2px 2px 0 var(--ink);display:flex;flex-direction:column;box-sizing:border-box;min-width:0}
.tb{height:21px;flex:none;border-bottom:1px solid var(--ink);display:flex;align-items:center;justify-content:center;position:relative;padding:4px 3px;box-sizing:border-box;cursor:grab;user-select:none;touch-action:none}
.win.active .tb{background:repeating-linear-gradient(var(--ink) 0 1px,var(--paper) 1px 2px);background-clip:content-box;background-origin:content-box}
.tb-title{background:var(--paper);padding:0 10px;font-size:14px;line-height:14px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%}
.win.active .tb-title{font-weight:600}
.wbox{position:absolute;top:3px;width:13px;height:13px;border:1px solid var(--ink);background:var(--paper);padding:0;box-shadow:0 0 0 2px var(--paper);cursor:pointer}
.wbox:active{background:var(--ink)}
.sb{display:flex;align-items:center;height:21px;border-top:1px solid var(--ink);font-size:12px;flex:none;position:relative;overflow:hidden;background:var(--bureau)}
.sb>div{padding:0 10px;border-right:1px solid var(--ink);height:100%;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sb .fill{flex:1}
.sb .warn{color:var(--struct);font-weight:600}
.grow{width:20px;flex:none;padding:0!important;border-right:0!important;border-left:1px solid var(--ink);cursor:nwse-resize;touch-action:none;
  background:linear-gradient(var(--ink),var(--ink)) 5px 5px/9px 1px no-repeat,linear-gradient(var(--ink),var(--ink)) 5px 5px/1px 9px no-repeat,linear-gradient(var(--ink),var(--ink)) 8px 8px/7px 1px no-repeat,linear-gradient(var(--ink),var(--ink)) 8px 8px/1px 7px no-repeat}

/* Barre de défilement rétro */
.rs{width:15px;border-left:1px solid var(--ink);display:flex;flex-direction:column;flex:none;background:var(--paper)}
.rs-arr{height:15px;flex:none;border:0;border-bottom:1px solid var(--ink);background:var(--paper);padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:8px;line-height:1}
.rs-arr.dn{border-bottom:0;border-top:1px solid var(--ink)}
.rs-arr:active{background:var(--ink);color:var(--paper)}
.rs-track{flex:1;position:relative;background:repeating-conic-gradient(var(--ink) 0 25%,var(--paper) 0 50%) 0 0/2px 2px;cursor:pointer}
.rs.off .rs-track{background:var(--paper)}
.rs-thumb{position:absolute;left:0;right:0;top:0;height:20px;background:var(--paper);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);box-sizing:border-box;cursor:grab;touch-action:none}

/* ---------- Fenêtre éditeur ---------- */

function normalizeSheet(o){
  if(!o||typeof o!=='object'||!Array.isArray(o.styles)) throw new Error('format');
  const d=defaultSheet();
  const p=Object.assign({},d.page,o.page||{});
  const page={
    paper:PAPERS[p.paper]?p.paper:'a4',
    margin:clamp(num(p.margin,2.5),1,5),
    size:[10,11,12].includes(+p.size)?+p.size:11,
    font:DOC_FONT_IDS.has(p.font)?p.font:'serif',
    lang:p.lang==='english'?'english':'french',
    numbered:p.numbered!==false
  };
  const seen=new Set();
  const styles=[];
  for(const s of o.styles){
    if(!s||typeof s!=='object'||!KIND[s.kind]) continue;
    let id=String(s.id||'');
    if(!/^[a-zA-Z0-9_-]{1,40}$/.test(id)||seen.has(id)) id='u'+Math.random().toString(36).slice(2,8);
    seen.add(id);
    const st={id,label:String(s.label||id).slice(0,40),kind:s.kind,
      font:(s.font==='inherit'||FONT_TEX[s.font])?s.font:'inherit',
      size:SIZE[s.size]?s.size:(s.kind==='heading'?'large':'normal'),
      bold:!!s.bold,italic:!!s.italic,color:COLOR[s.color]?s.color:'noir',
      before:clamp(num(s.before,6),0,72),after:clamp(num(s.after,6),0,72),
      align:ALIGN_IDS.includes(s.align)?s.align:defaultAlign(s.kind),
      frame:!!s.frame,indent:!!s.indent,custom:!!s.custom,nobutton:!!s.nobutton};
    if(['title','heading','para','char','note','charc'].includes(s.kind)){
      if(typeof s.cmd!=='string'||!/^[a-zA-Z]{1,40}$/.test(s.cmd)) continue;
      st.cmd=s.cmd;
    }
    if(s.kind==='env'){
      if(typeof s.env!=='string'||!/^[a-zA-Z*]{1,30}$/.test(s.env)) continue;
      st.env=s.env;
    }
    styles.push(st);
  }
  if(!styles.some(s=>s.kind==='body')) styles.splice(0,0,d.styles.find(s=>s.kind==='body'));
  return {name:String(o.name||'Charte importée').slice(0,60),page,styles};
}

function styleByCmd(name,sh=S.sheet){return name?sh.styles.find(s=>s.cmd===name):null;}

/* =========================================================
   Petits outils de lecture du code LaTeX
   ========================================================= */
function isEsc(s,i){let k=i-1,n=0;while(k>=0&&s[k]==='\\'){n++;k--;}return n%2===1;}
function matchBrace(s,open){
  let d=0;
  for(let i=open;i<s.length;i++){
    const c=s[i];
    if(c==='%'&&!isEsc(s,i)){const nl=s.indexOf('\n',i);if(nl<0)return -1;i=nl;continue;}
    if(c==='{'&&!isEsc(s,i))d++;
    else if(c==='}'&&!isEsc(s,i)){d--;if(d===0)return i;}
  }
  return -1;
}
function balanced(s){
  let d=0;
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(c==='\\'){i++;continue;}
    if(c==='{')d++;
    else if(c==='}'){d--;if(d<0)return false;}
  }
  return d===0;
}
function lineStart(v,p){return v.lastIndexOf('\n',p-1)+1;}
function lineEnd(v,p){const e=v.indexOf('\n',p);return e<0?v.length:e;}
function isPartialCmd(v,p){
  if(p<=0||p>=v.length) return false;
  if(v[p-1]==='\\'&&!isEsc(v,p-1)) return true;
  if(!/[a-zA-Z]/.test(v[p])) return false;
  let k=p-1;while(k>=0&&/[a-zA-Z]/.test(v[k]))k--;
  return k>=0&&k<p-1&&v[k]==='\\'&&!isEsc(v,k);
}
function groupsAt(v,pos){
  const st=[];
  for(let i=0;i<pos;i++){
    const c=v[i];
    if(c==='%'&&!isEsc(v,i)){const nl=v.indexOf('\n',i);if(nl<0||nl>=pos)break;i=nl;continue;}
    if(c==='\\'){
      if(/[a-zA-Z]/.test(v[i+1]||'')){
        let j=i+1;while(j<v.length&&/[a-zA-Z]/.test(v[j]))j++;
        let k=j;if(v[k]==='*')k++;
        if(v[k]==='{'&&k<pos){st.push({name:v.slice(i+1,j),start:i,open:k});i=k;continue;}
        i=j-1;continue;
      }
      i++;continue;
    }
    if(c==='{'){st.push({name:null,start:i,open:i});continue;}
    if(c==='}'){st.pop();continue;}
  }
  return st.map(g=>Object.assign(g,{close:matchBrace(v,g.open)}));
}
function findEnvEnd(src,beginIdx,env){
  const tok='\\begin{'+env+'}';
  const re=/\\(begin|end)\{([a-zA-Z*]+)\}/g;
  re.lastIndex=beginIdx+tok.length;
  let d=1,m;
  while((m=re.exec(src))){
    if(isEsc(src,m.index)||m[2]!==env) continue;
    if(m[1]==='begin') d++;
    else{d--;if(d===0) return {cs:beginIdx+tok.length,ce:m.index,end:m.index+m[0].length};}
  }
  return null;
}
function envsAt(v,pos){
  const re=/\\(begin|end)\{([a-zA-Z*]+)\}/g;
  const st=[];let m;
  while((m=re.exec(v))&&m.index<pos){
    if(isEsc(v,m.index)) continue;
    if(m[1]==='begin') st.push({name:m[2],start:m.index,inner:m.index+m[0].length});
    else{for(let k=st.length-1;k>=0;k--){if(st[k].name===m[2]){st.splice(k);break;}}}
  }
  return st.map(en=>{const r=findEnvEnd(v,en.start,en.name);return Object.assign(en,{endStart:r?r.ce:-1,end:r?r.end:-1});});
}
const ESC={'\\':'\\textbackslash{}','&':'\\&','%':'\\%','$':'\\$','#':'\\#','_':'\\_','{':'\\{','}':'\\}','~':'\\textasciitilde{}','^':'\\textasciicircum{}'};
function escapeTeX(t){let n=0;const out=t.replace(/[\\&%$#_{}~^]/g,c=>{n++;return ESC[c];});return {text:out,count:n};}
function normalizePaste(t){
  return t.replace(/\r\n?/g,'\n').replace(/\t/g,'  ').replace(/[ \u00a0]+$/gm,'').replace(/\n{3,}/g,'\n\n');
}

function famOf(name){
  const st=styleByCmd(name);
  if(st) return KIND[st.kind].fam==='none'?'misc':KIND[st.kind].fam;
  return BASE_FAM[name]||'misc';
}
let unclosed=0;
function highlight(src){
  const cache=new Map();
  const fam=n=>{if(!cache.has(n))cache.set(n,famOf(n));return cache.get(n);};
  const sp=(c,t)=>'<span class="t-'+c+'">'+escH(t)+'</span>';
  const lines=[];let cur='';const stack=[];let i=0;const n=src.length;
  while(i<n){
    const c=src[i];
    if(c==='\n'){lines.push(cur);cur='';i++;continue;}
    if(c==='\\'){
      const nx=src[i+1];
      if(nx!==undefined&&/[a-zA-Z]/.test(nx)){
        let j=i+1;while(j<n&&/[a-zA-Z]/.test(src[j]))j++;
        const name=src.slice(i+1,j);
        if(ESC_NAMES.has(name)){const k=src.startsWith('{}',j)?j+2:j;cur+=sp('esc',src.slice(i,k));i=k;continue;}
        if((name==='begin'||name==='end')&&src[j]==='{'){
          const cl=src.indexOf('}',j);
          if(cl>j&&cl-j<40&&src.slice(j,cl).indexOf('\n')<0){cur+=sp('env',src.slice(i,cl+1));i=cl+1;continue;}
        }
        let k=j;if(src[k]==='*')k++;
        const f=fam(name);
        if(src[k]==='{'){cur+=sp(f,src.slice(i,k+1));stack.push(f);i=k+1;continue;}
        cur+=sp(f,src.slice(i,k));i=k;continue;
      }
      if(nx==='\\'){cur+=sp('misc','\\\\');i+=2;continue;}
      if(nx!==undefined&&nx!=='\n'){cur+=sp('esc',c+nx);i+=2;continue;}
      cur+=escH(c);i++;continue;
    }
    if(c==='%'){let j=src.indexOf('\n',i);if(j<0)j=n;cur+=sp('cmt',src.slice(i,j));i=j;continue;}
    if(c==='{'){stack.push(null);cur+='{';i++;continue;}
    if(c==='}'){if(!stack.length)cur+=sp('err','}');else{const f=stack.pop();cur+=f?sp(f,'}'):'}';}i++;continue;}
    if(c==='~'){cur+=sp('esc','~');i++;continue;}
    if(c==='$'){cur+=sp('math','$');i++;continue;}
    if(c==='&'){cur+=sp('amp','&');i++;continue;}
    if(c==='#'||c==='_'||c==='^'){cur+=sp('warn',c);i++;continue;}
    let j=i+1;
    while(j<n&&'\n\\%{}~$&#_^'.indexOf(src[j])<0)j++;
    cur+=escH(src.slice(i,j));i=j;
  }

    case 'heading':{const tag=['h2','h3','h4'][n.level];return '<'+tag+' class="s-'+n.st.id+'"'+L+'>'+(n.num?'<span class="num">'+n.num+'</span>':'')+hInl(n.c,w)+'</'+tag+'>';}
    case 'custom':return '<div class="s-'+n.st.id+'"'+L+'>'+hBlocks(n.blocks,w)+'</div>';
    case 'list':{const tag=n.ordered?'ol':'ul';return '<'+tag+(n.st?' class="s-'+n.st.id+'"':'')+L+'>'+n.items.map(it=>'<li'+(it.label!=null?' class="lbl" data-l="'+escH(it.label)+'"':'')+'>'+unP(hBlocks(it.blocks,w))+'</li>').join('')+'</'+tag+'>';}
    case 'quote':return '<blockquote'+(n.st?' class="s-'+n.st.id+'"':'')+L+'>'+hBlocks(n.blocks,w)+'</blockquote>';
    case 'align':return '<div class="pv-'+n.align+'"'+L+'>'+hBlocks(n.blocks,w)+'</div>';
    case 'group':return '<div'+L+'>'+hBlocks(n.blocks,w)+'</div>';
    case 'table':return '<table class="pv-tab'+(n.ruled?' ruled':'')+'"'+L+'>'+n.rows.map(r=>'<tr class="'+(r.top?'rl ':'')+(r.bottom?'rb':'')+'">'+r.cells.map(c=>'<td>'+hInl(c,w)+'</td>').join('')+'</tr>').join('')+'</table>';
    case 'math':return mathBox(n.v,true).replace('<span','<span'+L);
    case 'break':return '<div class="pv-break"'+L+'>Saut de page</div>';
    case 'unknown':return n.cmd?'<div class="pv-unk"'+L+'>'+escH(n.cmd)+' · non affiché dans l’aperçu</div>':'<div class="pv-unk"'+L+'><span class="pv-tag">\\begin{'+escH(n.env)+'}</span>'+hBlocks(n.blocks,w)+'</div>';
    case 'error':return errBox(n.msg);
  }
  return '';
}
function hInl(nodes,w){
  let o='';
  for(const n of nodes||[]){
    switch(n.t){
      case 'text':o+=escH(n.v);break;
      case 'b':o+='<strong>'+hInl(n.c,w)+'</strong>';break;
      case 'i':o+='<em>'+hInl(n.c,w)+'</em>';break;
      case 'u':o+='<u>'+hInl(n.c,w)+'</u>';break;
      case 's':o+='<s>'+hInl(n.c,w)+'</s>';break;
      case 'tt':o+='<code class="tt">'+hInl(n.c,w)+'</code>';break;
      case 'sc':o+='<span class="sc">'+hInl(n.c,w)+'</span>';break;
      case 'span':o+='<span class="s-'+n.st.id+(n.para?' pv-inl':'')+'">'+hInl(n.c,w)+'</span>';break;
      case 'fn':{w.fn.push(hInl(n.c,w));const k=(w.fnBase||0)+w.fn.length;
        o+=w.epub?'<sup><a epub:type="noteref" href="#fn'+k+'" id="fnref'+k+'">'+k+'</a></sup>':'<sup class="fnref">'+k+'</sup>';break;}
      case 'math':o+=mathBox(n.v,n.disp);break;
      case 'br':o+=w.xhtml?'<br/>':'<br>';break;
      case 'img':o+='<span class="pv-img">Image : '+escH(n.file)+'</span>';break;
      case 'link':o+=w.epub?'<a href="'+escH(n.url)+'">'+hInl(n.c,w)+'</a>':'<span class="pv-url">'+hInl(n.c,w)+'</span>';break;
      case 'color':o+='<span style="color:'+(n.color||'inherit')+'">'+hInl(n.c,w)+'</span>';break;
      case 'logo':o+=n.v==='LaTeX'?LATEX_HTML:TEX_HTML;break;
      case 'unk':o+='<span class="pv-unk-i" title="Commande inconnue de l’aperçu : LaTeX la traitera à la compilation">\\'+escH(n.name)+'</span>'+hInl(n.c,w);break;
      case 'err':o+='<span class="pv-err" title="'+escH(n.title)+'">'+escH(n.v)+'</span>';break;
    }
  }
  return o;
}

function previewCSS(sh,scope,FSo){
  const p=sh.page,P=PAPERS[p.paper]||PAPERS.a4,base=p.size;
  const FS=FSo||fontStacks(p);
  const fam=f=>f==='serif'?FS.rm:f==='sans'?FS.sf:f==='mono'?FS.tt:'inherit';
  const col=c=>(COLOR[c]||COLOR.noir)[2];
  const body=sh.styles.find(s=>s.kind==='body')||{};
  let css=scope+' .pv-page{width:'+P[1]+'mm;min-height:'+P[2]+'mm;padding:'+p.margin+'cm;font-family:'+FS.doc+';font-size:'+base+'pt;color:'+col(body.color)+';background-size:100% '+P[2]+'mm;text-align:'+(body.align||'justify')+'}\n';
  css+=scope+' .pv-page p{margin:0 0 '+num(body.after,6)+'pt;text-indent:'+(body.indent?'1.5em':'0')+'}\n';
  for(const st of sh.styles){
    const sz=SIZE[st.size]?SIZE[st.size][3]:1;
    let d='font-family:'+fam(st.font)+';';
    if(st.kind!=='charc') d+='font-size:'+(base*sz).toFixed(2)+'pt;';
    if(st.color&&st.color!=='noir') d+='color:'+col(st.color)+';';
    if(st.kind==='heading'||st.kind==='title') css+=scope+' .s-'+st.id+'{'+d+'font-weight:'+(st.bold?700:400)+';font-style:'+(st.italic?'italic':'normal')+';margin:'+num(st.before,0)+'pt 0 '+num(st.after,0)+'pt;line-height:1.2;text-align:'+(st.align||defaultAlign(st.kind))+'}\n';
    else if(st.kind==='para') css+=scope+' .s-'+st.id+'{'+d+'text-align:'+(st.align||'justify')+';'+(st.bold?'font-weight:700;':'')+(st.italic?'font-style:italic;':'')+'margin:'+num(st.before,0)+'pt 0 '+num(st.after,0)+'pt;'+(st.frame?'border:.6pt solid currentColor;padding:4pt 6pt;':'')+'}\n'+scope+' .s-'+st.id+'>p:last-child{margin-bottom:0}\n';
    else if(st.kind==='env'||st.kind==='charc') css+=scope+' .s-'+st.id+'{'+d+(st.kind==='env'?'text-align:'+(st.align||'justify')+';':'')+(st.bold?'font-weight:700;':'')+(st.italic?'font-style:italic;':'')+'}\n';
  }
  return css;
}

function replaceRange(a,b,text,selA,selB){
  ta.focus();
  ta.setSelectionRange(a,b);
  let ok=false;
  try{ok=text===''?document.execCommand('delete',false):document.execCommand('insertText',false,text);}catch(e){ok=false;}
  if(!ok||ta.value.slice(a,a+text.length)!==text){ta.setRangeText(text,a,b,'end');}
  if(selA!=null) ta.setSelectionRange(selA,selB==null?selA:selB);
  revealPending=true;
  onEdit();
}

function revealCaret(){

/* ---------- Application des styles ---------- */
function applyStyle(id){
  const st=styleById(id);if(!st)return;
  if(st.kind==='char'||st.kind==='note'||st.kind==='charc') applyChar(st);
  else if(BLOCK_KINDS.includes(st.kind)) applyPara(st);
  else if(st.kind==='env') applyEnv(st);
  else if(st.kind==='body') applyBody();
  updateContext();
}
function applyChar(st){
  const v=ta.value;let a=ta.selectionStart,b=ta.selectionEnd;
  const open='\\'+st.cmd+'{';
  const gs=groupsAt(v,a).filter(g=>g.name===st.cmd&&g.close>=b);
  if(gs.length){
    const g=gs[gs.length-1],is=g.open+1,inner=v.slice(is,g.close);
    replaceRange(g.start,g.close+1,inner,g.start+Math.max(0,a-is),g.start+Math.max(0,b-is));
    flash('Style « '+st.label+' » retiré');return;
  }
  if(a<b){
    const sel=v.slice(a,b),lead=sel.length-sel.replace(/^\s+/,'').length,t=sel.trim();
    if(t.startsWith(open)&&matchBrace(t,open.length-1)===t.length-1){
      const inner=t.slice(open.length,-1),s0=a+lead;
      replaceRange(s0,s0+t.length,inner,s0,s0+inner.length);flash('Style « '+st.label+' » retiré');return;
    }
  }
  if(a===b){
    if(isPartialCmd(v,a)) return problem('Le curseur est au milieu d’une commande.','Placez-le avant ou après la commande, puis cliquez à nouveau.');
    replaceRange(a,a,open+'}',a+open.length);
    return;
  }
  while(a<b&&/\s/.test(v[a]))a++;
  while(b>a&&/\s/.test(v[b-1]))b--;
  const sel=v.slice(a,b);
  if(/\n[ \t]*\n/.test(sel)) return problem('Un style de caractère reste dans un seul paragraphe.','Sélectionnez un passage à l’intérieur d’un paragraphe, puis cliquez à nouveau.');
  if(isPartialCmd(v,a)||isPartialCmd(v,b)||!balanced(sel)) return problem('La sélection coupe une balise existante.','Sélectionnez la balise entière, accolade fermante comprise, ou seulement le texte qu’elle contient.');
  replaceRange(a,b,open+sel+'}',a+open.length,a+open.length+sel.length);
}
function selLines(){
  const v=ta.value;const a=ta.selectionStart;let b=ta.selectionEnd;
  if(b>a&&v[b-1]==='\n')b--;
  return [lineStart(v,a),lineEnd(v,b)];
}
function unwrapBlock(block){
  const t=block.trim();
  const m=/^\\([a-zA-Z]+)\*?\{/.exec(t);
  if(m){
    const st=styleByCmd(m[1]);
    if(st&&BLOCK_KINDS.includes(st.kind)){
      const open=m[0].length-1,cl=matchBrace(t,open);
      if(cl===t.length-1) return {inner:t.slice(open+1,cl),style:st};
    }
  }
  return {inner:block,style:null};
}
function applyPara(st){
  const v=ta.value;const [s,e]=selLines();const block=v.slice(s,e);
  const filled=block.split('\n').filter(l=>l.trim());
  if(!filled.length){const ins='\\'+st.cmd+'{}';replaceRange(s,e,ins,s+ins.length-1);return;}
  if(st.kind!=='para'&&filled.length>1) return problem('Un titre tient sur une seule ligne.','Placez le curseur sur la ligne du titre, ou sélectionnez une seule ligne, puis cliquez à nouveau.');
  const un=unwrapBlock(block);
  if(un.style&&un.style.id===st.id){replaceRange(s,e,un.inner,s,s+un.inner.length);flash('Style « '+st.label+' » retiré');return;}
  let inner=un.inner.replace(/^\s*\\item(\[[^\]]*\])?\s*/,'');
  if(st.kind!=='para') inner=inner.trim();
  const out='\\'+st.cmd+'{'+inner+'}';
  replaceRange(s,e,out,s+st.cmd.length+2,s+out.length-1);
}
const LISTS=['itemize','enumerate'];
function applyEnv(st){
  const v=ta.value,a=ta.selectionStart,b=ta.selectionEnd;
  const envs=envsAt(v,a).filter(en=>en.end>0&&en.endStart>=b);
  const cur=envs[envs.length-1];
  if(cur&&(cur.name===st.env||(LISTS.includes(cur.name)&&LISTS.includes(st.env))||(ALIGN_ENVS.includes(cur.name)&&ALIGN_ENVS.includes(st.env)))){
    const s=lineStart(v,cur.start),e=lineEnd(v,cur.end-1);
    if(cur.name===st.env){
      const lines=v.slice(cur.inner,cur.endStart).split('\n').map(l=>l.replace(/^\s*\\item(\[[^\]]*\])?\s?/,''));
      const out=lines.join('\n').replace(/^\s*\n|\n\s*$/g,'');
      replaceRange(s,e,out,s,s+out.length);flash('Style « '+st.label+' » retiré');return;
    }
    let chunk=v.slice(s,e);
    chunk=chunk.replace('\\begin{'+cur.name+'}','\\begin{'+st.env+'}');
    const k=chunk.lastIndexOf('\\end{'+cur.name+'}');
    if(k>=0) chunk=chunk.slice(0,k)+'\\end{'+st.env+'}'+chunk.slice(k+('\\end{'+cur.name+'}').length);
    replaceRange(s,e,chunk,s,s+chunk.length);flash((LISTS.includes(st.env)?'Liste convertie : ':'Alignement : ')+st.label);return;
  }
  const [s,e]=selLines();const lines=v.slice(s,e).split('\n');
  let body;
  if(LISTS.includes(st.env)){
    const items=lines.filter(l=>l.trim()).map(l=>'  \\item '+l.trim().replace(/^(\\item(\[[^\]]*\])?|[-–—•*·▪]|\d+[.)])\s*/,''));
    body=items.length?items.join('\n'):'  \\item ';
  }else body=lines.join('\n').trim();
  const head='\\begin{'+st.env+'}\n',tail='\n\\end{'+st.env+'}';
  const out=head+body+tail;
  replaceRange(s,e,out,s+head.length,s+out.length-tail.length);
}
function applyBody(){
  const v=ta.value;const [s,e]=selLines();const un=unwrapBlock(v.slice(s,e));
  if(un.style){replaceRange(s,e,un.inner,s,s+un.inner.length);flash('Retour au corps de texte');return;}
  const a=ta.selectionStart,b=ta.selectionEnd;
  const envs=envsAt(v,a).filter(en=>en.end>0&&en.endStart>=b);
  for(let k=envs.length-1;k>=0;k--){const es=styleByEnv(envs[k].name);if(es){applyEnv(es);return;}}
  flash('Ce passage est déjà en corps de texte');
}
function insertBlock(text,selOff,selLen){
  const v=ta.value,a=ta.selectionStart,b=ta.selectionEnd;
  const pre=a>0&&v[a-1]!=='\n'?'\n':'',post=b<v.length&&v[b]!=='\n'?'\n':'';
  const st=a+pre.length+(selOff||0);
  replaceRange(a,b,pre+text+post,st,st+(selLen||0));
}

function updateContext(){
  const v=ta.value,p=ta.selectionStart;
  const before=v.slice(0,p);const line=before.split('\n').length;const col=p-lineStart(v,p)+1;
  $('#sb-pos').textContent='Ligne '+line+', col. '+col;

  const groups=groupsAt(v,p).filter(g=>g.close<0||g.close>=p);
  const envs=envsAt(v,p).filter(en=>en.end<0||en.endStart>=p);
  // style de paragraphe courant
  const ls=lineStart(v,p),le=lineEnd(v,p),ln=v.slice(ls,le);
  let paraId='body';
  const m=/^\s*\\([a-zA-Z]+)\*?\{/.exec(ln);const sc=m&&styleByCmd(m[1]);
  if(sc&&BLOCK_KINDS.includes(sc.kind)) paraId=sc.id;
  else{
    for(const g of groups){const s2=styleByCmd(g.name);if(s2&&BLOCK_KINDS.includes(s2.kind))paraId=s2.id;}
    if(paraId==='body'&&envs.length){const es=styleByEnv(envs[envs.length-1].name);if(es)paraId=es.id;}
  }
  const sel=$('#st-select');if(sel&&document.activeElement!==sel) sel.value=styleById(paraId)?paraId:'body';
  const active=new Set(groups.map(g=>g.name).filter(Boolean));
  for(const b of $$('#band [data-style]')){
    const st=styleById(b.dataset.style);if(!st)continue;
    let on=false;
    if(st.cmd&&active.has(st.cmd)) on=true;

    if((BLOCK_KINDS.includes(st.kind)||st.kind==='body')&&paraId===st.id) on=true;
    b.setAttribute('aria-pressed',on?'true':'false');
  }
  const ctxEl=$('#sb-ctx');
  if(ctxEl.dataset.flash) return;
  const g=groups.filter(x=>x.name&&x.name!=='begin'&&x.name!=='end').pop();
  let txt='Balise sous le curseur : aucune · texte courant';
  if(g){const st=styleByCmd(g.name);txt='Balise : \\'+g.name+'{…}'+(st?' · '+st.label:'');}
  else if(envs.length){const en=envs[envs.length-1];const st=styleByEnv(en.name);txt='Balise : \\begin{'+en.name+'}'+(st?' · '+st.label:'');}
  ctxEl.textContent=txt;
}

/* =========================================================
   Barre de défilement rétro
   ========================================================= */
function retroScroll(target,bar){
  const track=$('.rs-track',bar),thumb=$('.rs-thumb',bar);
  function update(){
    const h=target.scrollHeight,ch=target.clientHeight,tr=track.clientHeight;
    if(h<=ch+1||tr<10){bar.classList.add('off');thumb.hidden=true;return;}
    bar.classList.remove('off');thumb.hidden=false;
    const th=Math.max(18,tr*ch/h);
    thumb.style.height=th+'px';
    thumb.style.top=((tr-th)*target.scrollTop/(h-ch))+'px';
  }
  let rep=null;
  const stop=()=>{clearInterval(rep);rep=null;};
  const hold=d=>{target.scrollTop+=d;rep=setInterval(()=>{target.scrollTop+=d;},60);};
  $('.rs-arr.up',bar).addEventListener('pointerdown',e=>{e.preventDefault();hold(-42);});
  $('.rs-arr.dn',bar).addEventListener('pointerdown',e=>{e.preventDefault();hold(42);});
  ['pointerup','pointerleave','pointercancel'].forEach(t=>{$('.rs-arr.up',bar).addEventListener(t,stop);$('.rs-arr.dn',bar).addEventListener(t,stop);});
  track.addEventListener('pointerdown',e=>{
    if(e.target===thumb)return;
    const r=thumb.getBoundingClientRect();
    target.scrollTop+=(e.clientY<r.top?-1:1)*target.clientHeight*.9;
  });
  thumb.addEventListener('pointerdown',e=>{
    e.preventDefault();thumb.setPointerCapture(e.pointerId);
    const y0=e.clientY,s0=target.scrollTop;
    const mv=ev=>{const h=target.scrollHeight,ch=target.clientHeight,tr=track.clientHeight,th=thumb.offsetHeight;target.scrollTop=s0+(ev.clientY-y0)*(h-ch)/Math.max(1,tr-th);};
    const up=()=>{thumb.removeEventListener('pointermove',mv);thumb.removeEventListener('pointerup',up);};
    thumb.addEventListener('pointermove',mv);thumb.addEventListener('pointerup',up);
  });
  target.addEventListener('scroll',update);
  if(window.ResizeObserver) new ResizeObserver(update).observe(target);
  return {update};
}

  let lo=0,hi=L.length-1;
  while(lo<hi){const mid=(lo+hi+1)>>1;if(L[mid].offsetTop<=y)lo=mid;else hi=mid-1;}
  const e=L[lo];return lo+1+Math.min(1,Math.max(0,(y-e.offsetTop)/Math.max(1,e.offsetHeight)));
}
function edYOfLine(pos){
  const L=hl.children;if(!L.length)return 0;
  const k=Math.min(L.length-1,Math.max(0,Math.floor(pos)-1)),e=L[k];
  return e.offsetTop+(pos-Math.floor(pos))*e.offsetHeight-10;
}
function syncFromEditor(){
  if(!S.prefs.sync||!S.prefs.showPrev||syncLead==='pv')return;
  const A=pvAnchors();if(!A.length)return;
  const pos=edLineAtTop(),box=$('#pv-scroll');
  let y;
  if(ta.scrollTop<=1)y=0;
  else if(ta.scrollTop>=ta.scrollHeight-ta.clientHeight-1)y=box.scrollHeight;
  else{
    let k=0;while(k+1<A.length&&A[k+1].l<=pos)k++;
    const a=A[k],b=A[k+1];
    if(pos<a.l)y=a.y*(pos/a.l);
    else if(b&&b.l>a.l)y=a.y+(b.y-a.y)*((pos-a.l)/(b.l-a.l));
    else y=a.y;
    y-=24;
  }
  claimSync('ed');box.scrollTop=Math.max(0,y);
}
function syncFromPreview(){
  if(!S.prefs.sync||syncLead==='ed')return;
  const A=pvAnchors();if(!A.length)return;
  const box=$('#pv-scroll'),y=box.scrollTop+24;
  let t;
  if(box.scrollTop<=1)t=0;
  else if(box.scrollTop>=box.scrollHeight-box.clientHeight-1)t=ta.scrollHeight;
  else{
    let k=0;while(k+1<A.length&&A[k+1].y<=y)k++;
    const a=A[k],b=A[k+1];
    let pos;
    if(y<a.y)pos=1+(a.l-1)*(y/Math.max(1,a.y));
    else if(b&&b.y>a.y)pos=a.l+(b.l-a.l)*((y-a.y)/(b.y-a.y));
    else pos=a.l;
    t=edYOfLine(pos);
  }
  claimSync('pv');ta.scrollTop=Math.max(0,t);
}

const desk=$('#desk'),wEdit=$('#w-edit'),wPrev=$('#w-prev');
const WINS={edit:wEdit,prev:wPrev};
let zTop=2,lastLayout=null;
function narrow(){return window.matchMedia('(max-width:860px)').matches;}
function defaultLayout(){
  const W=desk.clientWidth,H=desk.clientHeight,g=14;
  const ew=Math.round((W-g)*.58);
  return {edit:{x:0,y:0,w:ew,h:H},prev:{x:ew+g,y:0,w:W-ew-g,h:H}};
}
function placeWins(){
  if(narrow()){for(const k in WINS){const w=WINS[k];w.style.left=w.style.top=w.style.width=w.style.height='';}return;}
  const W=desk.clientWidth,H=desk.clientHeight;

    const r=L[k],w=WINS[k];
    const ww=clamp(r.w,320,W),hh=clamp(r.h,220,H);
    w.style.width=ww+'px';w.style.height=hh+'px';
    w.style.left=clamp(r.x,0,Math.max(0,W-ww))+'px';w.style.top=clamp(r.y,0,Math.max(0,H-hh))+'px';
  }

function captureLayout(){
  const o={};for(const k in WINS){const w=WINS[k];o[k]={x:w.offsetLeft,y:w.offsetTop,w:w.offsetWidth,h:w.offsetHeight};}
  S.layout=o;persist();

function activate(k){

}
$$('[data-drag]').forEach(tb=>{

    e.preventDefault();tb.setPointerCapture(e.pointerId);tb.style.cursor='grabbing';

    };
    const up=()=>{tb.removeEventListener('pointermove',mv);tb.removeEventListener('pointerup',up);tb.style.cursor='';captureLayout();};
    tb.addEventListener('pointermove',mv);tb.addEventListener('pointerup',up);
  });
});

function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?'':v);}
  for(const k of kids){if(k==null)continue;e.appendChild(typeof k==='string'?document.createTextNode(k):k);}
  return e;
}
function openDialog(opt){
  return new Promise(res=>{
    closeMenus();hideBubble();
    const prev=document.activeElement;
    const ov=el('div',{class:'ov'});
    const d=el('div',{class:'dlg',role:'dialog','aria-modal':'true','aria-label':opt.title});
    d.style.width=(opt.width||420)+'px';
    if(opt.heading!==false) d.appendChild(el('h2',{text:opt.title}));
    const body=el('div',{style:'display:flex;flex-direction:column;gap:10px;min-height:0'});d.appendChild(body);
    let done=false;
    const close=val=>{if(done)return;done=true;ov.remove();document.removeEventListener('keydown',kh,true);if(prev&&prev.focus)try{prev.focus();}catch(e){}res(val);};
    const api={close,el:d};
    if(opt.build) opt.build(body,api);
    let defBtn=null,cancelVal=null;
    if(opt.buttons&&opt.buttons.length){
      const row=el('div',{class:'dlg-btns'});
      for(const bt of opt.buttons){
        const b=el('button',{type:'button',class:'btn'+(bt.default?' default':'')+(bt.left?' left':''),text:bt.label});
        b.addEventListener('click',()=>{if(bt.onClick){const r=bt.onClick(api);if(r===false)return;}if(!bt.keep)close(bt.value);});
        if(bt.default)defBtn=b;
        if(bt.cancel)cancelVal=bt.value;
        row.appendChild(b);
      }
      d.appendChild(row);
    }
    const kh=e=>{
      if(ov.nextElementSibling&&ov.nextElementSibling.classList.contains('ov'))return;
      if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close(cancelVal);}
      else if(e.key==='Enter'&&defBtn&&!/TEXTAREA|SELECT|BUTTON/.test((e.target.tagName||''))){e.preventDefault();defBtn.click();}
    };
    document.addEventListener('keydown',kh,true);
    ov.appendChild(d);document.body.appendChild(ov);
    const f=d.querySelector('input:not([type=checkbox]):not([type=radio]),textarea')||defBtn||d.querySelector('button');
    if(f)setTimeout(()=>{try{f.focus();if(f.select&&f.tagName==='INPUT')f.select();}catch(e){}},0);
  });
}

async function offerFile(filename,data,mime){
  if(IS_ARTIFACT){
    try{
      const dl=await window.claude.use('downloads');
      if(dl){await dl.save({filename,data});return 'saved';}
    }catch(e){if(e&&e.code==='declined')return 'declined';return 'failed';}
    return 'failed';
  }
  try{
    const blob=data instanceof Blob?data:new Blob([data],{type:mime||'text/plain;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=el('a',{href:url,download:filename});document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    return 'saved';
  }catch(e){return 'failed';}
}
async function copyText(t){

  try{const x=el('textarea',{style:'position:fixed;left:-9999px'});x.value=t;document.body.appendChild(x);x.select();const ok=document.execCommand('copy');x.remove();return ok;}catch(e){return false;}
}

function slugCmd(label,sh){
  let base=label.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z]/g,'').toLowerCase()||'style';
  base=base.slice(0,24);
  const taken=c=>RESERVED.has(c)||sh.styles.some(s=>s.cmd===c);
  let c=base;
  if(taken(c)){c=base+'perso';let k=2;while(taken(c)){c=base+'perso'+'abcdefghij'[k%10];k++;}}
  return c;
}
function sampleFor(st){
  switch(st.kind){
    case 'title':return '\\'+st.cmd+'{Titre général du document}\nLe texte courant commence ici, sous le titre centré.';
    case 'heading':return '\\'+st.cmd+'{Titre d’exemple}\nLe texte courant suit le titre et montre l’espacement choisi.';
    case 'para':return 'Un paragraphe avant le style.\n\n\\'+st.cmd+'{Contenu du style « '+st.label+' ».}\n\nUn paragraphe après.';
    case 'env':return LISTS.includes(st.env)?'\\begin{'+st.env+'}\n\\item Premier point ;\n\\item Second point.\n\\end{'+st.env+'}':'\\begin{'+st.env+'}\nUne citation mise en valeur.\n\\end{'+st.env+'}';
    case 'body':return 'Premier paragraphe du corps de texte, assez long pour montrer la justification et l’alinéa.\n\nSecond paragraphe.';
    default:return 'Une phrase avec \\'+st.cmd+'{un passage stylé} au milieu.';
  }
}
function codeFor(st,sh){
  if(st.kind==='body') return ['% Police du document',...fontTeX(sh.page),'% Taille : option '+sh.page.size+'pt de \\documentclass','% Corps de texte',...styleTeX(st,sh)].join('\n');
  if(st.kind==='char') return '% Commande de base de LaTeX, utilisée telle quelle :\n\\'+st.cmd+'{…}';
  if(st.kind==='note') return '% Commande de base de LaTeX :\n\\footnote{Texte de la note}\n% La note est numérotée et renvoyée en bas de page.';
  const L=styleTeX(st,sh);
  if(st.kind==='env'&&!L.length) return '% Aucun réglage particulier :\n\\begin{'+st.env+'} … \\end{'+st.env+'}';
  return L.join('\n');
}

    if(/^\s*<!--.*-->\s*$/.test(l)){i++;continue;}
    if(/^```/.test(l)){closeLists(0);const b=[];i++;while(i<kept.length&&!/^```/.test(kept[i])){b.push(kept[i]);i++;}i++;out.push('\\begin{verbatim}',...b,'\\end{verbatim}','');continue;}
    if((m=/^(#{1,6})\s+(.*?)\s*#*\s*$/.exec(l))){closeLists(0);out.push('\\'+HC[Math.min(m[1].length,4)-1]+'{'+inl(m[2])+'}','');i++;continue;}
    if((m=/^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(l))){
      const depth=Math.floor(m[1].replace(/\t/g,'  ').length/2),env=/\d/.test(m[2])?'enumerate':'itemize';
      while(stack.length>depth+1)closeLists(stack.length-1);
      if(stack.length===depth+1&&stack[depth].env!==env)closeLists(depth);
      while(stack.length<depth+1){out.push(' '.repeat(stack.length*2)+'\\begin{'+env+'}');stack.push({env});}
      out.push(' '.repeat(stack.length*2)+'\\item '+inl(m[3]));i++;continue;
    }
    if(/^\s*>/.test(l)){closeLists(0);const b=[];while(i<kept.length&&/^\s*>/.test(kept[i])){b.push(kept[i].replace(/^\s*>\s?/,''));i++;}out.push('\\begin{quote}',b.map(x=>x.trim()?inl(x):'').join('\n').replace(/\n{3,}/g,'\n\n'),'\\end{quote}','');continue;}
    if(/^\s*\|.*\|\s*$/.test(l)&&i+1<kept.length&&/^\s*\|?\s*:?-{3,}/.test(kept[i+1])){
      closeLists(0);const rows=[];rows.push(l);i+=2;while(i<kept.length&&/^\s*\|.*\|\s*$/.test(kept[i])){rows.push(kept[i]);i++;}
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>inl(c.trim()));const cols=cells(rows[0]).length;
      out.push('\\begin{tabular}{|'+'l|'.repeat(cols)+'}','\\hline',...rows.map(r=>cells(r).join(' & ')+' \\\\'+'\n\\hline'),'\\end{tabular}','');continue;
    }
    if(/^\s*([-*_])\s*(\1\s*){2,}$/.test(l)){closeLists(0);out.push('');i++;continue;}
    if(!l.trim()){
      // liste « aérée » : une ligne vide entre deux éléments ne coupe pas la liste
      let j=i+1;while(j<kept.length&&!kept[j].trim())j++;
      if(stack.length&&j<kept.length&&/^(\s*)([-*+]|\d+[.)])\s+/.test(kept[j])){i=j;continue;}
      closeLists(0);out.push('');i++;continue;
    }
    if(stack.length&&/^\s+\S/.test(l)){out[out.length-1]+=' '+inl(l.trim());i++;continue;}
    closeLists(0);out.push(inl(l.replace(/\s+$/,'')));i++;
  }
  closeLists(0);
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}

/* ---------- Ce que chaque format garde ---------- */
const FMT_ORDER=['tex','typ','docx','odt','rtf','md','epub','pdf','txt'];
const EXPORTS={
  tex:{label:'LaTeX',ext:'tex',desc:'votre fichier de travail',mime:'application/x-tex'},
  typ:{label:'Typst',ext:'typ',desc:'le « nouveau LaTeX »',mime:'text/plain'},
  docx:{label:'Word',ext:'docx',desc:'le plus courant, recommandé'},
  odt:{label:'OpenDocument',ext:'odt',desc:'format ouvert de l’État'},
  rtf:{label:'RTF',ext:'rtf',desc:'s’ouvre partout',mime:'application/rtf'},
  pdf:{label:'PDF',ext:'pdf',desc:'rendu de l’aperçu'},
  epub:{label:'EPUB',ext:'epub',desc:'livre numérique'},
  md:{label:'Markdown',ext:'md',desc:'structure seule, se rouvre ici',mime:'text/markdown'},
  txt:{label:'Texte brut',ext:'txt',desc:'sans mise en forme',mime:'text/plain'}
};
const DL_ALLOWED=['txt','md','docx','epub','pdf','html','json'];
const FEATS=[
  ['titles','titres','ooooooooa'],['numbering','numérotation des titres','ooooaxooa'],['lists','listes','ooooooooa'],['notes','notes de bas de page','ooooooaaa'],
  ['bi','gras et italique','oooooooox'],['us','souligné et barré','oooooaoox'],['charte','polices, tailles et couleurs','ooaaaxaox'],['align','alignements','oooooxoox'],
  ['boxes','encadrés et citations','oooooaooa'],['tables','tableaux','ooooooooa'],['images','images','ooaaaoaax'],['math','équations','oaaaaoaaa'],['breaks','sauts de page','oooooxaox']
];
function docStats(nodes,sh){
  const s={title:0,heading:0,h1:0,list:0,fn:0,bi:0,u:0,st:0,align:0,custom:0,quote:0,table:0,img:0,math:0,brk:0,unk:0};
  const inl=ns=>{for(const n of ns||[]){
    if(n.t==='b'||n.t==='i')s.bi++;else if(n.t==='u')s.u++;else if(n.t==='s')s.st++;else if(n.t==='fn')s.fn++;else if(n.t==='img')s.img++;else if(n.t==='math')s.math++;else if(n.t==='unk')s.unk++;
    if(n.c)inl(n.c);}};
  const blk=ns=>{for(const n of ns||[]){
    switch(n.t){
      case 'title':s.title++;inl(n.c);break;
      case 'heading':s.heading++;if(n.level===0)s.h1++;inl(n.c);break;
      case 'para':inl(n.c);break;
      case 'list':s.list++;n.items.forEach(it=>blk(it.blocks));break;
      case 'custom':s.custom++;blk(n.blocks);break;
      case 'quote':s.quote++;blk(n.blocks);break;
      case 'align':s.align++;blk(n.blocks);break;
      case 'table':s.table++;n.rows.forEach(r=>r.cells.forEach(inl));break;
      case 'math':s.math++;break;
      case 'break':s.brk++;break;
      case 'unknown':if(n.env)s.unk++;blk(n.blocks);break;
      case 'group':blk(n.blocks);break;
    }}};
  blk(nodes);
  s.numbered=sh.page.numbered&&s.heading;
  return s;
}
function exportReport(fmt,s,sh){
  const k=FMT_ORDER.indexOf(fmt),ok=[],warn=[];
  const lm=['serif','sans','mono'].includes(sh.page.font);
  const lmTo={serif:'Cambria',sans:'Arial',mono:'Courier New'}[sh.page.font];
  const n=(x,one,many)=>x+' '+(x>1?many:one);
  const present={titles:s.title+s.heading,numbering:s.numbered,lists:s.list,notes:s.fn,bi:s.bi,us:s.u+s.st,charte:1,align:s.align+s.title,boxes:s.custom+s.quote,tables:s.table,images:s.img,math:s.math,breaks:s.brk};
  const MSG={
    numbering:{rtf:'Numéros des titres écrits en texte',md:'Numérotation des titres perdue',txt:'Numéros des titres écrits en texte'},
    titles:{txt:'Titres soulignés de = et de -'},
    lists:{txt:'Listes écrites avec des tirets'},
    notes:{epub:n(s.fn,'note placée','notes placées')+' en fin de chapitre',pdf:n(s.fn,'note regroupée','notes regroupées')+' en fin de document',txt:n(s.fn,'note renvoyée','notes renvoyées')+' en fin de texte'},
    bi:{txt:'Gras et italique perdus'},
    us:{md:'Souligné perdu (le barré est conservé)',txt:'Souligné et barré perdus'},
    charte:{docx:lm?'Police Latin Modern remplacée par '+lmTo:'',odt:lm?'Police Latin Modern remplacée par '+lmTo:'',rtf:lm?'Police Latin Modern remplacée par '+lmTo:'',
      md:'Polices, tailles et couleurs perdues : le Markdown ne garde que la structure',epub:'La liseuse peut imposer sa propre police',txt:'Aucune mise en forme : ni police, ni taille, ni couleur'},
    align:{md:'Alignements perdus (titre centré, drapeaux…)',txt:'Alignements perdus'},
    boxes:{md:n(s.custom,'encadré transformé','encadrés transformés')+' en citation',txt:'Encadrés tracés entre deux filets, citations en retrait'},
    tables:{txt:n(s.table,'tableau écrit','tableaux écrits')+' en colonnes alignées'},
    images:{docx:n(s.img,'image remplacée','images remplacées')+' par un cadre : insérez-la ensuite',odt:n(s.img,'image remplacée','images remplacées')+' par un cadre : insérez-la ensuite',rtf:n(s.img,'image remplacée','images remplacées')+' par un cadre',
      epub:n(s.img,'image remplacée','images remplacées')+' par un cadre',pdf:n(s.img,'image remplacée','images remplacées')+' par un cadre',txt:n(s.img,'image remplacée','images remplacées')+' par [Image : nom du fichier]'},
    math:{typ:n(s.math,'équation','équations')+' : la syntaxe Typst diffère, à réécrire',docx:n(s.math,'équation','équations')+' en texte brut',odt:n(s.math,'équation','équations')+' en texte brut',rtf:n(s.math,'équation','équations')+' en texte brut',
      epub:n(s.math,'équation affichée','équations affichées')+' en code',pdf:n(s.math,'équation affichée','équations affichées')+' en code',txt:'Équations écrites en code LaTeX'},
    breaks:{md:'Sauts de page perdus',epub:'Sauts de page : la liseuse découpe le texte elle-même',txt:'Sauts de page perdus'}
  };
  for(const [id,label,mx] of FEATS){
    if(!present[id])continue;
    let v=mx[k];
    if(id==='us'&&fmt==='md'&&!s.u)v='o';
    if(id==='charte'&&['docx','odt','rtf'].includes(fmt)&&!lm)v='o';
    if(v==='o')ok.push(label);
    else warn.push([v==='x'?'✗':'~',(MSG[id]&&MSG[id][fmt])||label+(v==='x'?' perdus':' adaptés')]);
  }
  if(fmt==='typ'&&s.img)warn.push(['~','Joignez les fichiers image, sinon Typst refusera de compiler']);
  if(fmt==='md'&&s.img)warn.push(['~','Images : simple lien vers le fichier, à joindre']);
  if(s.unk&&fmt!=='tex')warn.push(['~',n(s.unk,'commande LaTeX inconnue','commandes LaTeX inconnues')+' : le texte est gardé, la commande perdue']);
  if(fmt==='rtf'&&s.fn)warn.push(['~','TextEdit n’affiche pas les notes de bas de page (Word et LibreOffice, si)']);
  if(fmt==='epub'&&!s.h1)warn.push(['~','Aucun Titre 1 : le livre n’aura qu’un seul chapitre']);
  if(fmt==='pdf')warn.push(['~','Rendu de l’aperçu, pas de LaTeX : pour un PDF exact, compilez le .tex']);
  if(['typ','docx','odt','rtf','epub','pdf'].includes(fmt))warn.push(['~','Ne se rouvre pas dans Sobre TeX : gardez aussi le .tex']);
  if(fmt==='md')warn.push(['~','Se rouvre dans Sobre TeX, mais sans la feuille de style']);
  if(fmt==='txt')warn.push(['~','Se rouvre dans Sobre TeX comme texte à baliser']);
  let blocked=null;
  if(IS_ARTIFACT){
    if(fmt==='pdf')blocked='Indisponible dans le lien de test : l’impression y est bloquée. Utilisez la version fichier de Sobre TeX.';
    else if(fmt==='odt')blocked='Le lien de test ne peut pas télécharger de .odt. Utilisez la version fichier de Sobre TeX.';
    else if(!DL_ALLOWED.includes(EXPORTS[fmt].ext))warn.push(['~','Lien de test : le .'+EXPORTS[fmt].ext+' ne se télécharge pas ici. Sobre TeX proposera de copier le code ou de l’enregistrer en .txt']);
  }else if(fmt==='pdf')warn.push(['~','La fenêtre d’impression s’ouvrira : choisissez « Enregistrer au format PDF »']);
  if(blocked)warn.unshift(['✗',blocked]);
  return {ok,warn,blocked};
}

function textFallback(fname,text){
  openDialog({title:'Enregistrer '+fname,width:600,build:b=>{
    b.appendChild(el('p',{text:'Dans ce lien de test, le navigateur ne peut pas enregistrer de fichier .'+fname.split('.').pop()+' directement. Copiez le code, ou enregistrez-le en .txt puis renommez-le. La version fichier de Sobre TeX enregistre directement dans ce format.'}));
    const x=el('textarea',{class:'codearea',readonly:true,'aria-label':'Contenu du fichier'});x.value=text;b.appendChild(x);
  },buttons:[
    {label:'Enregistrer en .txt',left:true,keep:true,onClick:async()=>{const r=await offerFile(fname+'.txt',text);if(r==='saved')flash('Fichier proposé au téléchargement');else if(r==='failed')flash('Enregistrement impossible ici : utilisez « Copier »');}},
    {label:'Fermer',value:null,cancel:true},
    {label:'Copier',default:true,keep:true,onClick:async(api)=>{const ok=await copyText(text);if(ok){flash('Copié');api.close();}else{const x=api.el.querySelector('textarea');x.focus();x.select();flash('Copie bloquée : le texte est sélectionné, utilisez '+MOD+'C');}}}
  ]});
}
async function exportAs(fmt,name){
  const E=EXPORTS[fmt],fname=name+'.'+E.ext;
  if(fmt==='tex'){S.name=name;updateTitle();persist();return saveDoc();}
  if(fmt==='pdf'){printPreview();return;}
  const nodes=parseDoc(ta.value,S.sheet),title=docTitle(nodes,name);
  let data;
  try{
    switch(fmt){
      case 'md':data=toMarkdown(nodes,S.sheet);break;
      case 'txt':data=toText(nodes,S.sheet);break;
      case 'typ':data=toTypst(nodes,S.sheet);break;
      case 'rtf':data=toRtf(nodes,S.sheet);break;
      case 'docx':data=toDocx(nodes,S.sheet,title);break;
      case 'odt':data=toOdt(nodes,S.sheet,title);break;
      case 'epub':data=toEpub(nodes,S.sheet,title);break;
    }
  }catch(err){problem('L’export a échoué.','Une partie du document n’a pas pu être convertie ('+(err&&err.message||err)+'). Enregistrez le .tex et signalez le problème.');return;}
  if(IS_ARTIFACT&&!DL_ALLOWED.includes(E.ext)){if(typeof data==='string')textFallback(fname,data);return;}
  const r=await offerFile(fname,data,E.mime);
  if(r==='saved')flash('« '+fname+' » enregistré dans vos téléchargements');
  else if(r==='failed')problem('Enregistrement impossible.','Le navigateur a bloqué le téléchargement de « '+fname+' ».');
}

      {l:'Couper',k:MOD+'X',a:()=>doCopy(true)},{l:'Copier',k:MOD+'C',a:()=>doCopy(false)},{l:'Coller : utilisez '+MOD+'V',dis:true},
      {l:'Tout sélectionner',k:MOD+'A',a:()=>{ta.focus();ta.select();}},'-',
      {l:'Protéger les caractères spéciaux au collage',chk:P.escPaste,a:()=>{P.escPaste=!P.escPaste;persist();flash(P.escPaste?'Protection au collage activée':'Collage brut : le code LaTeX collé reste tel quel');}},
      {l:'Protéger % & $ # _ à la frappe',chk:P.escType,a:()=>{P.escType=!P.escType;persist();}}]},
    {id:'view',label:'Affichage',items:[
      {l:'Aperçu',chk:P.showPrev,a:togglePrev},{l:'Défilement synchronisé',chk:P.sync!==false,a:()=>{P.sync=P.sync===false;persist();flash(P.sync?'Défilement synchronisé':'Défilement indépendant');if(P.sync)syncFromEditor();}},{l:'Bulles d’aide détaillées',chk:P.bubbles,a:toggleBubbles},'-',
      {l:'Zoom ajusté à la fenêtre',chk:P.zoom==='fit',a:()=>setZoom('fit')},{l:'Zoom 75 %',chk:P.zoom==='0.75',a:()=>setZoom('0.75')},{l:'Zoom 100 %',chk:P.zoom==='1',a:()=>setZoom('1')},'-',
      ...SobreTheme.items()]},
    {id:'style',label:'Style',items:[
      {l:'Feuille de style…',a:styleSheet},{l:'Mise en page…',a:pageSetup},'-',
      {l:'Importer une charte…',a:importSheet},{l:'Exporter la charte…',a:()=>exportSheet()},{l:'Rétablir la charte par défaut…',a:resetSheet}]},
    {id:'win',label:'Fenêtre',items:[
      {l:'Réinitialiser la disposition',a:resetLayout},'-',
      {l:S.name+'.tex',a:()=>{activate('edit');ta.focus();}},{l:'Aperçu',a:()=>{if(!S.prefs.showPrev)togglePrev();else activate('prev');}}]},
    {id:'help',label:'Aide',items:[
      {l:'Document d’exemple',a:openSample},{l:'Comparer les formats…',a:compareFormats},{l:'Bulles d’aide détaillées',chk:P.bubbles,a:toggleBubbles},'-',
      {l:'À propos de Sobre TeX…',a:about}]}
  ];
}
let openMenuId=null,menuEl=null;
function buildMenubar(){
  const mb=$('#menubar');mb.innerHTML='';
  for(const m of menuDefs()){
    const b=el('button',{type:'button',class:'mb-btn'+(m.logo?' mb-logo':''),'aria-haspopup':'menu','aria-expanded':'false','data-menu':m.id,'aria-label':m.logo?m.label:null});
    if(m.logo)b.innerHTML=LOGO_SVG;else b.textContent=m.label;
    b.addEventListener('click',()=>{openMenuId===m.id?closeMenus():openMenu(m.id);});
    b.addEventListener('mouseenter',()=>{if(openMenuId&&openMenuId!==m.id)openMenu(m.id);});
    b.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();openMenu(m.id,true);}});
    mb.appendChild(b);
  }
  mb.appendChild(el('div',{class:'mb-spacer'}));
  const h=el('button',{type:'button',class:'mb-btn mb-help','aria-pressed':S.prefs.bubbles?'true':'false','aria-label':'Bulles d’aide','data-help':'help'});
  h.innerHTML='<svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12v8H8l-3 3v-3H2z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M6.3 5.6c0-1 .8-1.4 1.7-1.4s1.7.5 1.7 1.3c0 1.2-1.6 1.2-1.6 2.2" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="7.5" y="9" width="1.2" height="1.2" fill="currentColor"/></svg>';
  h.addEventListener('click',toggleBubbles);
  mb.appendChild(h);
}
function openMenu(id,focusFirst){
  closeMenus(true);
  const def=menuDefs().find(m=>m.id===id);if(!def)return;
  const btn=$('[data-menu="'+id+'"]');btn.setAttribute('aria-expanded','true');openMenuId=id;
  menuEl=el('div',{class:'menu',role:'menu','aria-label':def.label});
  for(const it of def.items){
    if(it==='-'){menuEl.appendChild(el('hr'));continue;}
    const b=el('button',{type:'button',role:it.chk!==undefined?'menuitemcheckbox':'menuitem','aria-checked':it.chk!==undefined?String(!!it.chk):null,disabled:!!it.dis});
    if(it.dot){const d=el('span',{style:'width:8px;height:8px;border:1px solid currentColor;display:inline-block;align-self:center;background:'+(it.dot==='none'?'transparent':'var(--'+it.dot+')')});b.appendChild(d);b.style.gap='8px';}
    b.appendChild(el('span',{text:it.l}));
    if(it.k)b.appendChild(el('span',{class:'k',text:it.k}));
    b.addEventListener('click',()=>{closeMenus();if(it.a)it.a();buildMenubar();});
    menuEl.appendChild(b);
  }
  menuEl.addEventListener('keydown',e=>{
    const items=$$('button:not([disabled])',menuEl);const i=items.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){e.preventDefault();(items[i+1]||items[0]).focus();}
    else if(e.key==='ArrowUp'){e.preventDefault();(items[i-1]||items[items.length-1]).focus();}
    else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const ids=menuDefs().map(m=>m.id);const k=ids.indexOf(openMenuId);openMenu(ids[(k+(e.key==='ArrowRight'?1:-1)+ids.length)%ids.length],true);}
    else if(e.key==='Escape'){e.preventDefault();const b=$('[data-menu="'+openMenuId+'"]');closeMenus();b&&b.focus();}
  });
  document.body.appendChild(menuEl);
  const r=btn.getBoundingClientRect();
  menuEl.style.top=(r.bottom)+'px';
  menuEl.style.left=Math.max(8,Math.min(r.left,window.innerWidth-menuEl.offsetWidth-8))+'px';
  if(focusFirst){const f=menuEl.querySelector('button:not([disabled])');f&&f.focus();}
}
function closeMenus(keepId){
  if(menuEl){menuEl.remove();menuEl=null;}
  $$('[data-menu]').forEach(b=>b.setAttribute('aria-expanded','false'));
  if(!keepId)openMenuId=null;
}
document.addEventListener('pointerdown',e=>{if(menuEl&&!e.target.closest('.menu')&&!e.target.closest('[data-menu]'))closeMenus();});
function setZoom(z){S.prefs.zoom=z;applyZoom();persist();}

/* =========================================================
   Bulles d'aide
   ========================================================= */
const HELP={
  new:{t:'Nouveau',d:'Ouvre une page vide. La feuille de style reste la même.'},
  open:{t:'Ouvrir',d:'Charge un fichier .tex. S’il vient de Sobre TeX, sa feuille de style revient avec lui.',k:MOD+'O'},
  save:{t:'Enregistrer',d:'Produit le fichier .tex complet : préambule, document et feuille de style.',k:MOD+'S'},
  print:{t:'Imprimer l’aperçu',d:'Imprime ou enregistre en PDF l’aperçu approché. Pour un PDF exact, compilez le .tex.',k:MOD+'P'},
  cut:{t:'Couper',d:'Retire la sélection et la garde dans le presse-papiers.',k:MOD+'X'},
  copy:{t:'Copier',d:'Copie la sélection. Recollée ici, elle reste du code et n’est pas protégée une seconde fois.',k:MOD+'C'},
  undo:{t:'Annuler',d:'Annule la dernière modification, y compris un style appliqué.',k:MOD+'Z'},
  redo:{t:'Rétablir',d:'Refait ce qui vient d’être annulé.',k:IS_MAC?'⇧⌘Z':'Ctrl+Y'},
  table:{t:'Tableau',c:'\\begin{tabular}{|l|l|} … \\end{tabular}',d:'Insère un tableau à deux colonnes. Le signe & sépare les cases, \\\\ termine une ligne.'},
  image:{t:'Image',c:'\\includegraphics[width=…]{fichier.png}',d:'Insère une image. Le fichier image doit accompagner le .tex à la compilation.'},
  pagebreak:{t:'Saut de page',c:'\\newpage',d:'Force la suite du texte à commencer sur une nouvelle page, dans le PDF comme dans l’aperçu.'},
  sheet:{t:'Feuille de style…',d:'Règle l’apparence de chaque style : police, taille, couleur, espacements. Le préambule LaTeX suit automatiquement.'},
  prev:{t:'Afficher ou masquer l’aperçu',d:'Affiche ou masque la fenêtre d’aperçu. L’aperçu est approché : seul LaTeX donne la mise en page exacte.'},
  preamble:{t:'Préambule',c:'\\documentclass … \\begin{document}',d:'Les réglages LaTeX écrits à partir de la feuille de style. Vous n’avez pas à les toucher.'},
  stylesel:{t:'Style du paragraphe',d:'Indique le style de la ligne où se trouve le curseur. Choisissez-en un autre pour l’appliquer.'},
  'save-ok':{t:'Dernière sauvegarde automatique',d:'Le document est gardé dans ce navigateur après chaque modification. Pour un fichier, enregistrez le .tex.'},
  'save-err':{t:'Échec de la sauvegarde automatique',d:'Le navigateur refuse de garder le document (navigation privée, stockage plein ou bloqué). Enregistrez le .tex sans attendre.',k:MOD+'S'},
  help:{t:'Bulles détaillées',d:'Ajoute aux bulles la commande LaTeX écrite par chaque bouton. Cliquez à nouveau pour revenir aux bulles courtes.'}
};
function helpFor(key){
  if(key&&key.startsWith('st:')){
    const st=styleById(key.slice(3));if(!st)return null;
    const k=SHORTCUTS[st.id]||st.k;
    switch(st.kind){
      case 'title':return {t:st.label,c:'\\'+st.cmd+'{…}',d:'Grand titre centré en tête du document. S’applique à toute la ligne où se trouve le curseur.'};
      case 'body':return {t:'Corps de texte',d:'Retire le style de la ligne ou de la liste : le texte redevient du texte courant.',k};
      case 'heading':return {t:st.label,c:'\\'+st.cmd+'{…}',d:'S’applique à toute la ligne où se trouve le curseur. Un second clic retire le titre.',k};
      case 'para':return {t:st.label+' (style maison)',c:'\\'+st.cmd+'{…}',d:'Entoure les lignes sélectionnées. Son apparence se règle dans la feuille de style.'};
      case 'env':if(st.direct)return {t:st.label,c:'\\begin{'+st.env+'}\n  …\n\\end{'+st.env+'}',d:'S’applique aux lignes sélectionnées. Un second clic retire l’alignement.'};
        return {t:st.label,c:'\\begin{'+st.env+'}\n'+(LISTS.includes(st.env)?'  \\item …\n':'  …\n')+'\\end{'+st.env+'}',d:LISTS.includes(st.env)?'Chaque ligne sélectionnée devient un élément de liste.':'Met les lignes sélectionnées en retrait.'};
      case 'note':return {t:'Note de bas de page',c:'\\footnote{…}',d:'Sélectionnez le texte de la note, ou cliquez à l’endroit du renvoi puis tapez la note entre les accolades.'};
      case 'charc':return {t:st.label+' (style maison)',c:'\\'+st.cmd+'{…}',d:'Entoure la sélection. Un second clic retire le style.'};
      default:return {t:st.label,c:'\\'+st.cmd+'{…}',d:'Entoure la sélection de la commande. Un second clic retire le style.',k};
    }
  }
  if(key&&key.startsWith('al:')){const a=ALIGNS.find(x=>x[0]===key.slice(3));return a?{t:a[1]}:null;}
  return HELP[key]||null;
}
const bubble=$('#bubble');
let bubbleTimer=null,bubbleFor=null;
function showBubble(target){
  if(bubbleFor===target)return;
  clearTimeout(bubbleTimer);bubbleFor=target;
  bubbleTimer=setTimeout(()=>drawBubble(target),bubble.hidden?380:60);
}
function drawBubble(target){
  if(menuEl||document.querySelector('.ov'))return;
  const h=helpFor(target.dataset.help);if(!h)return;
  const full=S.prefs.bubbles;
  bubble.innerHTML='<div class="t">'+escH(h.t)+(h.k?'<span class="k">'+escH(h.k)+'</span>':'')+'</div>'+(full&&h.c?'<code>'+escH(h.c)+'</code>':'')+(full&&h.d?'<div class="d">'+escH(h.d)+'</div>':'');
  bubble.hidden=false;
  const r=target.getBoundingClientRect();
  const bw=bubble.offsetWidth,bh=bubble.offsetHeight;
  let x=Math.min(Math.max(8,r.left),window.innerWidth-bw-8);
  let y=r.bottom+6;if(y+bh>window.innerHeight-8)y=r.top-bh-6;
  bubble.style.left=x+'px';bubble.style.top=Math.max(8,y)+'px';
}
function hideBubble(){clearTimeout(bubbleTimer);bubbleFor=null;bubble.hidden=true;}
document.addEventListener('pointerdown',hideBubble,true);
document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-help]');if(t)showBubble(t);else hideBubble();});
document.addEventListener('focusin',e=>{const t=e.target.closest&&e.target.closest('[data-help]');if(t)showBubble(t);else hideBubble();});
function toggleBubbles(){S.prefs.bubbles=!S.prefs.bubbles;persist();buildMenubar();hideBubble();flash(S.prefs.bubbles?'Bulles détaillées : la commande LaTeX s’affiche au survol':'Bulles courtes : le nom du bouton seulement');}

/* =========================================================
   Saisie, collage, raccourcis
   ========================================================= */
ta.addEventListener('input',onEdit);
ta.addEventListener('beforeinput',e=>{
  if(!S.prefs.escType||e.inputType!=='insertText'||!e.data||e.data.length!==1||'%&$#_'.indexOf(e.data)<0)return;
  const p=ta.selectionStart;if(ta.value[p-1]==='\\'&&!isEsc(ta.value,p-1))return;
  e.preventDefault();const d=e.data;queueMicrotask(()=>insertAtSel('\\'+d));
});
ta.addEventListener('copy',()=>{S.lastCopied=ta.value.slice(ta.selectionStart,ta.selectionEnd);});
ta.addEventListener('cut',()=>{S.lastCopied=ta.value.slice(ta.selectionStart,ta.selectionEnd);});
ta.addEventListener('paste',e=>{
  if(!S.prefs.escPaste)return;
  const raw=e.clipboardData&&e.clipboardData.getData('text/plain');if(raw==null||raw==='')return;
  if(S.lastCopied!=null&&raw===S.lastCopied)return;
  e.preventDefault();
  const r=escapeTeX(normalizePaste(raw));
  insertAtSel(r.text);
  if(r.count)flash('Collage : '+r.count+' caractère'+(r.count>1?'s':'')+' spécia'+(r.count>1?'ux protégés':'l protégé'));
});
['keyup','mouseup','focus'].forEach(t=>ta.addEventListener(t,()=>updateContext()));
document.addEventListener('selectionchange',()=>{if(document.activeElement===ta)updateContext();});
document.addEventListener('keydown',e=>{
  if(document.querySelector('.ov'))return;
  const mod=e.metaKey||e.ctrlKey;
  if(e.key==='Escape'&&menuEl){closeMenus();return;}
  if(!mod)return;
  const k=e.key.toLowerCase();
  if(e.altKey&&/^Digit[0-3]$/.test(e.code)){e.preventDefault();applyStyle(['body','h1','h2','h3'][+e.code.slice(5)]);ta.focus();return;}
  if(e.altKey||e.shiftKey&&k!=='z')return;
  if(k==='b'){e.preventDefault();applyStyle('fb');ta.focus();}
  else if(k==='i'){e.preventDefault();applyStyle('fi');ta.focus();}
  else if(k==='u'){e.preventDefault();applyStyle('fu');ta.focus();}
  else if(k==='s'){e.preventDefault();saveDoc();}
  else if(k==='o'){e.preventDefault();openDoc();}
  else if(k==='p'&&!IS_ARTIFACT){e.preventDefault();printPreview();}
});

/* Boutons à action directe */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const f=ACT[b.dataset.act];if(f)f();
});
$('#w-edit .tb').addEventListener('dblclick',e=>{if(!e.target.closest('button'))renameDoc();});
if(IS_ARTIFACT)$$('[data-local-only]').forEach(x=>x.hidden=true);

/* =========================================================
   Démarrage
   ========================================================= */
restore();
buildMenubar();
persist();
refreshAll();
placeWins();
if(window.ResizeObserver){new ResizeObserver(()=>applyZoom()).observe($('#pv-scroll'));}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{renderHL();applyZoom();});
ta.focus();ta.setSelectionRange(0,0);
updateContext();

$('#quit button').addEventListener('click',()=>{$('#quit').hidden=true;ta.focus();});

/* Alerte à la fermeture si le .tex n'a pas été enregistré */
window.addEventListener('beforeunload',e=>{
  if(S.dirty&&ta.value.trim()){e.preventDefault();e.returnValue='';return '';}
});

/* Page d'accueil : 3 secondes, ou un clic, ou une touche */
const splash=$('#splash');
$('.sp-ver',splash).textContent=VERSION;
function closeSplash(){
  if(splash.dataset.closing)return;
  splash.dataset.closing='1';
  document.removeEventListener('keydown',splashKey,true);
  splash.classList.add('out');
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  setTimeout(()=>{splash.hidden=true;placeWins();applyZoom();ta.focus();offerRecovery();},reduce?0:260);
}
function splashKey(e){if(['Shift','Control','Alt','Meta'].includes(e.key))return;e.preventDefault();e.stopPropagation();closeSplash();}
splash.addEventListener('click',closeSplash);
document.addEventListener('keydown',splashKey,true);
$('.sp-fill',splash).addEventListener('animationend',closeSplash);
})();
</script>
